<!doctype html><meta charset="utf-8"><title>Android native RTC VM acceptance</title>
<video id="screen" autoplay muted playsinline></video>
<script type="module">
import { BrowserManualPeer } from '/vm/browser-webrtc.mjs';
const video = document.querySelector('video');
window.vm = { ready: true, acknowledged: 0, decoded: 0, errors: [] };
const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
let iceServers = [];
window.configureVmIce = servers => { iceServers = servers; };
window.probeRelay = async credential => {
  const servers = credential ? iceServers.map(server => ({ ...server, credential })) : iceServers;
  const pc = new RTCPeerConnection({ iceServers: servers, iceTransportPolicy: 'relay' });
  const candidates = [], errors = [];
  pc.onicecandidate = event => { if (event.candidate) candidates.push(event.candidate.type); };
  pc.onicecandidateerror = event => errors.push({ code: event.errorCode, text: event.errorText });
  try {
    pc.createDataChannel('relay-probe');
    await pc.setLocalDescription(await pc.createOffer());
    for (let i = 0; i < 80 && !candidates.includes('relay'); i++) await delay(100);
    return { candidates, errors, gathering: pc.iceGatheringState };
  } finally { pc.close(); }
};
window.beginNative = async config => {
  let cursor = 0;
  let pc;
  let lastFrame = 0, frameCallbacks = 0;
  let observingIdle = false, maxIdleFrameGap = 0;
  const observeFrame = () => {
    const now = performance.now();
    if (observingIdle && lastFrame) maxIdleFrameGap = Math.max(maxIdleFrameGap, now - lastFrame);
    lastFrame = now; frameCallbacks++;
    video.requestVideoFrameCallback(observeFrame);
  };
  video.requestVideoFrameCallback(observeFrame);
  window.vm.beginIdleObservation = () => { maxIdleFrameGap = 0; observingIdle = true; };
  const post = async (operation, extra = {}) => {
    const response = await fetch('/vm/' + operation, { method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-VM-Bridge': config.bridge },
      body: JSON.stringify({ sessionId: config.sessionId, viewerToken: config.viewerToken, ...extra }) });
    const result = await response.json();
    if (!response.ok || !result.ok) throw new Error('fixture operation refused: ' + operation);
    return result.result;
  };
  const viewer = new BrowserManualPeer({ role: 'viewer', waitForManualAck: true,
    iceServers,
    rtcFactory: options => {
      pc = new RTCPeerConnection({ ...options, iceTransportPolicy: 'relay' });
      pc.addEventListener('icecandidateerror', event => window.vm.errors.push({ code: event.errorCode, text: event.errorText }));
      return pc;
    },
    sendSignal: signal => post('signal', { signal }),
    onStream: stream => { video.srcObject = stream; video.play().catch(error => window.vm.errors.push(error.message)); },
    onState: state => { window.vm.state = state; },
    onManualAcknowledged: sequence => { window.vm.acknowledged = sequence; },
  });
  window.vm.send = command => viewer.sendManual(command);
  window.vm.stats = async () => {
    const reports = await pc.getStats();
    const transport = [...reports.values()].find(item => item.type === 'transport' && item.selectedCandidatePairId);
    const pair = transport && reports.get(transport.selectedCandidatePairId);
    return { state: window.vm.state, closed: viewer.closed, acknowledged: window.vm.acknowledged,
      width: video.videoWidth, height: video.videoHeight, decoded: video.getVideoPlaybackQuality().totalVideoFrames,
      frameCallbacks, frameAgeMs: lastFrame ? performance.now() - lastFrame : null,
      maxIdleFrameGapMs: observingIdle && lastFrame ? Math.max(maxIdleFrameGap, performance.now() - lastFrame) : null,
      localType: pair && reports.get(pair.localCandidateId)?.candidateType,
      remoteType: pair && reports.get(pair.remoteCandidateId)?.candidateType,
      gathering: pc.iceGatheringState, ice: pc.iceConnectionState,
      candidates: [...reports.values()].filter(item => ['local-candidate','remote-candidate'].includes(item.type))
        .map(item => ({ side: item.type, candidate: item.candidateType, protocol: item.protocol })),
      errors: window.vm.errors };
  };
  window.vm.pixel = (x, y) => {
    const canvas = document.createElement('canvas'); canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    const context = canvas.getContext('2d'); context.drawImage(video, 0, 0);
    return [...context.getImageData(Math.floor(x * canvas.width), Math.floor(y * canvas.height), 1, 1).data];
  };
  const contentPixels = () => {
    // Exclude system bars; only a change in the received app content counts.
    const canvas = document.createElement('canvas'); canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    const context = canvas.getContext('2d'); context.drawImage(video, 0, 0);
    return context.getImageData(Math.floor(canvas.width * .1), Math.floor(canvas.height * .2),
      Math.floor(canvas.width * .8), Math.floor(canvas.height * .6)).data;
  };
  let markedContent;
  window.vm.markContent = () => { markedContent = contentPixels(); };
  window.vm.contentChange = () => {
    const pixels = contentPixels();
    if (!markedContent || markedContent.length !== pixels.length) throw new Error('Content dimensions changed');
    let changed = 0;
    for (let i = 0; i < pixels.length; i += 4) {
      const difference = Math.abs(pixels[i] - markedContent[i]) + Math.abs(pixels[i + 1] - markedContent[i + 1]) +
        Math.abs(pixels[i + 2] - markedContent[i + 2]);
      if (difference > 90) changed++;
    }
    return changed / (pixels.length / 4);
  };
  await viewer.startViewer();
  void (async () => {
    while (!viewer.closed) {
      if (window.vm.pausePolling) { await delay(100); continue; }
      try {
        const batch = await post('poll', { ack: cursor });
        for (const signal of batch.signals) await viewer.receiveSignal(signal);
        cursor = batch.cursor;
      } catch (error) {
        // Retain RTC: revocation must be enforced by the Android status/media boundary.
        window.vm.errors.push(error.message); window.vm.pollRefused = true; break;
      }
      await delay(150);
    }
  })();
};
</script>
