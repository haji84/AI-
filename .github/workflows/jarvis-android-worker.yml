name: JARVIS Android Worker

on:
  pull_request:
    paths:
      - 'android/jarvis-worker/**'
      - '.github/workflows/jarvis-android-worker.yml'
  push:
    branches: [main]
    paths:
      - 'android/jarvis-worker/**'
      - '.github/workflows/jarvis-android-worker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build unsigned release APK
        run: gradle -p android/jarvis-worker :app:testReleaseUnitTest :app:assembleRelease --stacktrace
      - name: Verify installation certificate configuration
        shell: bash
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=JARVIS disposable CI fixture' -addext 'subjectAltName=IP:192.168.0.2' \
            -keyout "$RUNNER_TEMP/jarvis-fixture.key" -out "$RUNNER_TEMP/jarvis-fixture.crt" 2>/dev/null
          gradle -p android/jarvis-worker :app:assembleDebug \
            -PjarvisBootstrapUrl=https://192.168.0.2:8792 \
            -PjarvisCaCertificate="$RUNNER_TEMP/jarvis-fixture.crt" --stacktrace
      - name: Verify APK
        run: test -s android/jarvis-worker/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-worker-apk
          path: android/jarvis-worker/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

  deploy-mac:
    needs: android-worker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: jarvis-worker-apk
          path: ${{ runner.temp }}/jarvis-worker
      - name: Ensure APK signing tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v sdkmanager >/dev/null 2>&1; then
            brew install --cask android-commandlinetools
          fi
          SDK_ROOT="$HOME/Library/Android/sdk"
          mkdir -p "$SDK_ROOT"
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          if [[ ! -x "$SDK_ROOT/build-tools/36.0.0/apksigner" ]]; then
            sdkmanager --sdk_root="$SDK_ROOT" 'build-tools;36.0.0'
          fi
          test -x "$SDK_ROOT/build-tools/36.0.0/apksigner"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - name: Sign and publish APK to resident Broker
        shell: bash
        run: |
          set -euo pipefail
          STATE_ROOT="$HOME/Library/Application Support/JARVIS"
          KEYSTORE="$STATE_ROOT/jarvis-worker-signing.jks"
          PASS_FILE="$STATE_ROOT/jarvis-worker-signing.pass"
          UNSIGNED="$RUNNER_TEMP/jarvis-worker/app-release-unsigned.apk"
          SIGNED="$STATE_ROOT/jarvis-worker.apk"
          mkdir -p "$STATE_ROOT"
          chmod 700 "$STATE_ROOT"
          if [[ ! -s "$PASS_FILE" ]]; then
            umask 077
            openssl rand -hex 24 > "$PASS_FILE"
          fi
          STORE_PASS="$(cat "$PASS_FILE")"
          if [[ ! -s "$KEYSTORE" ]]; then
            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE" \
              -storepass "$STORE_PASS" \
              -keypass "$STORE_PASS" \
              -alias jarvis-worker \
              -keyalg RSA -keysize 4096 -validity 36500 \
              -dname 'CN=JARVIS Worker, OU=AI Company, O=Owner Managed, C=JP'
            chmod 600 "$KEYSTORE"
          fi
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias jarvis-worker \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$STORE_PASS" \
            --out "$SIGNED" "$UNSIGNED"
          chmod 600 "$SIGNED"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$SIGNED"
          shasum -a 256 "$SIGNED"
          launchctl kickstart -k "gui/$(id -u)/com.aicompany.jarvis-broker" >/dev/null 2>&1 || true
      - name: Publish signed APK at stable GitHub URL
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATE_ROOT="$HOME/Library/Application Support/JARVIS"
          SIGNED="$STATE_ROOT/jarvis-worker.apk"
          TAG="jarvis-worker-latest"
          test -s "$SIGNED"
          if ! command -v gh >/dev/null 2>&1; then
            brew install gh
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "JARVIS Worker" \
              --notes "Stable signed JARVIS Worker APK. The asset at this tag is replaced automatically on every Worker build."
          fi
          gh release upload "$TAG" "$SIGNED#jarvis-worker.apk" --clobber --repo "$GITHUB_REPOSITORY"
          FIXED_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/jarvis-worker.apk"
          TMP_RELEASE="$RUNNER_TEMP/jarvis-worker-release.apk"
          curl -fsSL --retry 5 --retry-delay 2 "$FIXED_URL" -o "$TMP_RELEASE"
          test -s "$TMP_RELEASE"
          cmp -s "$SIGNED" "$TMP_RELEASE"
          echo "JARVIS Worker stable APK URL verified: $FIXED_URL"
      - name: Verify resident Broker serves Worker APK
        shell: bash
        run: |
          set -euo pipefail
          STATE_ROOT="$HOME/Library/Application Support/JARVIS"
          ENV_FILE="$STATE_ROOT/jarvis.env"
          test -s "$STATE_ROOT/jarvis-worker.apk"
          test -s "$ENV_FILE"
          set -a
          source "$ENV_FILE"
          set +a
          for _ in $(seq 1 20); do
            HEALTH="$(curl -fsS --max-time 3 http://127.0.0.1:8787/health 2>/dev/null || true)"
            if printf '%s' "$HEALTH" | grep -q '"workerApkReady":true'; then break; fi
            sleep 1
          done
          printf '%s\n' "$HEALTH" | grep -q '"workerApkReady":true'
          TMP_APK="$RUNNER_TEMP/jarvis-worker-served.apk"
          curl -fsS --max-time 10 http://127.0.0.1:8787/downloads/jarvis-worker.apk -o "$TMP_APK"
          test -s "$TMP_APK"
          cmp -s "$STATE_ROOT/jarvis-worker.apk" "$TMP_APK"
          echo 'JARVIS Worker APK: Broker distribution verified'
