name: JARVIS Android Worker

on:
  pull_request:
    paths:
      - 'android/jarvis-worker/**'
      - '.github/workflows/jarvis-android-worker.yml'
  push:
    branches: [main]
    paths:
      - 'android/jarvis-worker/**'
      - '.github/workflows/jarvis-android-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build debug APK
        run: gradle -p android/jarvis-worker :app:assembleDebug --stacktrace
      - name: Verify APK
        run: test -s android/jarvis-worker/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-worker-apk
          path: android/jarvis-worker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
