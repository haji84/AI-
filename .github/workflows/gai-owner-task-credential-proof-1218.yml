name: GORIQ 1218 Ephemeral Password Task Retention Proof
# PROPOSED REVIEW ARTIFACT. Do not install/dispatch before the distinct Human Gate.
on:
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        default: false
        description: 'Separate explicit temporary credential/task/conditional batch-right Human Gate required'
      approval_base64:
        type: string
        required: false
        description: 'Original nonsecret exact-source two-hour one-job approval; no password, private path or runtime receipt'
permissions:
  contents: read
concurrency:
  group: goriq-1218-ephemeral-password-proof
  cancel-in-progress: false
jobs:
  proof:
    if: github.repository == 'haji84/AI-' && github.ref == 'refs/heads/main' && github.actor == 'haji84'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Require exact current main with successful CI
        env:
          GORIQ_PC_APPROVED_REVISION: ${{ github.sha }}
        run: node scripts/goriq-pc-approved-source.mjs
      - name: Inert plan or separately approved isolated credential-retention fixture
        env:
          GORIQ_FIXTURE_APPLY: ${{ inputs.apply }}
          GORIQ_FIXTURE_APPROVAL_BASE64: ${{ inputs.approval_base64 }}
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path .gai-results | Out-Null
          $shell=Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $script=Join-Path $env:GITHUB_WORKSPACE 'scripts\owner-code-task-credential-retention-proof-1218.ps1'
          $result=Join-Path $env:GITHUB_WORKSPACE '.gai-results\password-task-retention-proof.json'
          $approval=Join-Path $env:RUNNER_TEMP ('goriq-r05-original-approval-'+$env:GITHUB_RUN_ID+'.json')
          $created=$false;$started=$false;$proofExit=1
          try {
            if($env:GORIQ_FIXTURE_APPLY -eq 'true'){
              $encoded=$env:GORIQ_FIXTURE_APPROVAL_BASE64
              if(-not $encoded -or $encoded.Length -gt 43692 -or $encoded -cnotmatch '^[A-Za-z0-9+/]+={0,2}$'){throw 'PROOF_APPROVAL_REQUIRED'}
              $bytes=[Convert]::FromBase64String($encoded)
              if($bytes.Length -gt 32768 -or [Convert]::ToBase64String($bytes) -cne $encoded){throw 'PROOF_APPROVAL_REQUIRED'}
              $stream=[IO.File]::Open($approval,[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::None)
              $created=$true
              try{$stream.Write($bytes,0,$bytes.Length)}finally{$stream.Dispose()}
              # Public provenance budget includes checkout/setup/source checks from actual job start.
              $jobsUrl='https://api.github.com/repos/haji84/AI-/actions/runs/'+$env:GITHUB_RUN_ID+'/attempts/1/jobs?per_page=100'
              $response=Invoke-WebRequest -UseBasicParsing -MaximumRedirection 0 -TimeoutSec 15 -Uri $jobsUrl -Headers @{Accept='application/vnd.github+json'}
              if([Text.Encoding]::UTF8.GetByteCount($response.Content) -gt 65536){throw 'PROOF_JOB_BUDGET_REQUIRED'}
              $jobs=$response.Content|ConvertFrom-Json
              if($jobs.total_count -ne 1 -or @($jobs.jobs).Count -ne 1){throw 'PROOF_JOB_BUDGET_REQUIRED'}
              $job=$jobs.jobs[0]
              if($job.name -cne 'proof' -or [string]$job.run_id -cne $env:GITHUB_RUN_ID -or $job.run_attempt -ne 1 -or $job.head_sha -cne $env:GITHUB_SHA -or $job.status -cne 'in_progress' -or $job.completed_at){throw 'PROOF_JOB_BUDGET_REQUIRED'}
              $jobStart=[datetimeoffset]::Parse($job.started_at)
              $jobLimit=$jobStart.AddMinutes(14)
              $original=[Text.Encoding]::UTF8.GetString($bytes)|ConvertFrom-Json
              $scopeLimit=[datetimeoffset]::Parse($original.expiresAt)
              $launch=[datetimeoffset]::UtcNow
              if($jobStart -gt $launch -or ($jobLimit-$launch).TotalSeconds -lt 660 -or ($scopeLimit-$launch).TotalSeconds -lt 660){throw 'PROOF_JOB_BUDGET_REQUIRED'}
              $wrapperLimit=$launch.AddSeconds(660)
              $clock=[Diagnostics.Stopwatch]::StartNew()
              $info=[Diagnostics.ProcessStartInfo]::new()
              $info.FileName=$shell
              $info.Arguments='-NoLogo -NoProfile -NonInteractive -File "'+$script+'" -Apply -ApprovalPath "'+$approval+'"'
              $info.UseShellExecute=$false;$info.CreateNoWindow=$true
              $info.RedirectStandardOutput=$true;$info.RedirectStandardError=$true
              $info.EnvironmentVariables['GORIQ_PROOF_PROCESS_DEADLINE_UTC']=$wrapperLimit.ToString('o')
              $process=[Diagnostics.Process]::new();$process.StartInfo=$info
              try{
                if(-not $process.Start()){throw 'PROOF_PROCESS_START_FAILED'}
                $started=$true
                $stdout=$process.StandardOutput.ReadToEndAsync();$stderr=$process.StandardError.ReadToEndAsync()
                while(-not $process.WaitForExit(250)){
                  if([datetimeoffset]::UtcNow -ge $wrapperLimit -or $clock.Elapsed.TotalSeconds -ge 660){$process.Kill();throw 'PROOF_PROCESS_TIMEOUT'}
                }
                if([datetimeoffset]::UtcNow -ge $wrapperLimit -or $clock.Elapsed.TotalSeconds -ge 660){throw 'PROOF_PROCESS_TIMEOUT'}
                if(-not $stdout.Wait(1000) -or -not $stderr.Wait(1000)){throw 'PROOF_PROCESS_PROTOCOL_FAILED'}
                $wire=$stdout.Result.Trim()
                if($stderr.Result.Length -ne 0 -or [Text.Encoding]::UTF8.GetByteCount($wire) -gt 65536){throw 'PROOF_PROCESS_PROTOCOL_FAILED'}
                $closed=$wire|ConvertFrom-Json
                $expected=@('schemaVersion','issue','operation','complete','mode','failureCode','failedStage','cleanupFailureCode','sourceRevision','scriptSha256','approvalSha256','runId','runAttempt','attemptId','validationAccepted','accountCreated','taskCreated','conditionalBatchRightAdded','baselineRan','changedRan','restoredRan','actualAccountSidMatched','passwordLogonPreserved','limitedPrincipalPreserved','nonActionDefinitionPreserved','taskSecurityPreserved','actionRestored','updateOmittedUserAndPassword','restoreOmittedUserAndPassword','allThreeActionFieldsChanged','windowsBuild','taskRemoved','accountRemoved','ownProfileRemovedOrAbsent','ownBatchRightRemovedOrAbsent','ownFilesRemoved','cleanupVerified','existingTaskTouched','productionTouched','deadlineBudgetAdmitted','forwardCompleted','finalDeadlineValid','forwardDeadlineExceeded','cleanupDeadlineExceeded','hardDeadlineExceeded','credentialValueEmitted','rawIdentityOrPathEmitted','nativeZBookAcceptanceCredit')
                $actual=@($closed.PSObject.Properties.Name)
                if($actual.Count -ne $expected.Count -or @($actual|Where-Object {$_ -cnotin $expected}).Count -ne 0 -or $closed.schemaVersion -ne 2 -or $closed.issue -ne 1218 -or $closed.complete -isnot [bool]){throw 'PROOF_PROCESS_PROTOCOL_FAILED'}
                if($process.ExitCode -ne $(if($closed.complete){0}else{1})){throw 'PROOF_PROCESS_PROTOCOL_FAILED'}
                if($closed.complete -and ($closed.mode -cne 'APPLY' -or -not $closed.finalDeadlineValid -or -not $closed.cleanupVerified -or $closed.sourceRevision -cne $env:GITHUB_SHA)){throw 'PROOF_PROCESS_PROTOCOL_FAILED'}
                if([datetimeoffset]::UtcNow -ge $wrapperLimit -or $clock.Elapsed.TotalSeconds -ge 660){throw 'PROOF_PROCESS_TIMEOUT'}
                $wire|Set-Content -LiteralPath $result -Encoding UTF8
                if([datetimeoffset]::UtcNow -ge $wrapperLimit -or $clock.Elapsed.TotalSeconds -ge 660){throw 'PROOF_PROCESS_TIMEOUT'}
                $proofExit=$process.ExitCode
              }finally{
                if($started -and -not $process.HasExited){$process.Kill()}
                $process.Dispose();$clock.Stop()
              }
            }else{
              & $shell -NoLogo -NoProfile -NonInteractive -File $script | Tee-Object -FilePath $result
            }
            if($env:GORIQ_FIXTURE_APPLY -ne 'true'){$proofExit=$LASTEXITCODE}
          }catch{
            $known=@('PROOF_APPROVAL_REQUIRED','PROOF_JOB_BUDGET_REQUIRED','PROOF_PROCESS_START_FAILED','PROOF_PROCESS_TIMEOUT','PROOF_PROCESS_PROTOCOL_FAILED')
            $code=if([string]$_.Exception.Message -cin $known){[string]$_.Exception.Message}else{'PROOF_WRAPPER_FAILED'}
            @{schemaVersion=2;issue=1218;operation='ephemeral-password-task-retention-proof';mode='WRAPPER_ERROR';complete=$false;failureCode=$code;childStarted=$started;potentialOwnedObjectsRemaining=$started;cleanupVerified=$false;credentialValueEmitted=$false;nativeZBookAcceptanceCredit=0}|ConvertTo-Json -Compress|Set-Content -LiteralPath $result -Encoding UTF8
            $proofExit=1
          }finally{
            if($created -and (Test-Path -LiteralPath $approval)){Remove-Item -LiteralPath $approval -Force}
          }
          if($proofExit -ne 0){exit $proofExit}
      - name: Retain closed proof only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goriq-1218-password-task-retention-proof
          path: .gai-results/password-task-retention-proof.json
          if-no-files-found: error
          retention-days: 14

