name: GORIQ 1218 Ephemeral Password Task Retention Proof
# PROPOSED REVIEW ARTIFACT. Do not install/dispatch before the distinct Human Gate.
on:
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        default: false
        description: 'Separate explicit temporary credential/task/conditional batch-right Human Gate required'
      approval_base64:
        type: string
        required: false
        description: 'Original nonsecret exact-source two-hour one-job approval; no password, private path or runtime receipt'
permissions:
  contents: read
concurrency:
  group: goriq-1218-ephemeral-password-proof
  cancel-in-progress: false
jobs:
  proof:
    if: github.repository == 'haji84/AI-' && github.ref == 'refs/heads/main' && github.actor == 'haji84'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Require exact current main with successful CI
        env:
          GORIQ_PC_APPROVED_REVISION: ${{ github.sha }}
        run: node scripts/goriq-pc-approved-source.mjs
      - name: Inert plan or separately approved isolated credential-retention fixture
        env:
          GORIQ_FIXTURE_APPLY: ${{ inputs.apply }}
          GORIQ_FIXTURE_APPROVAL_BASE64: ${{ inputs.approval_base64 }}
        shell: powershell
        run: |
          function Assert-R05ClosedKeys($Value,[string[]]$Expected) {
           if($Value -isnot [pscustomobject]){throw 'PROOF_PROCESS_PROTOCOL_FAILED'}
           $keys=@($Value.PSObject.Properties.Name)
           if($keys.Count -ne $Expected.Count -or @($keys|Where-Object {$_ -cnotin $Expected}).Count -ne 0){throw 'PROOF_PROCESS_PROTOCOL_FAILED'}
          }
          function Assert-R05WireInteger($Value,[long]$Minimum,[long]$Maximum) {
           if(($Value -isnot [int] -and $Value -isnot [long]) -or $Value -lt $Minimum -or $Value -gt $Maximum){throw 'PROOF_PROCESS_PROTOCOL_FAILED'}
          }
          function Assert-R05WireFault($Fault) {
           if($null -eq $Fault){return}
           Assert-R05ClosedKeys $Fault @('component','operation','origin','callState','exceptionKind','hresult','win32NativeCode','cimNativeCode','cimStatusCode','cimProviderErrorCode')
           $domains=@{
            component=@('FORWARD','TASK','ACCOUNT_DISABLE','BATCH_RIGHT','PROFILE','ACCOUNT_REMOVE','FILES','NONE');
            operation=@('TASK_ACTION_UPDATE','TASK_ACTION_RESTORE','PROFILE_QUERY','PROFILE_REMOVE','PROFILE_READBACK','OTHER');
            origin=@('PRE_GUARD','CALL_THROW','POST_GUARD','SOURCE_REFUSAL','UNKNOWN');
            callState=@('NOT_ENTERED','THREW','RETURNED','NOT_APPLICABLE','UNKNOWN');
            exceptionKind=@('NONE','CIM','WIN32','COM','POWERSHELL','DOTNET','UNKNOWN')
           }
           foreach($key in $domains.Keys){if($Fault.$key -isnot [string] -or $Fault.$key -cnotin $domains[$key]){throw 'PROOF_PROCESS_PROTOCOL_FAILED'}}
           if($null -ne $Fault.hresult){Assert-R05WireInteger $Fault.hresult -2147483648 2147483647}
           foreach($key in @('win32NativeCode','cimNativeCode','cimStatusCode','cimProviderErrorCode')){if($null -ne $Fault.$key){Assert-R05WireInteger $Fault.$key 0 4294967295}}
          }
          function Assert-R05WireDiagnostics($Diagnostics) {
           Assert-R05ClosedKeys $Diagnostics @('version','forwardFailure','cleanupFailure','cleanupFailedComponents','profileCleanupState')
           Assert-R05WireInteger $Diagnostics.version 1 1
           Assert-R05WireFault $Diagnostics.forwardFailure
           Assert-R05WireFault $Diagnostics.cleanupFailure
           if($Diagnostics.cleanupFailedComponents -isnot [array] -or $Diagnostics.cleanupFailedComponents.Count -gt 6){throw 'PROOF_PROCESS_PROTOCOL_FAILED'}
           $seen=@()
           foreach($component in $Diagnostics.cleanupFailedComponents){
            if($component -isnot [string] -or $component -cnotin @('TASK','ACCOUNT_DISABLE','BATCH_RIGHT','PROFILE','ACCOUNT_REMOVE','FILES') -or $seen -ccontains $component){throw 'PROOF_PROCESS_PROTOCOL_FAILED'}
            $seen+=@($component)
           }
           if($Diagnostics.profileCleanupState -isnot [string] -or $Diagnostics.profileCleanupState -cnotin @('NOT_CHECKED','QUERY_FAILED','SID_MISMATCH_REFUSED','SPECIAL_REFUSED','LOADED_REFUSED','REMOVE_FAILED','READBACK_FAILED','STILL_PRESENT','ABSENT_CONFIRMED','REMOVED_AND_ABSENT_CONFIRMED')){throw 'PROOF_PROCESS_PROTOCOL_FAILED'}
          }
          function Assert-R05ClosedProofResult($Closed) {
           $expected=@('schemaVersion','issue','operation','complete','mode','failureCode','failedStage','cleanupFailureCode','sourceRevision','scriptSha256','approvalSha256','runId','runAttempt','attemptId','validationAccepted','accountCreated','taskCreated','conditionalBatchRightAdded','baselineRan','changedRan','restoredRan','actualAccountSidMatched','passwordLogonPreserved','limitedPrincipalPreserved','nonActionDefinitionPreserved','taskSecurityPreserved','actionRestored','updateOmittedUserAndPassword','restoreOmittedUserAndPassword','allThreeActionFieldsChanged','windowsBuild','taskRemoved','accountRemoved','ownProfileRemovedOrAbsent','ownBatchRightRemovedOrAbsent','ownFilesRemoved','cleanupVerified','existingTaskTouched','productionTouched','deadlineBudgetAdmitted','forwardCompleted','finalDeadlineValid','forwardDeadlineExceeded','cleanupDeadlineExceeded','hardDeadlineExceeded','credentialValueEmitted','rawIdentityOrPathEmitted','nativeZBookAcceptanceCredit','diagnostics')
           Assert-R05ClosedKeys $Closed $expected
           Assert-R05WireInteger $Closed.schemaVersion 3 3
           Assert-R05WireInteger $Closed.issue 1218 1218
           Assert-R05WireInteger $Closed.runAttempt 1 1
           Assert-R05WireInteger $Closed.nativeZBookAcceptanceCredit 0 0
           if($Closed.operation -isnot [string] -or $Closed.operation -cne 'ephemeral-password-task-retention-proof' -or $Closed.mode -isnot [string] -or $Closed.mode -cnotin @('PLAN_ONLY','VALIDATE_ONLY','APPLY')){throw 'PROOF_PROCESS_PROTOCOL_FAILED'}
           foreach($key in @('complete','validationAccepted','accountCreated','taskCreated','conditionalBatchRightAdded','baselineRan','changedRan','restoredRan','actualAccountSidMatched','passwordLogonPreserved','limitedPrincipalPreserved','nonActionDefinitionPreserved','taskSecurityPreserved','actionRestored','updateOmittedUserAndPassword','restoreOmittedUserAndPassword','allThreeActionFieldsChanged','taskRemoved','accountRemoved','ownProfileRemovedOrAbsent','ownBatchRightRemovedOrAbsent','ownFilesRemoved','cleanupVerified','existingTaskTouched','productionTouched','deadlineBudgetAdmitted','forwardCompleted','finalDeadlineValid','forwardDeadlineExceeded','cleanupDeadlineExceeded','hardDeadlineExceeded','credentialValueEmitted','rawIdentityOrPathEmitted')){if($Closed.$key -isnot [bool]){throw 'PROOF_PROCESS_PROTOCOL_FAILED'}}
           $codes=@('PROOF_MODE_REQUIRED','PROOF_APPROVAL_REQUIRED','PROOF_CONTEXT_REQUIRED','PROOF_HOSTED_WINDOWS_REQUIRED','PROOF_HOSTED_ADMIN_REQUIRED','PROOF_OWN_OBJECT_COLLISION','PROOF_ACCOUNT_BOUNDARY_CHANGED','PROOF_BATCH_LOGON_REFUSED','PROOF_TASK_BOUNDARY_CHANGED','PROOF_EXECUTION_FAILED','PROOF_ACCOUNT_EXECUTION_MISMATCH','PROOF_JOB_BUDGET_REQUIRED','PROOF_CLOCK_INVALID','PROOF_HARD_DEADLINE','PROOF_FORWARD_DEADLINE','PROOF_FORWARD_RESERVE','PROOF_CLEANUP_DEADLINE','PROOF_CLEANUP_NOT_STARTED','PROOF_CLEANUP_FAILED','PROOF_OPERATION_FAILED')
           foreach($key in @('failureCode','cleanupFailureCode')){if($null -ne $Closed.$key -and ($Closed.$key -isnot [string] -or $Closed.$key -cnotin $codes)){throw 'PROOF_PROCESS_PROTOCOL_FAILED'}}
           if($null -ne $Closed.failedStage -and ($Closed.failedStage -isnot [string] -or $Closed.failedStage -cnotin @('approval','platform','native-callback','account','batch-right','own-files','registration','baseline','action-update','changed-execution','action-restore','restored-execution','cleanup','final-deadline'))){throw 'PROOF_PROCESS_PROTOCOL_FAILED'}
           $patterns=@{sourceRevision='^[a-f0-9]{40}$';scriptSha256='^[a-f0-9]{64}$';approvalSha256='^[a-f0-9]{64}$';runId='^[1-9]\d*$';attemptId='^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$';windowsBuild='^[0-9]+(?:\.[0-9]+){1,3}$'}
           foreach($key in $patterns.Keys){if($null -ne $Closed.$key -and ($Closed.$key -isnot [string] -or $Closed.$key -cnotmatch $patterns[$key])){throw 'PROOF_PROCESS_PROTOCOL_FAILED'}}
           Assert-R05WireDiagnostics $Closed.diagnostics
          }
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path .gai-results | Out-Null
          $shell=Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $script=Join-Path $env:GITHUB_WORKSPACE 'scripts\owner-code-task-credential-retention-proof-1218.ps1'
          $result=Join-Path $env:GITHUB_WORKSPACE '.gai-results\password-task-retention-proof.json'
          $approval=Join-Path $env:RUNNER_TEMP ('goriq-r05-original-approval-'+$env:GITHUB_RUN_ID+'.json')
          $created=$false;$started=$false;$proofExit=1
          try {
            if($env:GORIQ_FIXTURE_APPLY -eq 'true'){
              $encoded=$env:GORIQ_FIXTURE_APPROVAL_BASE64
              if(-not $encoded -or $encoded.Length -gt 43692 -or $encoded -cnotmatch '^[A-Za-z0-9+/]+={0,2}$'){throw 'PROOF_APPROVAL_REQUIRED'}
              $bytes=[Convert]::FromBase64String($encoded)
              if($bytes.Length -gt 32768 -or [Convert]::ToBase64String($bytes) -cne $encoded){throw 'PROOF_APPROVAL_REQUIRED'}
              $stream=[IO.File]::Open($approval,[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::None)
              $created=$true
              try{$stream.Write($bytes,0,$bytes.Length)}finally{$stream.Dispose()}
              # Public provenance budget includes checkout/setup/source checks from actual job start.
              $jobsUrl='https://api.github.com/repos/haji84/AI-/actions/runs/'+$env:GITHUB_RUN_ID+'/attempts/1/jobs?per_page=100'
              $response=Invoke-WebRequest -UseBasicParsing -MaximumRedirection 0 -TimeoutSec 15 -Uri $jobsUrl -Headers @{Accept='application/vnd.github+json'}
              if([Text.Encoding]::UTF8.GetByteCount($response.Content) -gt 65536){throw 'PROOF_JOB_BUDGET_REQUIRED'}
              $jobs=$response.Content|ConvertFrom-Json
              if($jobs.total_count -ne 1 -or @($jobs.jobs).Count -ne 1){throw 'PROOF_JOB_BUDGET_REQUIRED'}
              $job=$jobs.jobs[0]
              if($job.name -cne 'proof' -or [string]$job.run_id -cne $env:GITHUB_RUN_ID -or $job.run_attempt -ne 1 -or $job.head_sha -cne $env:GITHUB_SHA -or $job.status -cne 'in_progress' -or $job.completed_at){throw 'PROOF_JOB_BUDGET_REQUIRED'}
              $jobStart=[datetimeoffset]::Parse($job.started_at)
              $jobLimit=$jobStart.AddMinutes(14)
              $original=[Text.Encoding]::UTF8.GetString($bytes)|ConvertFrom-Json
              $scopeLimit=[datetimeoffset]::Parse($original.expiresAt)
              $launch=[datetimeoffset]::UtcNow
              if($jobStart -gt $launch -or ($jobLimit-$launch).TotalSeconds -lt 660 -or ($scopeLimit-$launch).TotalSeconds -lt 660){throw 'PROOF_JOB_BUDGET_REQUIRED'}
              $wrapperLimit=$launch.AddSeconds(660)
              $clock=[Diagnostics.Stopwatch]::StartNew()
              $info=[Diagnostics.ProcessStartInfo]::new()
              $info.FileName=$shell
              $info.Arguments='-NoLogo -NoProfile -NonInteractive -File "'+$script+'" -Apply -ApprovalPath "'+$approval+'"'
              $info.UseShellExecute=$false;$info.CreateNoWindow=$true
              $info.RedirectStandardOutput=$true;$info.RedirectStandardError=$true
              $info.EnvironmentVariables['GORIQ_PROOF_PROCESS_DEADLINE_UTC']=$wrapperLimit.ToString('o')
              $process=[Diagnostics.Process]::new();$process.StartInfo=$info
              try{
                if(-not $process.Start()){throw 'PROOF_PROCESS_START_FAILED'}
                $started=$true
                $stdout=$process.StandardOutput.ReadToEndAsync();$stderr=$process.StandardError.ReadToEndAsync()
                while(-not $process.WaitForExit(250)){
                  if([datetimeoffset]::UtcNow -ge $wrapperLimit -or $clock.Elapsed.TotalSeconds -ge 660){$process.Kill();throw 'PROOF_PROCESS_TIMEOUT'}
                }
                if([datetimeoffset]::UtcNow -ge $wrapperLimit -or $clock.Elapsed.TotalSeconds -ge 660){throw 'PROOF_PROCESS_TIMEOUT'}
                if(-not $stdout.Wait(1000) -or -not $stderr.Wait(1000)){throw 'PROOF_PROCESS_PROTOCOL_FAILED'}
                $wire=$stdout.Result.Trim()
                if($stderr.Result.Length -ne 0 -or [Text.Encoding]::UTF8.GetByteCount($wire) -gt 65536){throw 'PROOF_PROCESS_PROTOCOL_FAILED'}
                $closed=$wire|ConvertFrom-Json
                Assert-R05ClosedProofResult $closed
                $validatedWire=$closed|ConvertTo-Json -Depth 5 -Compress
                if($validatedWire -cne $wire -or [Text.Encoding]::UTF8.GetByteCount($validatedWire) -gt 65536){throw 'PROOF_PROCESS_PROTOCOL_FAILED'}
                if($process.ExitCode -ne $(if($closed.complete){0}else{1})){throw 'PROOF_PROCESS_PROTOCOL_FAILED'}
                if($closed.complete -and ($closed.mode -cne 'APPLY' -or -not $closed.finalDeadlineValid -or -not $closed.cleanupVerified -or $closed.sourceRevision -cne $env:GITHUB_SHA)){throw 'PROOF_PROCESS_PROTOCOL_FAILED'}
                if([datetimeoffset]::UtcNow -ge $wrapperLimit -or $clock.Elapsed.TotalSeconds -ge 660){throw 'PROOF_PROCESS_TIMEOUT'}
                $validatedWire|Set-Content -LiteralPath $result -Encoding UTF8
                if([datetimeoffset]::UtcNow -ge $wrapperLimit -or $clock.Elapsed.TotalSeconds -ge 660){throw 'PROOF_PROCESS_TIMEOUT'}
                $proofExit=$process.ExitCode
              }finally{
                if($started -and -not $process.HasExited){$process.Kill()}
                $process.Dispose();$clock.Stop()
              }
            }else{
              & $shell -NoLogo -NoProfile -NonInteractive -File $script | Tee-Object -FilePath $result
            }
            if($env:GORIQ_FIXTURE_APPLY -ne 'true'){$proofExit=$LASTEXITCODE}
          }catch{
            $known=@('PROOF_APPROVAL_REQUIRED','PROOF_JOB_BUDGET_REQUIRED','PROOF_PROCESS_START_FAILED','PROOF_PROCESS_TIMEOUT','PROOF_PROCESS_PROTOCOL_FAILED')
            $code=if([string]$_.Exception.Message -cin $known){[string]$_.Exception.Message}else{'PROOF_WRAPPER_FAILED'}
            @{schemaVersion=3;issue=1218;operation='ephemeral-password-task-retention-proof';mode='WRAPPER_ERROR';complete=$false;failureCode=$code;childStarted=$started;potentialOwnedObjectsRemaining=$started;cleanupVerified=$false;credentialValueEmitted=$false;nativeZBookAcceptanceCredit=0}|ConvertTo-Json -Compress|Set-Content -LiteralPath $result -Encoding UTF8
            $proofExit=1
          }finally{
            if($created -and (Test-Path -LiteralPath $approval)){Remove-Item -LiteralPath $approval -Force}
          }
          if($proofExit -ne 0){exit $proofExit}
      - name: Retain closed proof only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goriq-1218-password-task-retention-proof
          path: .gai-results/password-task-retention-proof.json
          if-no-files-found: error
          retention-days: 14

