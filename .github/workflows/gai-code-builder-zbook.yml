name: GAI Code Builder ZBook

on:
  workflow_dispatch:
  issues:
    types: [opened, reopened]
  push:
    branches: [main]
    paths:
      - '.github/workflows/gai-code-builder-zbook.yml'
      - 'scripts/code-builder-worker-service.ts'
      - 'scripts/install-code-builder-windows.ps1'
      - 'src/gai/http-worker-builder-capability.ts'
      - 'src/gai/worker-builder-capability.ts'
      - 'src/gai/worker-runtime.ts'

permissions:
  contents: read

jobs:
  install-and-probe:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[JARVIS CODE BUILDER PROBE]')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install bounded code builder
        id: install
        continue-on-error: true
        shell: powershell
        run: |
          .\scripts\install-code-builder-windows.ps1 -WorkerId 'zbook' -Workspace "$env:GITHUB_WORKSPACE"
      - name: Capture builder evidence
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .gai-results | Out-Null
          Copy-Item "$env:LOCALAPPDATA\GAIWorker\code-builder\install-status.json" .gai-results\ -Force -ErrorAction SilentlyContinue
          Copy-Item "$env:LOCALAPPDATA\GAIWorker\code-builder\worker.log" .gai-results\ -Force -ErrorAction SilentlyContinue
          Copy-Item "$env:LOCALAPPDATA\GAIWorker\code-builder\worker.stdout.log" .gai-results\ -Force -ErrorAction SilentlyContinue
          Copy-Item "$env:LOCALAPPDATA\GAIWorker\code-builder\worker.stderr.log" .gai-results\ -Force -ErrorAction SilentlyContinue
          if (Test-Path .gai-results\install-status.json) { Get-Content .gai-results\install-status.json }
          if (Test-Path .gai-results\worker.log) { Get-Content .gai-results\worker.log -Tail 80 }
          if (Test-Path .gai-results\worker.stdout.log) { Get-Content .gai-results\worker.stdout.log -Tail 80 }
          if (Test-Path .gai-results\worker.stderr.log) { Get-Content .gai-results\worker.stderr.log -Tail 120 }
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gai-zbook-code-builder
          path: .gai-results/
          include-hidden-files: true
          retention-days: 30
      - name: Enforce install result
        if: always() && steps.install.outcome != 'success'
        shell: powershell
        run: exit 1
