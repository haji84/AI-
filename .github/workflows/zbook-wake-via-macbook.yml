name: ZBook Wake via MacBook

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake-zbook:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[JARVIS ZBOOK WAKE]')
    runs-on: [self-hosted, macOS]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Send bounded Wake-on-LAN to ZBook
        shell: bash
        run: |
          chmod +x scripts/wake-zbook-from-macbook.sh
          ./scripts/wake-zbook-from-macbook.sh 192.168.0.169
      - name: Upload wake evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zbook-wake-evidence
          path: ~/Library/Application Support/GAIWorker/zbook-wake-status.json
          if-no-files-found: warn
          retention-days: 30
