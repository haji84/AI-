name: GAI R8 Memory Transfer

on:
  workflow_run:
    workflows: ["GAI R7 Repeatability"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gai-r8-memory-transfer
  cancel-in-progress: true

jobs:
  r8-zbook:
    name: R8 heldout memory-transfer campaign on ZBook
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    env:
      GAI_LOCAL_MODEL_ENDPOINT: http://127.0.0.1:11434
      GAI_LOCAL_MODEL_NAME: qwen3:4b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Ensure Ollama runtime is reachable
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Test-Ollama {
            try { Invoke-RestMethod -Uri "$($env:GAI_LOCAL_MODEL_ENDPOINT)/api/tags" -TimeoutSec 5 | Out-Null; return $true } catch { return $false }
          }
          if (-not (Test-Ollama)) {
            $ollama = Get-Command ollama -ErrorAction SilentlyContinue
            if ($ollama) { $exe = $ollama.Source } else { $exe = Join-Path $env:LOCALAPPDATA 'Programs\Ollama\ollama.exe' }
            if (-not (Test-Path $exe)) { throw 'Ollama executable not found' }
            Start-Process -FilePath $exe -ArgumentList 'serve' -WindowStyle Hidden
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) { Start-Sleep -Seconds 2; if (Test-Ollama) { $ready = $true; break } }
            if (-not $ready) { throw 'Ollama API did not become reachable' }
          }

      - name: Execute real heldout transfer campaign
        shell: powershell
        run: node scripts/gai-r8-memory-transfer.mjs --real

      - name: Verify zero-cost and leakage invariants
        shell: powershell
        run: |
          $report = Get-Content '.gai-results/r8-memory-transfer-report.json' -Raw | ConvertFrom-Json
          if ($report.additionalApiCost -ne 0) { throw 'R8 additional API cost is non-zero' }
          if ($report.heldoutLeakageCount -ne 0) { throw 'R8 heldout leakage detected' }
          if ($report.transferTasks -lt 20) { throw 'R8 requires at least 20 transfer tasks in this campaign' }

      - name: Upload complete R8 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gai-baseline-zbook
          path: .gai-results/
          include-hidden-files: true
          retention-days: 90
