name: Remote Lite Android candidate

on:
  pull_request:
    paths:
      - 'android/remote-lite/**'
      - '.github/workflows/remote-lite-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Test and build separate manual-only APK
        run: gradle -p android/remote-lite :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify candidate APK exists
        run: test -s android/remote-lite/app/build/outputs/apk/debug/app-debug.apk
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 emulator screen and tap smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: python3 android/remote-lite/scripts/emulator_smoke.py
