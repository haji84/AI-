name: Remote Lite Android candidate

on:
  pull_request:
    paths:
      - 'android/remote-lite/**'
      - '.github/workflows/remote-lite-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select the hosted image's installed Chrome
        id: installed-chrome
        run: |
          set -euo pipefail
          test -x /opt/google/chrome/chrome
          version="$(/opt/google/chrome/chrome --product-version)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          /opt/google/chrome/chrome --version
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: ${{ steps.installed-chrome.outputs.version }}
          install-chromedriver: true
      - name: Extract local TURN fixture without installing a system service
        run: |
          set -euo pipefail
          mkdir -p android/remote-lite/app/build/vm-turn
          cd android/remote-lite/app/build/vm-turn
          sudo apt-get update -qq
          # Other native dependencies already exist on the hosted image. Download only
          # missing hiredis/libevent runtimes; third-party libpq versions may be unavailable.
          mapfile -t packages < <(apt-cache depends coturn | sed -n 's/^  Depends: //p' | grep -E '^(libhiredis|libevent)[a-z0-9.+-]+$')
          test "${#packages[@]}" -ge 3
          apt-get download coturn "${packages[@]}"
          for package in *.deb; do dpkg-deb -x "$package" extracted; done
          echo "REMOTE_LITE_TURNSERVER=$PWD/extracted/usr/bin/turnserver" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PWD/extracted/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          LD_LIBRARY_PATH="$PWD/extracted/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" ldd extracted/usr/bin/turnserver
          if LD_LIBRARY_PATH="$PWD/extracted/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" ldd extracted/usr/bin/turnserver | grep -F 'not found'; then exit 1; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Generate ephemeral debug-only loopback TLS fixture
        run: python3 android/remote-lite/scripts/prepare_vm_tls.py
      - name: Verify separate browser and loopback TLS before emulator startup
        env:
          REMOTE_LITE_CHROME: /opt/google/chrome/chrome
          REMOTE_LITE_CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        run: python3 android/remote-lite/scripts/native_vm.py
      - name: Test and build separate manual-only APKs
        run: gradle -p android/remote-lite :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:assemblePhysicalCheck :vm-ui-probe:assembleDebug --stacktrace
      - name: Verify candidate APK exists
        run: test -s android/remote-lite/app/build/outputs/apk/debug/app-debug.apk
      - name: Verify release APK HTTPS and debug isolation
        run: |
          set -euo pipefail
          release=android/remote-lite/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$release"
          aapt="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt"
          permissions="$("$aapt" dump permissions "$release")"
          grep -Fq android.permission.INTERNET <<< "$permissions"
          manifest="$("$aapt" dump xmltree "$release" AndroidManifest.xml)"
          if grep -Eq 'DebugPairingActivity|SecureTestActivity|VmRemoteSessionService' <<< "$manifest"; then
            echo 'Release APK unexpectedly includes a VM component'
            exit 1
          fi
          if grep -Fq networkSecurityConfig <<< "$manifest"; then
            echo 'Release APK unexpectedly includes debug certificate trust'
            exit 1
          fi
          grep -Eq 'usesCleartextTraffic.*0x0' <<< "$manifest"
          archive="$(unzip -l "$release")"
          if grep -Fq remote_lite_vm_ca <<< "$archive"; then
            echo 'Release APK unexpectedly includes VM CA'
            exit 1
          fi
          grep -Fq assets/notices/WEBRTC.md <<< "$archive"
          grep -Fq assets/notices/WEBRTC_SDK_LICENSE.txt <<< "$archive"
          resources="$("$aapt" dump --values resources "$release")"
          if grep -Eq 'VmRemoteSessionService|public-vm-fixture-only' <<< "$resources"; then exit 1; fi
      - name: Verify physical acceptance APK uses the normal service
        run: |
          set -euo pipefail
          apk=android/remote-lite/app/build/outputs/apk/physicalCheck/app-physicalCheck.apk
          test -s "$apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          manifest="$("$aapt" dump xmltree "$apk" AndroidManifest.xml)"
          grep -Fq 'app.goriq.remote.lite.physicaltest' <<< "$manifest"
          grep -Fq 'app.goriq.remote.lite.RemoteSessionService' <<< "$manifest"
          grep -Eq 'usesCleartextTraffic.*0x0' <<< "$manifest"
          if grep -Eq 'DebugPairingActivity|SecureTestActivity|VmRemoteSessionService|debuggable.*0xffffffff' <<< "$manifest"; then
            echo 'Physical acceptance APK unexpectedly includes a VM/debug component'
            exit 1
          fi
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 emulator screen and tap smoke
        uses: reactivecircus/android-emulator-runner@v2
        env:
          REMOTE_LITE_CHROME: /opt/google/chrome/chrome
          REMOTE_LITE_CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          script: python3 android/remote-lite/scripts/emulator_smoke.py
