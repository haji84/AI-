name: GORIQ Owner Code 1218 Bounded Native Acceptance

on:
  workflow_dispatch:
    inputs:
      owner_local_practical:
        description: 'Separately approved issue1218 existing-code local practical test; never rotation'
        required: false
        type: boolean
        default: false
      approved_scope_base64:
        description: 'Non-secret exact-source scope metadata; no credential value'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: goriq-owner-1218-readonly
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'haji84/AI-' && github.ref == 'refs/heads/main' && github.actor == 'haji84'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: owner-native-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Require exact current main with successful CI
        env:
          GORIQ_PC_APPROVED_REVISION: ${{ github.sha }}
        working-directory: owner-native-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/goriq-pc-approved-source.mjs
      - name: Inspect Owner artifact identity and encrypted-file metadata; execute no-argument PLAN ONLY
        working-directory: owner-native-${{ github.run_id }}-${{ github.run_attempt }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .gai-results | Out-Null
          powershell.exe -NoProfile -NonInteractive -File scripts/owner-code-preflight-1218.ps1 | Tee-Object -FilePath .gai-results/owner-code-preflight-1218.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Separately approved existing Owner code local practical test
        if: ${{ inputs.owner_local_practical == true }}
        working-directory: owner-native-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          GORIQ_OWNER_PRACTICAL_APPROVAL_BASE64: ${{ inputs.approved_scope_base64 }}
        shell: powershell
        run: |
          powershell.exe -NoLogo -NoProfile -STA -NonInteractive -File scripts/owner-code-practical-1218.ps1 -Apply | Tee-Object -FilePath .gai-results/owner-code-practical-1218.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain sanitized practical booleans only
        if: ${{ always() && inputs.owner_local_practical == true }}
        uses: actions/upload-artifact@v4
        with:
          name: goriq-owner-1218-local-practical
          path: owner-native-${{ github.run_id }}-${{ github.run_attempt }}/.gai-results/owner-code-practical-1218.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload allowlisted metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goriq-owner-1218-readonly-windows
          path: owner-native-${{ github.run_id }}-${{ github.run_attempt }}/.gai-results/owner-code-preflight-1218.json
          if-no-files-found: error
          retention-days: 14

  iphone-visibility:
    if: github.repository == 'haji84/AI-' && github.ref == 'refs/heads/main' && github.actor == 'haji84'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: owner-native-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Require exact current main with successful CI
        env:
          GORIQ_PC_APPROVED_REVISION: ${{ github.sha }}
        working-directory: owner-native-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/goriq-pc-approved-source.mjs
      - name: Count existing physical iPhones without pairing or installation
        working-directory: owner-native-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .gai-results
          node scripts/iphone-owner-visibility-1218.mjs | tee .gai-results/iphone-owner-visibility-1218.json
      - name: Upload redacted availability counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goriq-owner-1218-readonly-iphone
          path: owner-native-${{ github.run_id }}-${{ github.run_attempt }}/.gai-results/iphone-owner-visibility-1218.json
          if-no-files-found: error
          retention-days: 14
