name: GORIQ ZBook Goal 1218 Read-only Diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Inspect persisted Goal state
        shell: powershell
        run: node scripts/zbook-goal-diagnostics.ts
      - name: Inspect isolated workspace test names
        shell: powershell
        run: node scripts/zbook-isolated-test-diagnostic.ts
      - name: Upload bounded diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goriq-zbook-goal-1218-diagnosis
          path: |
            .gai-results/goal-1218-bridge-diagnostics.json
            .gai-results/goal-1218-isolated-test-diagnosis.json
          retention-days: 30
