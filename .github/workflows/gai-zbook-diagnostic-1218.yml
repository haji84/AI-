name: GORIQ Owner Code 1218 Bounded Native Acceptance

on:
  workflow_dispatch:
    inputs:
      owner_local_practical:
        description: 'Separately approved issue1218 existing-code local practical test; never rotation'
        required: false
        type: boolean
        default: false
      warning_only:
        description: 'Task-scoped nonsecret warning dialog and Cancel only; no credential operation'
        required: false
        type: boolean
        default: false
      rotation_only:
        description: 'Rotation entry selector only; separate fresh Owner High approval remains required'
        required: false
        type: boolean
        default: false
      approved_scope_base64:
        description: 'Non-secret exact-source practical or warning scope; no credential value'
        required: false
        type: string
      rotation_scope_base64:
        description: 'Separately provisioned exact-source Owner rotation descriptor; no credential value'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: goriq-owner-1218-readonly
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'haji84/AI-' && github.ref == 'refs/heads/main' && github.actor == 'haji84'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: ${{ inputs.rotation_only == true && 25 || 5 }}
    steps:
      - name: Require exclusive bounded native mode
        env:
          GORIQ_WARNING_ONLY: ${{ inputs.warning_only }}
          GORIQ_LOCAL_PRACTICAL: ${{ inputs.owner_local_practical }}
          GORIQ_ROTATION_ONLY: ${{ inputs.rotation_only }}
        shell: powershell
        run: |
          $selectedModes = @($env:GORIQ_WARNING_ONLY, $env:GORIQ_LOCAL_PRACTICAL, $env:GORIQ_ROTATION_ONLY) | Where-Object { $_ -eq 'true' }
          if (@($selectedModes).Count -gt 1) {
            throw 'OWNER_ACCEPTANCE_MODES_EXCLUSIVE'
          }
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: owner-native-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Require exact current main with successful CI
        env:
          GORIQ_PC_APPROVED_REVISION: ${{ github.sha }}
        working-directory: owner-native-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/goriq-pc-approved-source.mjs
      - name: Inspect Owner artifact identity and encrypted-file metadata; execute no-argument PLAN ONLY
        if: ${{ inputs.warning_only != true && inputs.rotation_only != true }}
        working-directory: owner-native-${{ github.run_id }}-${{ github.run_attempt }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .gai-results | Out-Null
          powershell.exe -NoProfile -NonInteractive -File scripts/owner-code-preflight-1218.ps1 | Tee-Object -FilePath .gai-results/owner-code-preflight-1218.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Render unchanged session warning and invoke only Cancel
        if: ${{ inputs.warning_only == true && inputs.rotation_only != true }}
        working-directory: owner-native-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          GORIQ_OWNER_WARNING_SCOPE_BASE64: ${{ inputs.approved_scope_base64 }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .gai-results | Out-Null
          node scripts/owner-code-warning-1218.mjs --run | Tee-Object -FilePath .gai-results/owner-code-warning-1218.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Separately approved existing Owner code local practical test
        if: ${{ inputs.owner_local_practical == true && inputs.rotation_only != true }}
        working-directory: owner-native-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          GORIQ_OWNER_PRACTICAL_APPROVAL_BASE64: ${{ inputs.approved_scope_base64 }}
        shell: powershell
        run: |
          powershell.exe -NoLogo -NoProfile -STA -NonInteractive -File scripts/owner-code-practical-1218.ps1 -Apply | Tee-Object -FilePath .gai-results/owner-code-practical-1218.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run separately approved bounded native rotation entry
        if: ${{ inputs.rotation_only == true }}
        working-directory: owner-native-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          GORIQ_OWNER_ROTATION_SCOPE_BASE64: ${{ inputs.rotation_scope_base64 }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .gai-results | Out-Null
          node scripts/owner-code-rotation-native-1218.mjs --run | Tee-Object -FilePath .gai-results/owner-code-rotation-native-1218.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain sanitized practical booleans only
        if: ${{ always() && inputs.owner_local_practical == true && inputs.rotation_only != true }}
        uses: actions/upload-artifact@v4
        with:
          name: goriq-owner-1218-local-practical
          path: owner-native-${{ github.run_id }}-${{ github.run_attempt }}/.gai-results/owner-code-practical-1218.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload allowlisted metadata only
        if: ${{ always() && inputs.warning_only != true && inputs.rotation_only != true }}
        uses: actions/upload-artifact@v4
        with:
          name: goriq-owner-1218-readonly-windows
          path: owner-native-${{ github.run_id }}-${{ github.run_attempt }}/.gai-results/owner-code-preflight-1218.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain measured warning and Cancel booleans only
        if: ${{ always() && inputs.warning_only == true && inputs.rotation_only != true }}
        uses: actions/upload-artifact@v4
        with:
          name: goriq-owner-1218-warning-only
          path: owner-native-${{ github.run_id }}-${{ github.run_attempt }}/.gai-results/owner-code-warning-1218.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain closed native rotation result only
        if: ${{ always() && inputs.rotation_only == true }}
        uses: actions/upload-artifact@v4
        with:
          name: goriq-owner-1218-rotation-only
          path: owner-native-${{ github.run_id }}-${{ github.run_attempt }}/.gai-results/owner-code-rotation-native-1218.json
          if-no-files-found: error
          retention-days: 14

  iphone-visibility:
    if: github.repository == 'haji84/AI-' && github.ref == 'refs/heads/main' && github.actor == 'haji84' && inputs.warning_only != true && inputs.rotation_only != true
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: owner-native-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Require exact current main with successful CI
        env:
          GORIQ_PC_APPROVED_REVISION: ${{ github.sha }}
        working-directory: owner-native-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/goriq-pc-approved-source.mjs
      - name: Count existing physical iPhones without pairing or installation
        working-directory: owner-native-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .gai-results
          node scripts/iphone-owner-visibility-1218.mjs | tee .gai-results/iphone-owner-visibility-1218.json
      - name: Upload redacted availability counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goriq-owner-1218-readonly-iphone
          path: owner-native-${{ github.run_id }}-${{ github.run_attempt }}/.gai-results/iphone-owner-visibility-1218.json
          if-no-files-found: error
          retention-days: 14
