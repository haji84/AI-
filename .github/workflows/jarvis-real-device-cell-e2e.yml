name: JARVIS Real Android Cell E2E

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jarvis-real-device-cell-e2e.yml'

jobs:
  real-device-cell-e2e:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - name: Diagnose Android 001 cell selection
        shell: bash
        run: |
          set -euo pipefail
          STATE_ROOT="$HOME/Library/Application Support/JARVIS"
          ENV_FILE="$STATE_ROOT/jarvis.env"
          test -s "$ENV_FILE"
          set -a
          source "$ENV_FILE"
          set +a
          BROKER="http://127.0.0.1:8787"
          auth=(-H "Authorization: Bearer $JARVIS_OWNER_TOKEN" -H 'Content-Type: application/json')
          state() { curl -fsS --max-time 5 "${auth[@]}" "$BROKER/api/jarvis/admin/state"; }
          submit() { curl -fsS --max-time 5 "${auth[@]}" -X POST "$BROKER/api/jarvis/admin/tasks" -d "$1"; }
          wait_task() {
            local id="$1" label="$2" end=$((SECONDS+120))
            while (( SECONDS < end )); do
              local s status task
              s="$(state)"
              status="$(printf '%s' "$s" | jq -r --arg id "$id" '.tasks[]? | select(.id==$id) | .status' | tail -1)"
              task="$(printf '%s' "$s" | jq -c --arg id "$id" '.tasks[]? | select(.id==$id)' | tail -1)"
              case "$status" in
                completed) printf '%s' "$task"; return 0 ;;
                failed|cancelled) echo "$task"; echo "$label failed: $status" >&2; return 1 ;;
              esac
              sleep 1
            done
            echo "$label timeout" >&2
            return 1
          }
          run_task() {
            local body="$1" label="$2" r id t
            r="$(submit "$body")"
            id="$(printf '%s' "$r" | jq -r '.task.id // .id')"
            t="$(wait_task "$id" "$label")" || { echo "TASK_DIAGNOSTIC $label: $t" >&2; return 1; }
            echo "TASK_OK $label: $t"
          }

          S="$(state)"
          NODE="$(printf '%s' "$S" | jq -r '.fleet[]? | select((.label // "" | test("Android[[:space:]]*0*1|nubia A403ZT"; "i"))) | .id' | head -1)"
          test -n "$NODE" && test "$NODE" != null
          echo "Target Android 001 found"
          printf '%s' "$S" | jq -c --arg id "$NODE" '.fleet[] | select(.id==$id) | {id,label,status,capabilities,telemetry}'

          STATUS="$(jq -nc --arg node "$NODE" '{type:"device-status",payload:{},targetNodeId:$node,priority:"urgent",idempotencyKey:("real-diag-status:"+(now|tostring))}')"
          run_task "$STATUS" 'device-status'

          OPEN="$(jq -nc --arg node "$NODE" '{type:"open-app",payload:{packageName:"com.google.android.apps.docs.editors.sheets"},targetNodeId:$node,priority:"urgent",idempotencyKey:("real-diag-open:"+(now|tostring))}')"
          run_task "$OPEN" 'open Sheets'

          PREP="$(jq -nc --arg node "$NODE" '{type:"ui-sequence",payload:{steps:[{action:"wait",ms:1200},{action:"ensure-open-text",text:"TikTok Lite",timeoutMs:10000,retries:2,retryDelayMs:500},{action:"wait-sheet-grid",timeoutMs:12000,retries:2,retryDelayMs:500}]},targetNodeId:$node,priority:"urgent",idempotencyKey:("real-diag-prep:"+(now|tostring))}')"
          run_task "$PREP" 'open TikTok Lite sheet'

          for CELL in C7 G6 J7; do
            BODY="$(jq -nc --arg node "$NODE" --arg cell "$CELL" '{type:"ui-sequence",payload:{steps:[{action:"select-sheet-cell",cell:$cell,timeoutMs:20000,retries:1}]},targetNodeId:$node,priority:"urgent",idempotencyKey:("real-diag-cell-"+$cell+":"+(now|tostring))}')"
            run_task "$BODY" "select $CELL"
          done
          echo 'REAL_ANDROID_CELL_E2E_OK'
