name: GORIQ AI-09 Owner Broker and Builder Read-Only Connect

# Must run from protected main, never from an untrusted PR head.
on:
  workflow_dispatch:
  issues:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  owner-broker-readonly:
    if: >-
      github.repository == 'haji84/AI-' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issues' &&
        startsWith(github.event.issue.title, '[AI09 READONLY CONNECT]') &&
        github.event.issue.user.login == github.repository_owner &&
        github.event.sender.login == github.repository_owner))
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout only trusted protected main source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Enforce exact current main source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Authenticate against local owner's Broker read-only
        shell: bash
        run: |
          set -euo pipefail
          ENV_FILE="$HOME/Library/Application Support/JARVIS/jarvis.env"
          if [[ ! -s "$ENV_FILE" ]]; then echo 'AI09_EXISTING_OWNER_ENV_UNAVAILABLE'; exit 2; fi
          set -a
          source "$ENV_FILE"
          set +a
          if [[ -z "$(printenv JARVIS_OWNER_TOKEN 2>/dev/null || true)" ]]; then
            echo 'AI09_EXISTING_OWNER_TOKEN_MISSING'
            exit 2
          fi
          export GORIQ_AI09_CONNECT_MODE=broker
          node scripts/goriq-ai09-live-broker-builder-probe.mjs
          unset JARVIS_OWNER_TOKEN
  zbook-builder-readonly:
    if: >-
      github.repository == 'haji84/AI-' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issues' &&
        startsWith(github.event.issue.title, '[AI09 READONLY CONNECT]') &&
        github.event.issue.user.login == github.repository_owner &&
        github.event.sender.login == github.repository_owner))
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout only trusted protected main source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Enforce exact current main source
        shell: powershell
        run: |
          git fetch --no-tags origin main
          if ($LASTEXITCODE -ne 0) { throw "Trusted main fetch unavailable" }
          $head = (git rev-parse HEAD).Trim()
          $trusted = (git rev-parse origin/main).Trim()
          if ($head -ne $trusted) { throw "Current main revision mismatch" }
      - name: Authenticate against existing local Builder read-only
        shell: powershell
        run: |
          $tokenPath = Join-Path $env:LOCALAPPDATA 'GAIWorker\code-builder\token.txt'
          if (-not (Test-Path -LiteralPath $tokenPath -PathType Leaf)) {
            Write-Host 'AI09_EXISTING_BUILDER_TOKEN_MISSING'
            exit 2
          }
          $env:CODE_BUILDER_LOCAL_TOKEN = (Get-Content -LiteralPath $tokenPath -Raw).Trim()
          $env:GORIQ_AI09_CONNECT_MODE = 'builder'
          try {
            node scripts/goriq-ai09-live-broker-builder-probe.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item Env:CODE_BUILDER_LOCAL_TOKEN -ErrorAction SilentlyContinue
            Remove-Item Env:GORIQ_AI09_CONNECT_MODE -ErrorAction SilentlyContinue
          }
      - name: Diagnose existing local Builder availability without mutation
        if: failure()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Inspect only the existing local service. Never install, start,
          # restart, rotate a token, disclose a token or modify host state.
          $tokenPath = Join-Path $env:LOCALAPPDATA 'GAIWorker\code-builder\token.txt'
          $tokenPresent = Test-Path -LiteralPath $tokenPath -PathType Leaf
          $listenerPresent = $false
          $loopbackBound = $false
          try {
            $listeners = @(Get-NetTCPConnection -LocalPort 8796 -State Listen -ErrorAction SilentlyContinue)
            $listenerPresent = ($listeners.Count -gt 0)
            $loopbackBound = (@($listeners | Where-Object { $_.LocalAddress -eq '127.0.0.1' }).Count -gt 0)
          } catch {
            # Unsupported or unavailable inspection command is inconclusive.
          }
          $healthStatus = 'NOT_CHECKED'
          if ($listenerPresent -and $tokenPresent) {
            $token = ''
            $response = $null
            try {
              $token = (Get-Content -LiteralPath $tokenPath -Raw).Trim()
              if ($token.Length -ge 8) {
                $request = [System.Net.HttpWebRequest]::Create('http://127.0.0.1:8796/health')
                $request.Method = 'GET'
                $request.Timeout = 4000
                $request.AllowAutoRedirect = $false
                $request.Headers.Add('Authorization', 'Bearer ' + $token)
                $response = $request.GetResponse()
                $healthStatus = 'HTTP_' + [int]$response.StatusCode
              } else {
                $healthStatus = 'INVALID_LOCAL_TOKEN_LENGTH'
              }
            } catch [System.Net.WebException] {
              if ($_.Exception.Response) {
                $healthStatus = 'HTTP_' + [int]$_.Exception.Response.StatusCode
                $_.Exception.Response.Close()
              } else {
                $healthStatus = 'LOCAL_CONNECTION_FAILED'
              }
            } catch {
              $healthStatus = 'LOCAL_PROBE_ERROR'
            } finally {
              if ($response) { $response.Close() }
              $token = ''
              $request = $null
            }
          }
          # Read only Task Scheduler metadata from the existing Builder install.
          # Do not inspect or print task configuration: the installed launcher
          # contains an existing bearer token and workspace configuration.
          $taskName = 'GAI Code Builder Worker'
          $taskState = 'UNAVAILABLE'
          $taskLastResult = $null
          try {
            $registeredTask = Get-ScheduledTask -TaskName $taskName -ErrorAction Stop
            $taskState = [string]$registeredTask.State
            $taskInfo = Get-ScheduledTaskInfo -TaskName $taskName -ErrorAction Stop
            $taskLastResult = [int]$taskInfo.LastTaskResult
          } catch {
            # Unregistered or inaccessible task is a read-only diagnostic HOLD.
          }
          $root = Join-Path $env:LOCALAPPDATA 'GAIWorker\code-builder'
          $launcherPresent = Test-Path -LiteralPath (Join-Path $root 'run-code-builder.ps1') -PathType Leaf
          $serviceSourcePresent = Test-Path -LiteralPath (Join-Path $root 'code-builder-worker-service.ts') -PathType Leaf

          # Existing-task diagnostics after the owner-authorized one-shot
          # failed. Only emit trusted booleans. Do not read or print the
          # token-bearing launcher, task arguments or worker log contents.
          $nodeOnRunnerPath = [bool](Get-Command node -ErrorAction SilentlyContinue)
          $policyPresent = Test-Path -LiteralPath (
            Join-Path $env:LOCALAPPDATA 'GAIWorker\src\orchestrator\test-contract-evolution.ts'
          ) -PathType Leaf
          $taskActionMatchesLauncher = $false
          if ($registeredTask -and @($registeredTask.Actions).Count -eq 1) {
            $taskAction = $registeredTask.Actions[0]
            $launcher = Join-Path $root 'run-code-builder.ps1'
            $taskActionMatchesLauncher = (
              $taskAction.Execute -match '(?i)(^|[\\/])powershell\.exe
          # Read bounded existing local worker logs but emit ONLY static,
          # allowlisted error categories; never output raw lines, tokens,
          # stack traces, process arguments or workspace data.
          $logErrorClass = 'NO_DIAGNOSTIC_LOG'
          $knownSignatures = @(
            @{ pattern='ERR_MODULE_NOT_FOUND|Cannot find module'; category='MODULE_NOT_FOUND' },
            @{ pattern='ERR_UNKNOWN_FILE_EXTENSION|ERR_UNSUPPORTED_TYPESCRIPT_SYNTAX'; category='NODE_TYPESCRIPT_RUNTIME_ERROR' },
            @{ pattern='EADDRINUSE|EACCES.*listen'; category='LOCAL_BIND_ERROR' },
            @{ pattern='is not recognized as the name of a cmdlet|CommandNotFoundException'; category='LAUNCHER_COMMAND_NOT_FOUND' },
            @{ pattern='Cannot find path|ENOENT'; category='LOCAL_PATH_NOT_FOUND' },
            @{ pattern='CODE_BUILDER_TOKEN is required'; category='WORKER_TOKEN_MISSING_IN_LAUNCHER' },
            @{ pattern='SyntaxError|TypeError|ReferenceError'; category='WORKER_RUNTIME_EXCEPTION' }
          )
          foreach ($logName in @('worker.stderr.log','worker.log')) {
            $logFile = Join-Path $root $logName
            if (-not (Test-Path -LiteralPath $logFile -PathType Leaf)) { continue }
            $logErrorClass = 'UNCLASSIFIED_EXISTING_LOG'
            try {
              $lines = @(Get-Content -LiteralPath $logFile -Tail 80 -ErrorAction Stop)
              $sample = $lines -join [Environment]::NewLine
              foreach ($signature in $knownSignatures) {
                if ($sample -match $signature.pattern) {
                  $logErrorClass = $signature.category
                  break
                }
              }
            } catch {
              $logErrorClass = 'LOG_READ_UNAVAILABLE'
            } finally {
              $sample = $null
              $lines = $null
            }
            if ($logErrorClass -ne 'UNCLASSIFIED_EXISTING_LOG') { break }
          }
          $result = [ordered]@{
            existingLogErrorClass = $logErrorClass
            servicePort = 8796
            scheduledTaskState = $taskState
            scheduledTaskLastResult = $taskLastResult
            launcherPresent = [bool]$launcherPresent
            installedServiceSourcePresent = [bool]$serviceSourcePresent
            nodeAvailableOnRunnerPath = [bool]$nodeOnRunnerPath
            installedPolicyPresent = [bool]$policyPresent
            taskActionMatchesExistingLauncher = [bool]$taskActionMatchesLauncher
            installedServiceEqualsCurrentMain = [bool]$serviceMatchesTrustedMain
            lastTaskRunWithinTenMinutes = [bool]$lastTaskRunWithinTenMinutes
            tokenFilePresent = [bool]$tokenPresent
            listenerPresent = [bool]$listenerPresent
            loopbackBound = [bool]$loopbackBound
            authenticatedHealthStatus = $healthStatus
            serviceStartedOrModified = $false
            builderTaskAcknowledged = $false
          }
          Write-Host ('AI09_ZBOOK_BUILDER_DIAGNOSTIC=' + ($result | ConvertTo-Json -Compress))
 -and
              $taskAction.Arguments -like ('*' + '-File "' + $launcher + '"')
            )
          }
          $serviceMatchesTrustedMain = $false
          if ($serviceSourcePresent) {
            $mainService = Join-Path $env:GITHUB_WORKSPACE 'scripts\code-builder-worker-service.ts'
            if (Test-Path -LiteralPath $mainService -PathType Leaf) {
              $serviceMatchesTrustedMain = (
                (Get-FileHash -LiteralPath $mainService -Algorithm SHA256).Hash -eq
                (Get-FileHash -LiteralPath (Join-Path $root 'code-builder-worker-service.ts') -Algorithm SHA256).Hash
              )
            }
          }
          $lastTaskRunWithinTenMinutes = $false
          if ($taskInfo -and $taskInfo.LastRunTime -is [datetime]) {
            $lastTaskRunWithinTenMinutes = (
              $taskInfo.LastRunTime.ToUniversalTime() -gt
              (Get-Date).ToUniversalTime().AddMinutes(-10)
            )
          }
          # Read bounded existing local worker logs but emit ONLY static,
          # allowlisted error categories; never output raw lines, tokens,
          # stack traces, process arguments or workspace data.
          $logErrorClass = 'NO_DIAGNOSTIC_LOG'
          $knownSignatures = @(
            @{ pattern='ERR_MODULE_NOT_FOUND|Cannot find module'; category='MODULE_NOT_FOUND' },
            @{ pattern='ERR_UNKNOWN_FILE_EXTENSION|ERR_UNSUPPORTED_TYPESCRIPT_SYNTAX'; category='NODE_TYPESCRIPT_RUNTIME_ERROR' },
            @{ pattern='EADDRINUSE|EACCES.*listen'; category='LOCAL_BIND_ERROR' },
            @{ pattern='is not recognized as the name of a cmdlet|CommandNotFoundException'; category='LAUNCHER_COMMAND_NOT_FOUND' },
            @{ pattern='Cannot find path|ENOENT'; category='LOCAL_PATH_NOT_FOUND' },
            @{ pattern='CODE_BUILDER_TOKEN is required'; category='WORKER_TOKEN_MISSING_IN_LAUNCHER' },
            @{ pattern='SyntaxError|TypeError|ReferenceError'; category='WORKER_RUNTIME_EXCEPTION' }
          )
          foreach ($logName in @('worker.stderr.log','worker.log')) {
            $logFile = Join-Path $root $logName
            if (-not (Test-Path -LiteralPath $logFile -PathType Leaf)) { continue }
            $logErrorClass = 'UNCLASSIFIED_EXISTING_LOG'
            try {
              $lines = @(Get-Content -LiteralPath $logFile -Tail 80 -ErrorAction Stop)
              $sample = $lines -join [Environment]::NewLine
              foreach ($signature in $knownSignatures) {
                if ($sample -match $signature.pattern) {
                  $logErrorClass = $signature.category
                  break
                }
              }
            } catch {
              $logErrorClass = 'LOG_READ_UNAVAILABLE'
            } finally {
              $sample = $null
              $lines = $null
            }
            if ($logErrorClass -ne 'UNCLASSIFIED_EXISTING_LOG') { break }
          }
          $result = [ordered]@{
            existingLogErrorClass = $logErrorClass
            servicePort = 8796
            scheduledTaskState = $taskState
            scheduledTaskLastResult = $taskLastResult
            launcherPresent = [bool]$launcherPresent
            installedServiceSourcePresent = [bool]$serviceSourcePresent
            tokenFilePresent = [bool]$tokenPresent
            listenerPresent = [bool]$listenerPresent
            loopbackBound = [bool]$loopbackBound
            authenticatedHealthStatus = $healthStatus
            serviceStartedOrModified = $false
            builderTaskAcknowledged = $false
          }
          Write-Host ('AI09_ZBOOK_BUILDER_DIAGNOSTIC=' + ($result | ConvertTo-Json -Compress))
