name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config-acl-windows-proof:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise the exact repair code on disposable Windows files
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $tests = @('goriq-zbook-live-release-acl.test.ps1', 'goriq-zbook-fixed-acl-repair.test.ps1')
          $failed = $false
          foreach ($test in $tests) {
            $lines = @(& powershell.exe -NoLogo -NoProfile -NonInteractive -File (Join-Path tests $test) 2>&1)
            $code = $LASTEXITCODE
            $lines | ForEach-Object { Write-Host $_ }
            if ($code -ne 0) {
              $failed = $true
              $detail = (($lines | Select-Object -Last 14) | Out-String).Trim()
              $detail = $detail -replace '\[\d+m', '' -replace '[^A-Za-z0-9 ._:/()-]', ' '
              Write-Host ('::error title=' + $test + '::' + $detail.Substring(0, [Math]::Min(1450, $detail.Length)))
            }
          }
          if ($failed) { exit 1 }
          Write-Host '::notice title=Config ACL::Both exact native suites passed'
