name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Phase 0 control files
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f PROJECT_STATE.md
          test -f ROADMAP.md
          test -f .github/PULL_REQUEST_TEMPLATE.md
          test -d .github/agents
          echo "Phase 0 control files present."

  project-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Verify production health endpoint
        shell: bash
        run: |
          set -euo pipefail
          pnpm start > next-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          if ! pnpm healthcheck; then
            cat next-server.log
            exit 1
          fi
