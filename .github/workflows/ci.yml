name: CI

on:
  pull_request:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require exact source SHA
        shell: bash
        env:
          GORIQ_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GORIQ_EXPECTED_SOURCE_SHA"
      - name: Validate Phase 0 control files
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f PROJECT_STATE.md
          test -f ROADMAP.md
          test -f .github/PULL_REQUEST_TEMPLATE.md
          test -d .github/agents
          echo "Phase 0 control files present."

  project-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require exact source SHA
        shell: bash
        env:
          GORIQ_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GORIQ_EXPECTED_SOURCE_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Collect bounded public test runtime facts
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          python3 - <<'PY'
          # Read-only public diagnostic DATA. Test outcome and authority stay separate.
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import resource
          import selectors
          import shutil
          import stat
          import subprocess
          import time


          def probe_runtime(binary):
              probe = '[Console]::Out.WriteLine($PSVersionTable.PSVersion.ToString());[Console]::Out.WriteLine([Runtime.InteropServices.RuntimeInformation]::FrameworkDescription);[Console]::Out.WriteLine($ExecutionContext.SessionState.LanguageMode.ToString())'
              child = None
              streams = None
              def probe_once():
                  nonlocal child, streams
                  try:
                      deadline = time.monotonic() + 14
                      child = subprocess.Popen([str(binary), '-NoLogo', '-NoProfile', '-NonInteractive', '-Command', probe], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                      streams = selectors.DefaultSelector()
                      output = {'stdout': bytearray(), 'stderr': bytearray()}
                      for name, pipe in (('stdout', child.stdout), ('stderr', child.stderr)):
                          os.set_blocking(pipe.fileno(), False)
                          streams.register(pipe, selectors.EVENT_READ, name)
                      while streams.get_map():
                          remaining = deadline - time.monotonic()
                          if remaining <= 0:
                              return {'state': 'INCONCLUSIVE_TIMEOUT'}
                          for key, _ in streams.select(min(remaining, 0.1)):
                              data = os.read(key.fileobj.fileno(), 4097)
                              if not data:
                                  streams.unregister(key.fileobj)
                              elif len(output[key.data]) + len(data) > 4096:
                                  return {'state': 'INCONCLUSIVE_OUTPUT_BOUND'}
                              else:
                                  output[key.data].extend(data)
                      status = child.wait(timeout=max(0, deadline - time.monotonic()))
                      lines = bytes(output['stdout']).decode('utf-8', errors='strict').splitlines()
                      if status == 0 and not output['stderr'] and len(lines) == 3 and re.fullmatch(r'[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}', lines[0]) and re.fullmatch(r'\.NET(?: Core)? [0-9.]{1,32}', lines[1]) and lines[2] in ('FullLanguage', 'ConstrainedLanguage', 'NoLanguage', 'RestrictedLanguage'):
                          return {'state': 'CLOSED_VALID_FACTS', 'version': lines[0], 'framework': lines[1], 'languageMode': lines[2]}
                      return {'state': 'INCONCLUSIVE_CLOSED_PROBE'}
                  except subprocess.TimeoutExpired:
                      return {'state': 'INCONCLUSIVE_TIMEOUT'}
                  except (OSError, ValueError, UnicodeError):
                      return {'state': 'INCONCLUSIVE_IO'}
              try:
                  result = probe_once()
              finally:
                  cleanup_failed = False
                  if streams is not None:
                      try:
                          streams.close()
                      except OSError:
                          cleanup_failed = True
                  if child is not None:
                      try:
                          running = child.poll() is None
                      except OSError:
                          cleanup_failed = True
                          running = True
                      if running:
                          try:
                              child.kill()
                          except OSError:
                              cleanup_failed = True
                      try:
                          child.wait(timeout=1)
                      except (OSError, subprocess.TimeoutExpired):
                          cleanup_failed = True
                      for pipe in (child.stdout, child.stderr):
                          if pipe is not None:
                              try:
                                  pipe.close()
                              except OSError:
                                  cleanup_failed = True
              if cleanup_failed:
                  # Any unconfirmed owned cleanup overrides positive facts.
                  return {'state': 'INCONCLUSIVE_CLEANUP'}
              return result


          def collect_facts():
              facts = {'purpose': 'PUBLIC_TEST_RUNTIME_DIAGNOSTIC_ONLY', 'authority': False}
              try:
                  limits = resource.getrlimit(resource.RLIMIT_STACK)
                  facts['stackLimit'] = {'state': 'OBSERVED_BYTES', 'soft': limits[0], 'hard': limits[1]} if len(limits) == 2 and all(type(n) is int and -1 <= n <= 9223372036854775807 for n in limits) else {'state': 'INCONCLUSIVE_RANGE'}
              except (OSError, ValueError):
                  facts['stackLimit'] = {'state': 'INCONCLUSIVE_IO'}
              for name in ('DOTNET_DefaultStackSize', 'COMPlus_DefaultStackSize'):
                  value = os.environ.get(name)
                  item = {'state': 'ABSENT' if value is None else 'INCONCLUSIVE_NONCANONICAL'}
                  if value is not None and re.fullmatch(r'(?:0[xX])?[0-9a-fA-F]{1,8}', value):
                      number = int(value, 16)
                      if 65536 <= number <= 67108864:
                          item = {'state': 'CANONICAL_BOUNDED_HEX_BYTES', 'bytes': number}
                  facts[name] = item
              try:
                  executable = shutil.which('pwsh')
                  if executable is None:
                      facts['pwsh'] = {'state': 'INCONCLUSIVE_MISSING'}
                  else:
                      binary = Path(executable).resolve(strict=True)
                      descriptor = os.open(binary, os.O_RDONLY | os.O_NONBLOCK | os.O_CLOEXEC)
                      with os.fdopen(descriptor, 'rb') as stream:
                          info = os.fstat(stream.fileno())
                          if not stat.S_ISREG(info.st_mode) or not 0 < info.st_size <= 16777216:
                              facts['pwsh'] = {'state': 'INCONCLUSIVE_BINARY_BOUND'}
                              return facts
                          data = stream.read(16777217)
                      if len(data) != info.st_size:
                          facts['pwsh'] = {'state': 'INCONCLUSIVE_BINARY_BOUND'}
                      else:
                          facts['pwsh'] = probe_runtime(binary)
                          facts['pwsh']['binarySha256'] = hashlib.sha256(data).hexdigest()
              except (OSError, ValueError, RuntimeError):
                  facts['pwsh'] = {'state': 'INCONCLUSIVE_IO'}
              return facts


          print(json.dumps(collect_facts(), sort_keys=True))
          PY
      - name: P8 Security Regression Suite
        run: pnpm test:p8-security
      - name: Windows ACL repair decision fixtures
        shell: pwsh
        run: |
          ./tests/goriq-zbook-owner-acl-repair.test.ps1
          ./tests/jarvis-pc-runtime-acl.test.ps1
          ./tests/jarvis-pc-runtime-process.test.ps1
      - name: Build
        run: pnpm build
      - name: Verify production health endpoint
        shell: bash
        run: |
          set -euo pipefail
          pnpm start > next-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          if ! pnpm healthcheck; then
            cat next-server.log
            exit 1
          fi

  independent-verifier-container:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Start bounded resource observer
        run: node scripts/jarvis-verifier-resource-observer.mjs --observe
      - name: Real restricted-container six-check verification
        if: ${{ !cancelled() }}
        run: node scripts/jarvis-verifier-live-ci.mjs --execute-hosted-ci
      - name: Finalize bounded resource observer
        if: always()
        run: node scripts/jarvis-verifier-resource-observer.mjs --stop
      - name: Retain hosted-container evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-verifier-container-${{ github.sha }}
          path: |
            ${{ runner.temp }}/goriq-verifier-live-evidence/
            ${{ job.status != 'success' && format('!{0}/goriq-verifier-live-evidence/receipt.json', runner.temp) || '' }}
          if-no-files-found: error
          retention-days: 14

      - name: Retain supplemental resource observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-verifier-resource-observer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/goriq-verifier-resource-observer-${{ github.run_id }}-${{ github.run_attempt }}/artifact/
          if-no-files-found: warn
          retention-days: 14

  windows-runtime-byte-fixtures:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require exact source SHA
        shell: powershell
        env:
          GORIQ_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ((& git rev-parse HEAD).Trim() -ne $env:GORIQ_EXPECTED_SOURCE_SHA) { throw 'SOURCE_SHA_MISMATCH' }
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Confirm native rotation entry defaults to inert plan
        shell: powershell
        run: |
          node scripts/owner-code-rotation-native-1218.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -NonInteractive -File scripts/owner-code-rotation-native-1218.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -NonInteractive -File scripts/owner-code-launcher-binding-inspection-1218.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Owner credential plan-only and temporary encrypted fixtures
        shell: powershell
        run: node --test --test-concurrency=2 scripts/owner-code-rotation.test.mjs scripts/owner-code-windows.test.mjs scripts/owner-code-rotation-authority.test.mjs scripts/owner-code-preflight.test.mjs scripts/owner-code-dialog.test.mjs scripts/install-owner-code-windows.test.mjs scripts/owner-code-rotation-redirect.test.mjs scripts/owner-code-practical.test.mjs scripts/owner-code-fleet-preservation.test.mjs scripts/owner-code-rotation-acceptance.test.mjs scripts/owner-code-rotation-transaction.test.mjs scripts/owner-code-pc-preservation.test.mjs scripts/owner-code-rotation-readiness.test.mjs scripts/owner-code-warning-1218.test.mjs scripts/owner-code-rotation-native-1218.test.mjs scripts/owner-code-rotation-native-stage.test.mjs scripts/owner-code-fresh-checkout.test.mjs scripts/owner-code-protection-diagnostics.test.mjs scripts/owner-code-protection-failure-details.test.mjs scripts/owner-code-launcher-binding-inspection-1218.test.mjs scripts/owner-code-launcher-binding-workflow.test.mjs scripts/owner-code-launcher-binding-native-shell.test.mjs scripts/owner-code-launcher-refusal-reasons-1218.test.mjs scripts/owner-code-private-rotation-exercise.test.mjs scripts/owner-code-planned-reserve.test.mjs scripts/owner-code-rotation-exercise-protocol.test.mjs scripts/owner-code-private-scope-capture.test.mjs scripts/owner-code-rotation-composed-entry.test.mjs scripts/owner-code-entry-json-bound.test.mjs tests/owner-code-task-proof.test.mjs tests/owner-code-task-proof-diagnostics.test.mjs tests/owner-code-task-retention-recovery.test.mjs tests/owner-code-task-collection.test.mjs scripts/owner-code-cutover-bootstrap.test.mjs scripts/owner-code-cutover-private-bootstrap.test.mjs scripts/owner-code-cutover-profile.test.mjs scripts/owner-code-production-cutover-contract.test.mjs scripts/owner-code-production-cutover-helper.test.mjs scripts/owner-code-production-proof.test.mjs scripts/owner-code-cutover-clean-start.test.mjs scripts/owner-code-cutover-peer.test.mjs
      - name: Windows PowerShell 5.1 atomic pointer fixtures
        shell: powershell
        run: |
          ./tests/goriq-pc-runtime-replace.test.ps1
          ./tests/goriq-zbook-runtime-owner-repair.test.ps1
          ./tests/goriq-pc-runtime-launch.test.ps1
          ./tests/gai-zbook-launcher-file.test.ps1
          ./tests/goriq-zbook-watchdog-launcher-repair.test.ps1
          ./tests/completion-native-transaction.test.ps1
          ./tests/completion-native-pointer.test.ps1
          ./tests/goriq-zbook-fixed-acl-repair.test.ps1
      - name: Isolated native recovery controller fixture
        shell: powershell
        run: ./tests/completion-native-resume.test.ps1
      - name: Windows PowerShell 5.1 access media fixtures
        shell: powershell
        run: |
          ./tests/ai09-access-media.test.ps1
          ./tests/ai09-access-media-windows-acl.test.ps1
          ./tests/ai09-access-media-lifecycle.test.ps1
