name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Phase 0 control files
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f PROJECT_STATE.md
          test -f ROADMAP.md
          test -f .github/PULL_REQUEST_TEMPLATE.md
          test -d .github/agents
          echo "Phase 0 control files present."

  project-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect project checks
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            echo "Node project detected. Install/test commands will be enabled when Phase 1 locks the package manager and scripts."
          elif [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            echo "Python project detected. Test commands will be enabled when Phase 1 locks the toolchain."
          else
            echo "Phase 0 governance-only repository: no application toolchain yet."
          fi
