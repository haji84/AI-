name: AI09 public candidate qualification (single bounded experiment)

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/goriq-ai09-public-qualification.yml
      - scripts/goriq-ai09-public-qualification.mjs
      - tests/ai09-public-qualification.test.mjs

# Experiment2 only after separate exact owner approval; known run1 is retained.
permissions:
  contents: read

concurrency:
  group: ai09-public-qualification-1868-once
  cancel-in-progress: false

jobs:
  qualification:
    if: >-
      github.repository == 'haji84/AI-' &&
      github.event.pull_request.number == 1868 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.sender.login == 'haji84' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 5m
    steps:
      - name: Checkout exact same-repository PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify new scope, exact content, zero-charge stop and exact second/prior history
        run: node scripts/goriq-ai09-public-qualification.mjs prepare
      - name: Test bounded transport and fail-closed authorization without inference
        run: node --test tests/ai09-public-qualification.test.mjs
      - name: Install SHA-pinned existing public Ollama binary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 240 \
            https://github.com/ollama/ollama/releases/download/v0.34.0/ollama-linux-amd64.tar.zst \
            -o "$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          echo "cf95886728959aa09910bb34de5cca1cc5a8f68003b5597197d3f2c2d57c0804  $RUNNER_TEMP/ollama-linux-amd64.tar.zst" | sha256sum -c -
          sudo tar --zstd -xf "$RUNNER_TEMP/ollama-linux-amd64.tar.zst" -C /usr
      - name: Start loopback-only server and pull one pinned-manifest candidate
        shell: bash
        run: |
          set -euo pipefail
          ollama serve >"$RUNNER_TEMP/ai09-public-ollama.log" 2>&1 &
          echo "OLLAMA_SERVER_PID=$!" >> "$GITHUB_ENV"
          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:11434/api/tags >/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then echo LOCAL_MODEL_START_FAILED; exit 1; fi
          timeout 480s ollama pull qwen3:1.7b
      - name: Experiment2 at most8 sequential calls, strict schema, no retries or paid fallback
        timeout-minutes: 15
        run: node scripts/goriq-ai09-public-qualification.mjs run
      - name: Preserve bounded public raw-byte packet even on HOLD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai09-public-qualification-packet
          path: ${{ runner.temp }}/ai09-public-qualification-packet.json
          if-no-files-found: warn
          retention-days: 7
      - name: Stop ephemeral server
        if: always()
        shell: bash
        run: |
          if [ -n "${OLLAMA_SERVER_PID:-}" ]; then kill "$OLLAMA_SERVER_PID" || true; fi
