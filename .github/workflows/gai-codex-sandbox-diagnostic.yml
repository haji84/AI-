name: GAI Codex Sandbox Diagnostic

on:
  workflow_dispatch:
  issues:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[JARVIS CODEX SANDBOX DIAG]')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Diagnose Codex sandbox policy
        shell: powershell
        run: |
          .\scripts\diagnose-codex-sandbox-windows.ps1
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gai-codex-sandbox-diagnostic
          path: .gai-results/
          include-hidden-files: true
          retention-days: 30
