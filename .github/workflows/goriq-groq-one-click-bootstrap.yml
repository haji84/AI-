name: GORIQ Groq One Click Bootstrap

on:
  push:
    branches: [main]
    paths:
      - 'scripts/configure-groq-free-secret-windows.ps1'
      - 'scripts/invoke-node-with-groq-secret-windows.ps1'
      - 'scripts/goriq-groq-repair.mjs'
      - 'scripts/install-groq-one-click-windows.ps1'
      - '.github/workflows/goriq-groq-one-click-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goriq-groq-one-click-bootstrap-zbook
  cancel-in-progress: false

jobs:
  install-launcher:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Install Groq one-click launcher
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\install-groq-one-click-windows.ps1
      - name: Verify launcher exists
        shell: powershell
        run: |
          $desktop = [Environment]::GetFolderPath('Desktop')
          $launcher = Join-Path $desktop 'GORIQ Groq設定.cmd'
          if (-not (Test-Path -LiteralPath $launcher)) {
            throw "GORIQ Groq setup launcher was not installed: $launcher"
          }
          Write-Host "GORIQ_GROQ_LAUNCHER_READY=$launcher"

  groq-repair-smoke:
    needs: [install-launcher]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Verify Groq free external repair using local DPAPI secret
        shell: powershell
        env:
          GORIQ_GROQ_MODEL: qwen/qwen3.8-27b
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'goriq-groq-repair-smoke'
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Set-Content -Path (Join-Path $root 'probe.txt') -Value 'BEFORE_GROQ' -NoNewline
          $prompt = "AllowedPaths=probe.txt`nReplace the complete content of probe.txt with exactly AFTER_GROQ."
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\invoke-node-with-groq-secret-windows.ps1 -RequireSecret -NodeScript .\scripts\goriq-groq-repair.mjs -Workspace $root -InputText $prompt
          $actual = (Get-Content (Join-Path $root 'probe.txt') -Raw).Trim()
          if ($actual -ne 'AFTER_GROQ') { throw "Groq repair smoke mismatch: $actual" }
