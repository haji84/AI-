name: JARVIS Vercel Sync

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/jarvis-mac-zero-touch.sh'
      - 'src/app/jarvis/**'
      - 'src/app/api/jarvis/**'
      - '.github/workflows/jarvis-vercel-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-vercel-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_YGrZkBR7MyYxkq3K9XkTBhqu
      VERCEL_PROJECT_NAME: jarvis
      JARVIS_PRODUCTION_URL: https://jarvis-fawn-iota.vercel.app
    steps:
      - uses: actions/checkout@v4

      - name: Sync live JARVIS endpoints into Vercel
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          STATE_ROOT="$HOME/Library/Application Support/JARVIS"
          ENV_FILE="$STATE_ROOT/jarvis.env"
          SYNC_FILE="$STATE_ROOT/vercel-api-sync.sha256"
          RETRY_FILE="$STATE_ROOT/vercel-deploy-retry-after.epoch"
          test -s "$ENV_FILE"

          load_runtime() {
            set -a
            source "$ENV_FILE"
            set +a
          }
          broker_is_live() {
            [[ -n "${JARVIS_PUBLIC_BROKER_URL:-}" ]] && curl --fail --silent --show-error --max-time 8 "$JARVIS_PUBLIC_BROKER_URL/health" >/dev/null 2>&1
          }

          load_runtime
          : "${JARVIS_OWNER_TOKEN:?missing JARVIS_OWNER_TOKEN}"
          : "${VERCEL_TOKEN:?missing VERCEL_TOKEN}"

          if ! broker_is_live; then
            echo "Stored Quick Tunnel is stale. Rotating the Broker tunnel automatically."
            launchctl kickstart -k "gui/$(id -u)/com.aicompany.jarvis-broker" >/dev/null 2>&1 || true
            launchctl kickstart -k "gui/$(id -u)/com.aicompany.jarvis-broker-tunnel" >/dev/null 2>&1 || true
            sleep 5
            launchctl kickstart -k "gui/$(id -u)/com.aicompany.jarvis-zero-touch" >/dev/null 2>&1 || true

            refreshed=false
            for _ in $(seq 1 30); do
              sleep 2
              load_runtime
              if broker_is_live; then
                refreshed=true
                break
              fi
            done
            [[ "$refreshed" == true ]] || { echo "Unable to obtain a healthy replacement Quick Tunnel URL." >&2; exit 2; }
          fi

          load_runtime
          : "${JARVIS_PUBLIC_BROKER_URL:?missing JARVIS_PUBLIC_BROKER_URL after tunnel reconciliation}"
          broker_is_live || { echo "JARVIS public Broker is not reachable after reconciliation." >&2; exit 3; }

          desired_hash="$(printf '%s\n%s\n%s\n%s\n%s' \
            "$JARVIS_PUBLIC_BROKER_URL" \
            "$JARVIS_OWNER_TOKEN" \
            "${JARVIS_REMOTE_PUBLIC_URL:-}" \
            "${JARVIS_REMOTE_GATEWAY_TOKEN:-}" \
            "$GITHUB_SHA" | shasum -a 256 | awk '{print $1}')"
          previous_hash="$(cat "$SYNC_FILE" 2>/dev/null || true)"
          echo "desired_hash=$desired_hash" >> "$GITHUB_OUTPUT"

          if [[ "$desired_hash" == "$previous_hash" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "JARVIS Vercel environment and deployed commit already match the current runtime."
            exit 0
          fi

          now="$(date +%s)"
          retry_after="$(cat "$RETRY_FILE" 2>/dev/null || true)"
          if [[ "$retry_after" =~ ^[0-9]+$ ]] && (( now < retry_after )); then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "JARVIS Production deploy is deferred by Vercel quota until epoch $retry_after."
            exit 0
          fi
          rm -f "$RETRY_FILE"

          node <<'NODE'
          const token = process.env.VERCEL_TOKEN;
          const teamId = process.env.VERCEL_TEAM_ID;
          const projectName = process.env.VERCEL_PROJECT_NAME;
          const brokerUrl = process.env.JARVIS_PUBLIC_BROKER_URL;
          const ownerToken = process.env.JARVIS_OWNER_TOKEN;
          const remoteUrl = process.env.JARVIS_REMOTE_PUBLIC_URL || "";
          const remoteToken = process.env.JARVIS_REMOTE_GATEWAY_TOKEN || "";
          if (!token || !teamId || !projectName || !brokerUrl || !ownerToken) throw new Error("JARVIS/Vercel sync context is incomplete");

          const headers = { Authorization: `Bearer ${token}`, "Content-Type": "application/json" };
          async function request(url, init = {}) {
            const response = await fetch(url, { ...init, headers: { ...headers, ...(init.headers || {}) } });
            const text = await response.text();
            let body = null;
            if (text) { try { body = JSON.parse(text); } catch { body = { message: text }; } }
            if (!response.ok) throw new Error(`Vercel API ${response.status}: ${body?.error?.message || body?.message || "request failed"}`);
            return body;
          }

          const project = await request(`https://api.vercel.com/v9/projects/${encodeURIComponent(projectName)}?teamId=${encodeURIComponent(teamId)}`);
          if (!project?.id || !project?.accountId) throw new Error("Unable to resolve JARVIS Vercel project");

          const envs = [
            { key: "JARVIS_BROKER_URL", value: brokerUrl, type: "plain", target: ["production"] },
            { key: "JARVIS_OWNER_TOKEN", value: ownerToken, type: "sensitive", target: ["production"] },
          ];
          if (remoteUrl && remoteToken) {
            envs.push(
              { key: "JARVIS_REMOTE_GATEWAY_URL", value: remoteUrl, type: "plain", target: ["production"] },
              { key: "JARVIS_REMOTE_GATEWAY_TOKEN", value: remoteToken, type: "sensitive", target: ["production"] },
            );
          }

          await request(`https://api.vercel.com/v10/projects/${encodeURIComponent(project.id)}/env?upsert=true&teamId=${encodeURIComponent(teamId)}`, {
            method: "POST",
            body: JSON.stringify(envs),
          });

          const fs = await import("node:fs/promises");
          await fs.mkdir(".vercel", { recursive: true });
          await fs.writeFile(".vercel/project.json", JSON.stringify({ projectId: project.id, orgId: project.accountId }) + "\n", { mode: 0o600 });
          console.log(`Synced JARVIS runtime endpoints to Vercel project ${projectName}.`);
          NODE

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: steps.sync.outputs.changed == 'true'
        with:
          version: 11.19.0
          run_install: false

      - uses: actions/setup-node@v4
        if: steps.sync.outputs.changed == 'true'
        with:
          node-version: 24.19.0

      - name: Redeploy Production with synchronized environment
        id: deploy
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -uo pipefail
          STATE_ROOT="$HOME/Library/Application Support/JARVIS"
          RETRY_FILE="$STATE_ROOT/vercel-deploy-retry-after.epoch"
          OUTPUT_FILE="$RUNNER_TEMP/jarvis-vercel-deploy-output.txt"

          set +e
          pnpm dlx vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN" >"$OUTPUT_FILE" 2>&1
          status=$?
          set -e
          cat "$OUTPUT_FILE"

          if (( status == 0 )); then
            rm -f "$RETRY_FILE"
            echo "deployed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -q 'api-deployments-free-per-day' "$OUTPUT_FILE"; then
            retry_after="$(( $(date +%s) + 86400 ))"
            printf '%s\n' "$retry_after" > "$RETRY_FILE"
            chmod 600 "$RETRY_FILE"
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "Vercel free deployment quota reached; JARVIS will retry automatically after the quota window."
            exit 0
          fi

          exit "$status"

      - name: Verify Vercel can reach the live Broker
        if: steps.sync.outputs.changed == 'true' && steps.deploy.outputs.deployed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          STATE_ROOT="$HOME/Library/Application Support/JARVIS"
          SYNC_FILE="$STATE_ROOT/vercel-api-sync.sha256"
          RETRY_FILE="$STATE_ROOT/vercel-deploy-retry-after.epoch"
          for _ in $(seq 1 30); do
            body="$(curl --silent --show-error --location --max-time 10 "$JARVIS_PRODUCTION_URL/api/jarvis/connectivity" || true)"
            if node -e 'const x=JSON.parse(process.argv[1]); process.exit(x.ok===true && x.brokerConfigured===true && x.ownerTokenConfigured===true && x.brokerReachable===true ? 0 : 1)' "$body" 2>/dev/null; then
              printf '%s\n' '${{ steps.sync.outputs.desired_hash }}' > "$SYNC_FILE"
              chmod 600 "$SYNC_FILE"
              rm -f "$RETRY_FILE"
              echo "JARVIS Production connectivity verified and deployed commit recorded."
              exit 0
            fi
            sleep 4
          done
          echo "JARVIS Production connectivity verification timed out." >&2
          exit 1