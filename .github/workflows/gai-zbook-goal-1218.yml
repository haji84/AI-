name: GORIQ ZBook Goal 1218 Bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-code-goal:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Prepare durable isolated coding workspace and local Builder
        shell: powershell
        run: |
          $goalWorkspace = Join-Path $env:LOCALAPPDATA 'GAIWorker\goal-1218-workspace'
          if (-not (Test-Path (Join-Path $goalWorkspace '.git'))) {
            & git clone --no-hardlinks $env:GITHUB_WORKSPACE $goalWorkspace
            if ($LASTEXITCODE -ne 0) { throw 'Isolated Goal workspace clone failed' }
          }
          $verifierTests = @('tests/jarvis-adb-mass-enrollment.test.ts', 'tests/goriq-direct-goal-bridge-resume.test.ts')
          foreach ($verifierTest in $verifierTests) {
            $sourceTest = Join-Path $env:GITHUB_WORKSPACE $verifierTest
            $targetTest = Join-Path $goalWorkspace $verifierTest
            if (-not (Test-Path $targetTest)) { throw "Isolated verifier test is missing: $verifierTest" }
            if ((Get-FileHash $sourceTest -Algorithm SHA256).Hash -ne (Get-FileHash $targetTest -Algorithm SHA256).Hash) {
              $testChanges = & git -C $goalWorkspace status --porcelain -- $verifierTest
              if ($LASTEXITCODE -ne 0 -or $testChanges) { throw "Isolated verifier test has local changes; refusing refresh: $verifierTest" }
              Copy-Item -LiteralPath $sourceTest -Destination $targetTest
            }
          }
          Push-Location $goalWorkspace
          try {
            & node --test $verifierTests
            if ($LASTEXITCODE -ne 0) { throw 'Refreshed isolated verifier tests failed' }
          } finally { Pop-Location }
          .\scripts\install-code-builder-windows.ps1 -WorkerId 'zbook' -Workspace $goalWorkspace -ExecTimeoutMs 600000
          $tokenPath = Join-Path $env:LOCALAPPDATA 'GAIWorker\code-builder\token.txt'
          if (-not (Test-Path $tokenPath)) { throw 'Local Builder token unavailable' }
          $env:CODE_BUILDER_LOCAL_TOKEN = (Get-Content $tokenPath -Raw).Trim()
          $env:CODE_BUILDER_LOCAL_URL = 'http://127.0.0.1:8796'
          $env:GORIQ_1218_WORKSPACE = $goalWorkspace
          & node .\scripts\zbook-recover-timeout-1218.ts
          if ($LASTEXITCODE -ne 0) { throw 'Confirmed timeout recovery was refused' }
          try { & node .\scripts\zbook-owner-code-goal-1218.ts; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          finally { Remove-Item Env:CODE_BUILDER_LOCAL_TOKEN -ErrorAction SilentlyContinue }
      - name: Verify owner-local utility on ZBook
        shell: powershell
        run: node --test scripts/owner-code-windows.test.mjs
      - name: Capture bounded Compass Goal failure categories
        if: always()
        shell: powershell
        run: node scripts/zbook-goal-diagnostics.ts
      - name: Upload bounded Bridge evidence and code patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goriq-zbook-goal-1218
          path: .gai-results/goal-1218-bridge*
          include-hidden-files: true
          retention-days: 30
