name: Temporary patch Broker auto-deploy

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_tmp-patch-broker-autodeploy.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Patch bootstrap triggers and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/jarvis-mac-bootstrap.yml')
          s=p.read_text()
          needle="      - 'scripts/jarvis-mac-zero-touch-install.sh'\n"
          insert=needle+"      - 'scripts/jarvis-broker.ts'\n"
          if "      - 'scripts/jarvis-broker.ts'\n" not in s:
              if needle not in s: raise SystemExit('bootstrap trigger anchor missing')
              s=s.replace(needle,insert,1)
          p.write_text(s)
          PY
          git rm .github/workflows/_tmp-patch-broker-autodeploy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/jarvis-mac-bootstrap.yml
          git diff --cached --check
          git commit -m 'ci: auto-deploy Broker source changes to Mac runtime'
          git push origin HEAD:${{ github.head_ref }}
