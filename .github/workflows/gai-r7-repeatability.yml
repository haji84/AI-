name: GAI R7 Repeatability

on:
  workflow_run:
    workflows: ["GAI R6 Benchmark v1.1"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gai-r7-repeatability
  cancel-in-progress: false

jobs:
  r7-zbook:
    name: R7 repeated paired benchmark on ZBook
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    env:
      GAI_WORKER_ID: zbook
      GAI_LOCAL_MODEL_ENDPOINT: http://127.0.0.1:11434
      GAI_LOCAL_MODEL_NAME: qwen3:4b
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Download first real R6 run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: gai-baseline-zbook
          path: .gai-reference
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Reject manual run without paired reference
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          Write-Error 'R7 requires the artifact from a completed real R6 run. Use the automatic workflow_run path.'
          exit 2

      - name: Ensure Ollama runtime is reachable
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Test-Ollama {
            try { Invoke-RestMethod -Uri "$($env:GAI_LOCAL_MODEL_ENDPOINT)/api/tags" -TimeoutSec 5 | Out-Null; return $true } catch { return $false }
          }
          if (-not (Test-Ollama)) {
            $ollama = Get-Command ollama -ErrorAction SilentlyContinue
            if ($ollama) { $exe = $ollama.Source } else { $exe = Join-Path $env:LOCALAPPDATA 'Programs\Ollama\ollama.exe' }
            if (-not (Test-Path $exe)) { throw 'Ollama executable not found' }
            Start-Process -FilePath $exe -ArgumentList 'serve' -WindowStyle Hidden
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) { Start-Sleep -Seconds 2; if (Test-Ollama) { $ready = $true; break } }
            if (-not $ready) { throw 'Ollama API did not become reachable' }
          }

      - name: Execute second real R6 v1.1 run
        shell: powershell
        run: node scripts/gai-baseline-v11.mjs --real

      - name: Derive paired R7 statistics evidence
        shell: powershell
        run: node scripts/gai-r7-repeatability.ts

      - name: Upload complete R7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gai-baseline-zbook
          path: .gai-results/
          include-hidden-files: true
          retention-days: 90
