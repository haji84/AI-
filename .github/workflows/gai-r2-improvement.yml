name: GAI R2 Measured Improvement

on:
  workflow_run:
    workflows: ["GAI R1 Evidence Rerun"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/gai-r2-improvement.yml"
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:
    inputs:
      target_worker:
        description: "Preferred worker (auto, zbook, macbook)"
        required: false
        default: "auto"
        type: choice
        options: [auto, zbook, macbook]

permissions:
  contents: read
  actions: read

concurrency:
  group: gai-r2-measured-improvement
  cancel-in-progress: true

jobs:
  route:
    name: Hosted R2 capability router
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      target: ${{ steps.route.outputs.target }}
      r1_run_id: ${{ steps.route.outputs.r1_run_id }}
      state: ${{ steps.route.outputs.state }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Resolve R1 provenance and select an online worker
        id: route
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TARGET: ${{ inputs.target_worker || 'auto' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .gai-results

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            r1_run_id="${{ github.event.workflow_run.id }}"
          else
            r1_run_id="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/gai-r1-evidence-rerun.yml/runs?branch=main&status=success&per_page=10" --jq '.workflow_runs[0].id // empty')"
          fi
          if [ -z "$r1_run_id" ]; then
            echo 'No verified R1 run is available.' >&2
            exit 2
          fi

          already=0
          while IFS= read -r run_id; do
            [ -z "$run_id" ] && continue
            count="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --jq '[.artifacts[] | select(.expired == false and .name == "gai-baseline-zbook")] | length' 2>/dev/null || echo 0)"
            if [ "${count:-0}" -gt 0 ]; then already=1; break; fi
          done < <(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/gai-r2-improvement.yml/runs?status=success&per_page=20" --jq '.workflow_runs[].id' 2>/dev/null || true)

          target=none
          state=WAITING_FOR_CAPABILITY
          if [ "$already" -eq 1 ]; then
            state=ALREADY_EXECUTED
          else
            runners="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100" 2>/dev/null || printf '{"runners":[]}')"
            zbook_online="$(printf '%s' "$runners" | jq -r '[.runners[] | select((.name|ascii_downcase)=="zbook" and .status=="online" and (.busy|not))] | length')"
            mac_online="$(printf '%s' "$runners" | jq -r '[.runners[] | select((.name|ascii_downcase)=="macbook" and .status=="online" and (.busy|not))] | length')"
            requested="${REQUESTED_TARGET:-auto}"
            if [ "$requested" = "zbook" ] && [ "$zbook_online" -gt 0 ]; then target=zbook; state=RUNNABLE
            elif [ "$requested" = "macbook" ] && [ "$mac_online" -gt 0 ]; then target=macbook; state=RUNNABLE
            elif [ "$requested" = "auto" ] && [ "$zbook_online" -gt 0 ]; then target=zbook; state=RUNNABLE
            elif [ "$requested" = "auto" ] && [ "$mac_online" -gt 0 ]; then target=macbook; state=RUNNABLE
            fi
          fi

          printf 'target=%s\nr1_run_id=%s\nstate=%s\n' "$target" "$r1_run_id" "$state" >> "$GITHUB_OUTPUT"
          printf '{"schemaVersion":1,"stage":"R2","target":"%s","state":"%s","r1RunId":"%s","checkedAt":"%s"}\n' "$target" "$state" "$r1_run_id" "$(date -u +%FT%TZ)" > .gai-results/r2-route.json
          cat .gai-results/r2-route.json
      - name: Upload R2 routing state
        uses: actions/upload-artifact@v4
        with:
          name: gai-r2-route-status
          path: .gai-results/r2-route.json
          retention-days: 30

  r2-zbook:
    name: R2 heldout improvement on ZBook
    needs: route
    if: needs.route.outputs.target == 'zbook'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    env:
      GAI_LOCAL_MODEL_ENDPOINT: http://127.0.0.1:11434
      GAI_LOCAL_MODEL_NAME: qwen3:4b
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: gai-baseline-zbook
          path: .gai-reference/r1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.route.outputs.r1_run_id }}
      - name: Ensure Ollama runtime is reachable
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          try { Invoke-RestMethod -Uri "$($env:GAI_LOCAL_MODEL_ENDPOINT)/api/tags" -TimeoutSec 5 | Out-Null }
          catch {
            $ollama = Get-Command ollama -ErrorAction SilentlyContinue
            if ($ollama) { $exe = $ollama.Source } else { $exe = Join-Path $env:LOCALAPPDATA 'Programs\Ollama\ollama.exe' }
            if (-not (Test-Path $exe)) { throw 'Ollama executable not found' }
            Start-Process -FilePath $exe -ArgumentList 'serve' -WindowStyle Hidden
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) { Start-Sleep -Seconds 2; try { Invoke-RestMethod -Uri "$($env:GAI_LOCAL_MODEL_ENDPOINT)/api/tags" -TimeoutSec 5 | Out-Null; $ready = $true; break } catch {} }
            if (-not $ready) { throw 'Ollama API did not become reachable' }
          }
      - name: Verify safety and governance regression set
        shell: powershell
        run: node --test tests/approval-key.test.ts tests/approval-readiness.test.ts tests/auto-merge-policy.test.ts tests/bounded-runner.test.ts tests/autonomy-capabilities.test.ts
      - name: Mark safety gate verified for this job only
        shell: powershell
        run: '"R2_SAFETY_VERIFIED=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - name: Select candidate from TRAIN failures and evaluate HELDOUT once
        shell: powershell
        run: node scripts/gai-r2-improvement.mjs
      - name: Upload complete R2 campaign result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gai-baseline-zbook
          path: .gai-results/
          include-hidden-files: true
          retention-days: 90

  r2-macbook:
    name: R2 heldout improvement on MacBook fallback
    needs: route
    if: needs.route.outputs.target == 'macbook'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 180
    env:
      GAI_LOCAL_MODEL_ENDPOINT: http://127.0.0.1:11434
      GAI_LOCAL_MODEL_NAME: qwen3:4b
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: gai-baseline-zbook
          path: .gai-reference/r1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.route.outputs.r1_run_id }}
      - name: Ensure zero-cost Ollama fallback runtime
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ollama >/dev/null 2>&1; then
            if command -v brew >/dev/null 2>&1; then brew install ollama; else echo 'Ollama unavailable on MacBook fallback' >&2; exit 3; fi
          fi
          if ! curl -fsS "$GAI_LOCAL_MODEL_ENDPOINT/api/tags" >/dev/null 2>&1; then
            nohup ollama serve > /tmp/gai-ollama.log 2>&1 &
            for _ in $(seq 1 30); do sleep 2; curl -fsS "$GAI_LOCAL_MODEL_ENDPOINT/api/tags" >/dev/null 2>&1 && break; done
          fi
          curl -fsS "$GAI_LOCAL_MODEL_ENDPOINT/api/tags" >/dev/null
          if ! ollama list | awk 'NR>1 {print $1}' | grep -qx "$GAI_LOCAL_MODEL_NAME"; then ollama pull "$GAI_LOCAL_MODEL_NAME"; fi
      - name: Verify safety and governance regression set
        shell: bash
        run: node --test tests/approval-key.test.ts tests/approval-readiness.test.ts tests/auto-merge-policy.test.ts tests/bounded-runner.test.ts tests/autonomy-capabilities.test.ts
      - name: Mark safety gate verified for this job only
        shell: bash
        run: echo 'R2_SAFETY_VERIFIED=1' >> "$GITHUB_ENV"
      - name: Select candidate from TRAIN failures and evaluate HELDOUT once
        shell: bash
        run: node scripts/gai-r2-improvement.mjs
      - name: Upload complete R2 campaign result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gai-baseline-zbook
          path: .gai-results/
          include-hidden-files: true
          retention-days: 90
