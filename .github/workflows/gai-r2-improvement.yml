name: GAI R2 Measured Improvement

on:
  workflow_run:
    workflows: ["GAI R1 Evidence Rerun"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/gai-r2-improvement.yml"
      - "scripts/gai-r2-improvement.mjs"

permissions:
  contents: read
  actions: read

concurrency:
  group: gai-r2-measured-improvement
  cancel-in-progress: false

jobs:
  r2-zbook:
    name: R2 train-designed heldout improvement on ZBook
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    env:
      GAI_LOCAL_MODEL_ENDPOINT: http://127.0.0.1:11434
      GAI_LOCAL_MODEL_NAME: qwen3:4b
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Resolve verified R1 evidence run
        id: r1
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.event_name }}' -eq 'workflow_run') {
            $runId = '${{ github.event.workflow_run.id }}'
          } else {
            $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
            }
            $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/gai-r1-evidence-rerun.yml/runs?branch=main&status=success&per_page=10"
            $response = Invoke-RestMethod -Uri $uri -Headers $headers -TimeoutSec 30
            $candidate = $response.workflow_runs | Where-Object { $_.conclusion -eq 'success' } | Select-Object -First 1
            if (-not $candidate) { throw 'No successful verified R1 evidence run found' }
            $runId = [string]$candidate.id
          }
          if (-not $runId) { throw 'R1 provenance run id is empty' }
          "run_id=$runId" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Using verified R1 run $runId"
      - name: Download verified R1 baseline evidence
        uses: actions/download-artifact@v4
        with:
          name: gai-baseline-zbook
          path: .gai-reference/r1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.r1.outputs.run_id }}
      - name: Ensure Ollama runtime is reachable
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          try { Invoke-RestMethod -Uri "$($env:GAI_LOCAL_MODEL_ENDPOINT)/api/tags" -TimeoutSec 5 | Out-Null }
          catch {
            $ollama = Get-Command ollama -ErrorAction SilentlyContinue
            if ($ollama) { $exe = $ollama.Source } else { $exe = Join-Path $env:LOCALAPPDATA 'Programs\Ollama\ollama.exe' }
            if (-not (Test-Path $exe)) { throw 'Ollama executable not found' }
            Start-Process -FilePath $exe -ArgumentList 'serve' -WindowStyle Hidden
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) { Start-Sleep -Seconds 2; try { Invoke-RestMethod -Uri "$($env:GAI_LOCAL_MODEL_ENDPOINT)/api/tags" -TimeoutSec 5 | Out-Null; $ready = $true; break } catch {} }
            if (-not $ready) { throw 'Ollama API did not become reachable' }
          }
      - name: Verify safety and governance regression set
        shell: powershell
        run: node --test tests/approval-key.test.ts tests/approval-readiness.test.ts tests/auto-merge-policy.test.ts tests/bounded-runner.test.ts tests/autonomy-capabilities.test.ts
      - name: Mark safety gate verified for this job only
        shell: powershell
        run: '"R2_SAFETY_VERIFIED=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - name: Select candidate from TRAIN failures and evaluate HELDOUT once
        shell: powershell
        run: node scripts/gai-r2-improvement.mjs
      - name: Upload complete R2 campaign result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gai-baseline-zbook
          path: .gai-results/
          include-hidden-files: true
          retention-days: 90
