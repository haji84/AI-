name: GAI Multi-Worker Research

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gai-workers.yml'
      - 'scripts/gai-baseline.mjs'
      - 'scripts/gai-r1-evidence.ts'
      - 'scripts/gai-r1-safety-evidence.ts'
      - 'scripts/research-program-status.ts'
      - 'src/gai/research-ops-program.ts'
      - 'benchmarks/internal/v1/manifest.json'
      - 'benchmarks/internal/v1/suite.mjs'
  workflow_dispatch:
    inputs:
      mode:
        description: smoke or baseline
        required: true
        default: smoke
        type: choice
        options: [smoke, baseline]

permissions:
  contents: read

concurrency:
  group: gai-multi-worker-research
  cancel-in-progress: false

jobs:
  zbook-smoke:
    name: ZBook worker smoke
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Record ZBook runtime
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .gai-results | Out-Null
          $info = [ordered]@{
            workerId = 'zbook'
            runnerName = $env:RUNNER_NAME
            os = $env:RUNNER_OS
            arch = $env:RUNNER_ARCH
            machine = $env:COMPUTERNAME
            node = (node --version)
            timestamp = (Get-Date).ToUniversalTime().ToString('o')
            realSelfHosted = $true
          }
          $info | ConvertTo-Json | Set-Content -Encoding UTF8 .gai-results/zbook-smoke.json
          Get-Content .gai-results/zbook-smoke.json
      - name: Upload ZBook smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: gai-zbook-smoke
          path: .gai-results/zbook-smoke.json
          retention-days: 14

  macbook-smoke:
    name: MacBook worker smoke
    runs-on: [self-hosted, macbook]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Record MacBook runtime
        shell: bash
        run: |
          mkdir -p .gai-results
          node - <<'NODE' > .gai-results/macbook-smoke.json
          const os = require('node:os');
          console.log(JSON.stringify({
            workerId: 'macbook',
            runnerName: process.env.RUNNER_NAME,
            os: process.env.RUNNER_OS,
            arch: process.env.RUNNER_ARCH,
            machine: os.hostname(),
            node: process.version,
            timestamp: new Date().toISOString(),
            realSelfHosted: true
          }, null, 2));
          NODE
          cat .gai-results/macbook-smoke.json
      - name: Upload MacBook smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: gai-macbook-smoke
          path: .gai-results/macbook-smoke.json
          retention-days: 14

  baseline-zbook:
    name: Real local-model baseline on ZBook
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'baseline')
    needs: [zbook-smoke, macbook-smoke]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    env:
      GAI_WORKER_ID: zbook
      GAI_LOCAL_MODEL_ENDPOINT: http://127.0.0.1:11434
      GAI_PREFERRED_MODEL_NAME: ${{ vars.GAI_LOCAL_MODEL_NAME }}
      GAI_BOOTSTRAP_MODEL_NAME: qwen3:4b
    steps:
      - uses: actions/checkout@v5

      - name: Bootstrap zero-cost Ollama runtime if missing
        id: bootstrap
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path .gai-results | Out-Null

          function Test-OllamaApi {
            try {
              Invoke-RestMethod -Uri "$($env:GAI_LOCAL_MODEL_ENDPOINT)/api/tags" -Method Get -TimeoutSec 5 | Out-Null
              return $true
            } catch {
              return $false
            }
          }

          $status = [ordered]@{
            installedByWorkflow = $false
            installSource = 'https://ollama.com/install.ps1'
            endpoint = $env:GAI_LOCAL_MODEL_ENDPOINT
            reachableBefore = (Test-OllamaApi)
            reachableAfter = $false
            executable = $null
            bootstrapModel = $env:GAI_BOOTSTRAP_MODEL_NAME
            modelPulled = $false
            additionalApiCost = 0
            checkedAt = (Get-Date).ToUniversalTime().ToString('o')
          }

          if (-not $status.reachableBefore) {
            $ollama = Get-Command ollama -ErrorAction SilentlyContinue
            if (-not $ollama) {
              Write-Host 'Ollama not found. Installing from the official Ollama Windows PowerShell installer.'
              $installer = Invoke-RestMethod -Uri 'https://ollama.com/install.ps1' -TimeoutSec 30
              Invoke-Expression $installer
              $status.installedByWorkflow = $true
            }

            $candidatePaths = @(
              (Join-Path $env:LOCALAPPDATA 'Programs\Ollama\ollama.exe'),
              (Join-Path $env:LOCALAPPDATA 'Ollama\ollama.exe'),
              (Join-Path $env:ProgramFiles 'Ollama\ollama.exe')
            )
            $ollama = Get-Command ollama -ErrorAction SilentlyContinue
            if ($ollama) {
              $ollamaExe = $ollama.Source
            } else {
              $ollamaExe = $candidatePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
            }
            if (-not $ollamaExe) { throw 'Ollama installation completed but ollama.exe could not be located.' }
            $status.executable = $ollamaExe

            if (-not (Test-OllamaApi)) {
              Start-Process -FilePath $ollamaExe -ArgumentList 'serve' -WindowStyle Hidden
              $ready = $false
              for ($i = 0; $i -lt 30; $i++) {
                Start-Sleep -Seconds 2
                if (Test-OllamaApi) { $ready = $true; break }
              }
              if (-not $ready) { throw 'Ollama was installed but its local API did not become ready.' }
            }
          }

          $status.reachableAfter = (Test-OllamaApi)
          if (-not $status.reachableAfter) { throw 'Ollama local API is still unavailable after bootstrap.' }

          $ollama = Get-Command ollama -ErrorAction SilentlyContinue
          if ($ollama) { $ollamaExe = $ollama.Source }
          if (-not $ollamaExe) {
            $ollamaExe = @(
              (Join-Path $env:LOCALAPPDATA 'Programs\Ollama\ollama.exe'),
              (Join-Path $env:LOCALAPPDATA 'Ollama\ollama.exe'),
              (Join-Path $env:ProgramFiles 'Ollama\ollama.exe')
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $ollamaExe) { throw 'Ollama API is reachable but executable path could not be resolved.' }
          $status.executable = $ollamaExe

          $tags = Invoke-RestMethod -Uri "$($env:GAI_LOCAL_MODEL_ENDPOINT)/api/tags" -Method Get -TimeoutSec 10
          $installedModels = @($tags.models | ForEach-Object { if ($_.name) { $_.name } elseif ($_.model) { $_.model } }) | Where-Object { $_ }
          $target = $env:GAI_PREFERRED_MODEL_NAME
          if (-not $target) { $target = $env:GAI_BOOTSTRAP_MODEL_NAME }
          $hasTarget = $installedModels | Where-Object { $_ -eq $target -or $_ -like "${target}:*" } | Select-Object -First 1
          if (-not $hasTarget) {
            Write-Host "Pulling zero-cost local model $target"
            & $ollamaExe pull $target
            if ($LASTEXITCODE -ne 0) { throw "ollama pull failed for $target" }
            $status.modelPulled = $true
          }

          $status | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 .gai-results/zbook-bootstrap.json
          Get-Content .gai-results/zbook-bootstrap.json

      - name: Detect local model
        id: local_model
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tags = Invoke-RestMethod -Uri "$($env:GAI_LOCAL_MODEL_ENDPOINT)/api/tags" -Method Get -TimeoutSec 10
          $installed = @($tags.models | ForEach-Object { if ($_.name) { $_.name } elseif ($_.model) { $_.model } }) | Where-Object { $_ }
          if ($installed.Count -eq 0) { throw 'Ollama is reachable but no local models are installed.' }
          $selected = $null
          if ($env:GAI_PREFERRED_MODEL_NAME) {
            $selected = $installed | Where-Object { $_ -eq $env:GAI_PREFERRED_MODEL_NAME -or $_ -like "$($env:GAI_PREFERRED_MODEL_NAME):*" } | Select-Object -First 1
          }
          if (-not $selected) {
            $selected = $installed | Where-Object { $_ -eq $env:GAI_BOOTSTRAP_MODEL_NAME -or $_ -like "$($env:GAI_BOOTSTRAP_MODEL_NAME):*" } | Select-Object -First 1
          }
          if (-not $selected) { $selected = $installed | Select-Object -First 1 }
          "GAI_LOCAL_MODEL_NAME=$selected" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "model=$selected" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          [ordered]@{
            endpoint = $env:GAI_LOCAL_MODEL_ENDPOINT
            available = $true
            selectedModel = $selected
            installedModels = $installed
            additionalApiCost = 0
            checkedAt = (Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 .gai-results/zbook-local-model-probe.json
          Get-Content .gai-results/zbook-local-model-probe.json

      - name: Execute frozen real baseline
        shell: powershell
        run: node scripts/gai-baseline.mjs --real --resume

      - name: Derive R1 failure taxonomy and AGI-gap evidence
        shell: powershell
        run: node scripts/gai-r1-evidence.ts

      - name: Verify safety and governance regression set
        shell: powershell
        run: node --test tests/approval-key.test.ts tests/approval-readiness.test.ts tests/auto-merge-policy.test.ts tests/bounded-runner.test.ts tests/autonomy-capabilities.test.ts

      - name: Record verified R1 safety evidence
        shell: powershell
        run: node scripts/gai-r1-safety-evidence.ts

      - name: Compute R1-R20 program status
        shell: powershell
        run: node scripts/research-program-status.ts --evidence=.gai-results/research-evidence.json --require-evidence | Out-File -Encoding utf8 .gai-results/research-program-status.json

      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gai-baseline-zbook
          path: .gai-results/
          retention-days: 30
