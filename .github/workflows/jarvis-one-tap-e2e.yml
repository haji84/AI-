name: JARVIS One-Tap Enrollment E2E

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jarvis-one-tap-e2e.yml'
      - 'scripts/jarvis-broker.ts'
      - 'src/jarvis/**'
      - 'android/jarvis-worker/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-one-tap-url:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - name: Ensure resident Broker is running current main
        shell: bash
        run: |
          set -euo pipefail
          LABEL="com.aicompany.jarvis-broker"
          SERVICE="gui/$(id -u)/$LABEL"
          PID="$(launchctl print "$SERVICE" 2>/dev/null | awk '$1=="pid" && $2=="=" {print $3; exit}')"
          test -n "$PID"
          BROKER_CWD="$(lsof -a -p "$PID" -d cwd -Fn 2>/dev/null | sed -n 's/^n//p' | head -n 1)"
          test -n "$BROKER_CWD"
          test -d "$BROKER_CWD/.git"
          REMOTE="$(git -C "$BROKER_CWD" remote get-url origin)"
          case "$REMOTE" in
            *haji84/AI-* ) ;;
            * ) echo 'Resident Broker is not running from haji84/AI-' >&2; exit 1 ;;
          esac
          DIRTY="$(git -C "$BROKER_CWD" status --porcelain)"
          if [[ -n "$DIRTY" ]]; then
            echo 'Resident Broker repo has local changes; refusing to overwrite them.' >&2
            echo 'Dirty paths:' >&2
            printf '%s\n' "$DIRTY" | sed -E 's/^...//' | sed 's/ -> / -> /' >&2
            exit 1
          fi
          git -C "$BROKER_CWD" fetch origin main
          git -C "$BROKER_CWD" merge --ff-only origin/main
          launchctl kickstart -k "$SERVICE"
          for _ in $(seq 1 30); do
            HEALTH="$(curl -fsS --max-time 2 http://127.0.0.1:8787/health 2>/dev/null || true)"
            if printf '%s' "$HEALTH" | grep -Fq '"service":"jarvis-broker"'; then
              echo 'Resident Broker: current main and healthy'
              exit 0
            fi
            sleep 1
          done
          echo 'Resident Broker did not become healthy after sync' >&2
          exit 1

      - name: Issue and open a real one-tap enrollment URL
        shell: bash
        run: |
          set -euo pipefail
          STATE_ROOT="$HOME/Library/Application Support/JARVIS"
          ENV_FILE="$STATE_ROOT/jarvis.env"
          test -s "$ENV_FILE"
          set -a
          source "$ENV_FILE"
          set +a

          test -n "${JARVIS_OWNER_TOKEN:-}"
          test -n "${JARVIS_PUBLIC_BROKER_URL:-}"

          case "$JARVIS_PUBLIC_BROKER_URL" in
            https://*) echo 'Broker URL mode: public HTTPS' ;;
            http://192.168.*|http://10.*|http://172.*) echo 'Broker URL mode: private LAN HTTP' ;;
            *) echo 'Broker URL mode is not usable by Android Worker' >&2; exit 1 ;;
          esac

          RESPONSE="$(curl -fsS --max-time 10 \
            -H "Authorization: Bearer $JARVIS_OWNER_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"mode":"fleet","maxDevices":100,"ttlMs":3600000,"group":"default"}' \
            http://127.0.0.1:8787/api/jarvis/admin/enrollment)"

          KEYS="$(printf '%s' "$RESPONSE" | python3 -c 'import json,sys; print(",".join(sorted(json.load(sys.stdin).keys())))')"
          echo "Enrollment response keys: $KEYS"
          ONE_TAP_URL="$(printf '%s' "$RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("oneTapUrl", ""))')"
          test -n "$ONE_TAP_URL"
          echo "::add-mask::$ONE_TAP_URL"

          case "$ONE_TAP_URL" in
            https://*|http://192.168.*|http://10.*|http://172.*) ;;
            *) echo 'Issued oneTapUrl is not reachable by Android Worker policy' >&2; exit 1 ;;
          esac

          PAGE_FILE="$RUNNER_TEMP/jarvis-one-tap-page.html"
          curl -fsS --max-time 15 "$ONE_TAP_URL" -o "$PAGE_FILE"
          test -s "$PAGE_FILE"
          grep -Fq 'JARVISに登録中' "$PAGE_FILE"
          grep -Fq 'jarvis://enroll?broker=' "$PAGE_FILE"
          grep -Fq '&grant=' "$PAGE_FILE"
          if grep -Fq '&token=' "$PAGE_FILE"; then
            echo 'Raw enrollment token leaked into one-tap page' >&2
            exit 1
          fi

          URL_FILE="$RUNNER_TEMP/jarvis-one-tap-url.txt"
          printf '%s\n' "$ONE_TAP_URL" > "$URL_FILE"
          chmod 600 "$URL_FILE"
          echo "ONE_TAP_URL_FILE=$URL_FILE" >> "$GITHUB_ENV"
          echo 'JARVIS one-tap URL: live enrollment page opened successfully'

      - name: Check whether a physical Android is attached for true tap verification
        shell: bash
        run: |
          set -euo pipefail
          if command -v adb >/dev/null 2>&1 && adb devices | awk 'NR>1 && $2=="device" {found=1} END{exit found?0:1}'; then
            echo 'PHYSICAL_ANDROID_ATTACHED=true' >> "$GITHUB_ENV"
            echo 'Physical Android detected by ADB'
          else
            echo 'PHYSICAL_ANDROID_ATTACHED=false' >> "$GITHUB_ENV"
            echo 'No physical Android attached; live URL opening is verified, but the final physical tap must be performed on the target Android.'
          fi

      - name: Save current live registration URL privately as an Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-live-one-tap-url
          path: ${{ env.ONE_TAP_URL_FILE }}
          if-no-files-found: error
          retention-days: 1
