name: Scoped Production Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: vercel-scoped-production
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.scope.outputs.authorized }}
      issue_number: ${{ steps.scope.outputs.issue_number }}
      pr_number: ${{ steps.scope.outputs.pr_number }}
      deploy_sha: ${{ steps.scope.outputs.deploy_sha }}
    steps:
      - name: Verify exact task-scoped completion authorization
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          import { appendFile } from "node:fs/promises";

          const token = process.env.GH_TOKEN;
          const repository = process.env.REPOSITORY;
          const owner = process.env.REPOSITORY_OWNER;
          const sha = process.env.DEPLOY_SHA;
          const output = process.env.GITHUB_OUTPUT;
          if (!token || !repository || !owner || !sha || !output) throw new Error("authorization context is incomplete");

          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28",
          };

          async function get(path) {
            const response = await fetch(`https://api.github.com/repos/${repository}${path}`, { headers });
            const body = await response.json().catch(() => null);
            if (!response.ok) throw new Error(`GitHub authorization lookup failed (${response.status})`);
            return body;
          }

          async function finish(values) {
            await appendFile(output, Object.entries(values).map(([key, value]) => `${key}=${value}\n`).join(""));
          }

          const pulls = await get(`/commits/${encodeURIComponent(sha)}/pulls`);
          const pr = Array.isArray(pulls)
            ? pulls.find((candidate) => candidate?.merged_at && candidate?.base?.ref === "main" && candidate?.merge_commit_sha === sha)
            : null;
          if (!pr) {
            console.log("No merged PR is bound to this successful main CI commit. Production remains blocked.");
            await finish({ authorized: "false", issue_number: "", pr_number: "", deploy_sha: sha });
            process.exit(0);
          }

          const body = typeof pr.body === "string" ? pr.body : "";
          const scopeMatch = body.match(/<!--\s*ai-company-task-scope:\s*issue:(\d+)\s*-->/i);
          const approved = /<!--\s*ai-company-production-deploy:\s*approved\s*-->/i.test(body);
          const expiryMatch = body.match(/<!--\s*ai-company-task-authorization-expires-at:\s*([^>]+?)\s*-->/i);
          if (!scopeMatch || !approved || !expiryMatch) {
            console.log("PR has no complete task-scoped completion authorization metadata. Production remains blocked.");
            await finish({ authorized: "false", issue_number: "", pr_number: String(pr.number ?? ""), deploy_sha: sha });
            process.exit(0);
          }

          const issueNumber = Number(scopeMatch[1]);
          const expiresAt = Date.parse(expiryMatch[1].trim());
          if (!Number.isInteger(issueNumber) || issueNumber < 1 || !Number.isFinite(expiresAt) || expiresAt <= Date.now()) {
            console.log("Task-scoped completion authorization is invalid or expired. Production remains blocked.");
            await finish({ authorized: "false", issue_number: String(issueNumber || ""), pr_number: String(pr.number ?? ""), deploy_sha: sha });
            process.exit(0);
          }

          const issue = await get(`/issues/${issueNumber}`);
          const issueBody = typeof issue?.body === "string" ? issue.body : "";
          const ownerCommandMatch = issueBody.match(/## Owner command\s*\n([\s\S]*?)(?:\n\n##|\n## Execution contract|$)/i);
          const ownerCommand = ownerCommandMatch?.[1]?.trim() || "";
          const completionInstruction = /(最後まで.{0,12}(進め|やって|任せ)|完了まで.{0,12}(進め|やって|任せ)|完成.{0,12}(させ|まで|して|させて)|全部.{0,12}(進め|やって|任せ)|任せる|finish\s+(it|this|the\s+task)|take\s+it\s+to\s+completion|handle.{0,20}(through|to)\s+(the\s+)?end)/iu.test(ownerCommand);
          const persistedApproval = /production-deploy-authorized:\s*true/i.test(issueBody);
          const ownerIssued = issue?.user?.login === owner;

          if (!ownerIssued || !persistedApproval || !completionInstruction) {
            console.log("Issue does not prove an owner completion instruction for this task. Production remains blocked.");
            await finish({ authorized: "false", issue_number: String(issueNumber), pr_number: String(pr.number ?? ""), deploy_sha: sha });
            process.exit(0);
          }

          console.log(`Completion authorization verified for issue #${issueNumber}, PR #${pr.number}, commit ${sha}.`);
          await finish({
            authorized: "true",
            issue_number: String(issueNumber),
            pr_number: String(pr.number),
            deploy_sha: sha,
          });
          NODE

  deploy:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      PROJECT_NAME: unified-ai-creator-studio
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      AI_COMPANY_OWNER_SECRET: ${{ secrets.AI_COMPANY_OWNER_SECRET }}
      AI_COMPANY_GITHUB_TOKEN: ${{ secrets.AI_COMPANY_GITHUB_TOKEN }}
    steps:
      - name: Checkout exact authorized merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.deploy_sha }}

      - name: Verify required secrets are configured
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in VERCEL_TOKEN AI_COMPANY_OWNER_SECRET AI_COMPANY_GITHUB_TOKEN; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required secret: ${key}" >&2
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
          echo "Required secrets are configured. Values were not printed."

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure Vercel project and bootstrap bounded runtime management
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import { mkdir, writeFile } from "node:fs/promises";

          const token = process.env.VERCEL_TOKEN;
          const projectName = process.env.PROJECT_NAME;
          const ownerSecret = process.env.AI_COMPANY_OWNER_SECRET;
          const githubToken = process.env.AI_COMPANY_GITHUB_TOKEN;
          const headers = { Authorization: `Bearer ${token}`, "Content-Type": "application/json" };

          async function request(url, init = {}) {
            const response = await fetch(url, { ...init, headers: { ...headers, ...(init.headers ?? {}) } });
            const text = await response.text();
            let body = null;
            if (text) {
              try { body = JSON.parse(text); } catch { body = { message: text }; }
            }
            return { response, body };
          }

          const projectResult = await request(`https://api.vercel.com/v9/projects/${encodeURIComponent(projectName)}`);
          const project = projectResult.body;
          if (!projectResult.response.ok || !project?.id || !project?.accountId) {
            throw new Error(`Unable to resolve existing Vercel project (status ${projectResult.response.status}).`);
          }

          const existingResult = await request(`https://api.vercel.com/v10/projects/${encodeURIComponent(project.id)}/env`);
          const existingEnvs = existingResult.response.ok && Array.isArray(existingResult.body?.envs) ? existingResult.body.envs : [];
          const existingKeys = new Set(existingEnvs.map((item) => item?.key).filter(Boolean));

          const envPayload = [
            {
              key: "AI_COMPANY_GITHUB_REPOSITORY",
              value: "haji84/AI-",
              type: "plain",
              target: ["production"],
              comment: "AI Company repository target",
            },
            {
              key: "AI_COMPANY_VERCEL_TOKEN",
              value: token,
              type: "sensitive",
              target: ["production"],
              comment: "Bounded AI Company Vercel management credential",
            },
            {
              key: "AI_COMPANY_VERCEL_PROJECT_ID",
              value: project.id,
              type: "plain",
              target: ["production"],
              comment: "Fixed Vercel project scope for AI Company management",
            },
            {
              key: "AI_COMPANY_VERCEL_ACCOUNT_ID",
              value: project.accountId,
              type: "plain",
              target: ["production"],
              comment: "Fixed Vercel account scope for AI Company management",
            },
          ];

          if (!existingKeys.has("AI_COMPANY_OWNER_SECRET")) {
            envPayload.push({
              key: "AI_COMPANY_OWNER_SECRET",
              value: ownerSecret,
              type: "sensitive",
              target: ["production"],
              comment: "AI Company owner login secret bootstrap",
            });
          }
          if (!existingKeys.has("AI_COMPANY_GITHUB_TOKEN")) {
            envPayload.push({
              key: "AI_COMPANY_GITHUB_TOKEN",
              value: githubToken,
              type: "sensitive",
              target: ["production"],
              comment: "AI Company GitHub runtime token bootstrap",
            });
          }

          const envResult = await request(`https://api.vercel.com/v10/projects/${encodeURIComponent(project.id)}/env?upsert=true`, {
            method: "POST",
            body: JSON.stringify(envPayload),
          });
          if (!envResult.response.ok) {
            throw new Error(`Unable to sync bounded Vercel environment variables (status ${envResult.response.status}).`);
          }

          await mkdir(".vercel", { recursive: true });
          await writeFile(
            ".vercel/project.json",
            JSON.stringify({ projectId: project.id, orgId: project.accountId }) + "\n",
            { mode: 0o600 },
          );
          console.log(`Vercel project ready: ${projectName}. Existing owner/GitHub runtime secrets were preserved.`);
          NODE

      - name: Pull Production configuration
        run: pnpm dlx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build exact authorized commit
        run: pnpm dlx vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy exact authorized commit to Production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(pnpm dlx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "## Task-scoped Production deployment"
            echo ""
            echo "- Issue: #${{ needs.authorize.outputs.issue_number }}"
            echo "- PR: #${{ needs.authorize.outputs.pr_number }}"
            echo "- Commit: ${{ needs.authorize.outputs.deploy_sha }}"
            echo "- URL: $url"
            echo "- Authorization: owner completion instruction for this exact task"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify deployed Production responds
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 "$DEPLOYMENT_URL" >/dev/null
          echo "Production deployment responded successfully."
