name: Issue 899 SEC-001 ledger artifact

on:
  push:
    branches:
      - feature/899-sec001-ledger-apply
    paths:
      - .github/workflows/899-sec001-ledger-artifact.yml

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate bounded SEC-001 reconciliation
        run: node scripts/reconcile-issue-899-sec001.mjs
      - name: Validate canonical mirrors
        run: node scripts/validate-jarvis-requirements.mjs
      - name: Check whitespace
        run: git diff --check
      - name: Upload generated canonical files
        uses: actions/upload-artifact@v4
        with:
          name: issue-899-sec001-ledgers
          path: |
            docs/JARVIS_PRODUCT_SPEC.md
            docs/jarvis-requirements.json
          if-no-files-found: error
