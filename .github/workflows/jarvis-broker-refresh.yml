            console.log('GOOGLE_OWNER_ISSUE_STATUS=' + issued.status);
            if (issued.status !== 200 || !issued.payload.contextId) process.exit(3);
            const consumed = await request({ action: 'consumeContext', ...common, contextId: issued.payload.contextId });
