name: JARVIS Broker Refresh

on:
  workflow_dispatch:
    inputs:
      owner_1218_head:
        description: 'Deploy reviewed Google Owner Broker head for Issue 1218'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: jarvis-broker-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - name: Sync resident repository without touching tunnel
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          SERVICE="gui/$(id -u)/com.aicompany.jarvis-broker"
          PID="$(launchctl print "$SERVICE" 2>/dev/null | awk '$1=="pid" && $2=="=" {print $3; exit}')"
          test -n "$PID"
          REPO_ROOT="$(lsof -a -p "$PID" -d cwd -Fn 2>/dev/null | sed -n 's/^n//p' | head -n 1)"
          test -d "$REPO_ROOT/.git"
          DIRTY="$(git -C "$REPO_ROOT" status --porcelain)"
          BLOCKING="$(printf '%s\n' "$DIRTY" | grep -vE '^\?\? \.jarvis/$' || true)"
          if [[ -n "$BLOCKING" ]]; then
            echo 'Resident repo has local source changes; refusing overwrite.' >&2
            printf '%s\n' "$BLOCKING" >&2
            exit 1
          fi
          if [[ "${{ inputs.owner_1218_head }}" == 'true' ]]; then
            [[ "$GITHUB_REF" == 'refs/heads/goriq/1218-iphone-owner' ]] || exit 2
            TARGET='7118ddae0e0d814d3e9bff5e39aacb0296e4b096'
            git -C "$REPO_ROOT" fetch origin goriq/1218-iphone-owner
            git -C "$REPO_ROOT" merge-base --is-ancestor "$TARGET" FETCH_HEAD || exit 3
            git -C "$REPO_ROOT" merge --ff-only "$TARGET"
          else
            git -C "$REPO_ROOT" fetch origin main
            git -C "$REPO_ROOT" merge --ff-only origin/main
          fi
          echo "repo_root=$REPO_ROOT" >> "$GITHUB_OUTPUT"

      - name: Capture public Broker URL before refresh
        id: before
        shell: bash
        run: |
          set -euo pipefail
          ENV_FILE="$HOME/Library/Application Support/JARVIS/jarvis.env"
          test -s "$ENV_FILE"
          set -a; source "$ENV_FILE"; set +a
          : "${JARVIS_PUBLIC_BROKER_URL:?missing public Broker URL}"
          echo "::add-mask::$JARVIS_PUBLIC_BROKER_URL"
          printf '%s\n' "$JARVIS_PUBLIC_BROKER_URL" > /tmp/jarvis-broker-url-before

      - name: Restart Broker only
        shell: bash
        run: |
          set -euo pipefail
          BROKER="gui/$(id -u)/com.aicompany.jarvis-broker"
          TUNNEL="gui/$(id -u)/com.aicompany.jarvis-broker-tunnel"
          BEFORE_TUNNEL_PID="$(launchctl print "$TUNNEL" 2>/dev/null | awk '$1=="pid" && $2=="=" {print $3; exit}')"
          test -n "$BEFORE_TUNNEL_PID"
          launchctl kickstart -k "$BROKER"
          for _ in $(seq 1 30); do
            curl -fsS --max-time 2 http://127.0.0.1:8787/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS --max-time 3 http://127.0.0.1:8787/health | grep -Fq 'jarvis-broker'
          AFTER_TUNNEL_PID="$(launchctl print "$TUNNEL" 2>/dev/null | awk '$1=="pid" && $2=="=" {print $3; exit}')"
          [[ "$AFTER_TUNNEL_PID" == "$BEFORE_TUNNEL_PID" ]] || {
            echo 'Broker tunnel process changed during Broker-only refresh.' >&2
            exit 2
          }

      - name: Verify public Broker URL is unchanged and healthy
        shell: bash
        run: |
          set -euo pipefail
          ENV_FILE="$HOME/Library/Application Support/JARVIS/jarvis.env"
          set -a; source "$ENV_FILE"; set +a
          BEFORE="$(cat /tmp/jarvis-broker-url-before)"
          [[ "$JARVIS_PUBLIC_BROKER_URL" == "$BEFORE" ]] || {
            echo 'Public Broker URL changed unexpectedly.' >&2
            exit 3
          }
          echo "::add-mask::$JARVIS_PUBLIC_BROKER_URL"
          curl -fsS --max-time 10 "$JARVIS_PUBLIC_BROKER_URL/health" | grep -Fq 'jarvis-broker'
          echo 'BROKER_REFRESH_PRESERVED_TUNNEL_URL'

      - name: Check Google Owner state boundary without binding an identity
        if: inputs.owner_1218_head == true
        shell: bash
        run: |
          set -euo pipefail
          ENV_FILE="$HOME/Library/Application Support/JARVIS/jarvis.env"
          set -a; source "$ENV_FILE"; set +a
          node <<'NODE'
          const base = process.env.JARVIS_PUBLIC_BROKER_URL;
          const token = process.env.JARVIS_OWNER_TOKEN;
          if (!base || !token) { console.log('GOOGLE_OWNER_SMOKE_AUTH_UNAVAILABLE'); process.exit(2); }
          async function request(body) {
            const response = await fetch(new URL('/api/jarvis/admin/google-owner', base), {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
              signal: AbortSignal.timeout(5000),
            });
            const payload = response.ok ? await response.json() : {};
            return { status: response.status, payload };
          }
          try {
            const common = { deviceId: 'diagnostic_1234567890123456', publicKeyThumbprint: 'thumb', state: 'state', nonce: 'nonce' };
            const issued = await request({ action: 'issueContext', ...common, pkceChallenge: 'pkce' });
            console.log('GOOGLE_OWNER_ISSUE_STATUS=' + issued.status);
            if (issued.status !== 200 || !issued.payload.contextId) process.exit(3);
            const consumed = await request({ action: 'consumeContext', ...common, contextId: issued.payload.contextId });
            console.log('GOOGLE_OWNER_CONSUME_STATUS=' + consumed.status);
            const replay = await request({ action: 'consumeContext', ...common, contextId: issued.payload.contextId });
            console.log('GOOGLE_OWNER_REPLAY_STATUS=' + replay.status);
            if (consumed.status !== 200 || replay.status !== 409) process.exit(4);
          } catch {
            console.log('GOOGLE_OWNER_SMOKE_TRANSPORT_FAILED');
            process.exit(5);
          }
          NODE

      - name: Transit current public Broker endpoint for production repair
        if: always() && inputs.owner_1218_head == true
        shell: bash
        run: |
          set -euo pipefail
          ENV_FILE="$HOME/Library/Application Support/JARVIS/jarvis.env"
          set -a; source "$ENV_FILE"; set +a
          : "${JARVIS_PUBLIC_BROKER_URL:?missing public Broker URL}"
          echo "::add-mask::$JARVIS_PUBLIC_BROKER_URL"
          cat > "$RUNNER_TEMP/owner-broker-transit.pem" <<'PUBKEY'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAuZ/owf/oNfw32sZ7PfW+
          STNGrHrnzQ0eL7c3PMhpiVeBWU6TaLub+0amIQuEgp2NcrUbzYlG9foH3pq8xc0a
          EHw4gvnS2SMP19MvOVK7Y3i9svbPWIqfKLRCKDfTaOXrxK2Ml3bp/JwCadYmN/JG
          hsIOojZm2uwdSJpXkf45McZrY919UM+8ZMD1lIRXy+tgN1jBf4c4et/9MiaKveVI
          qBf9oZNs2y/+n5oY5Y3jfWvPLRL+SL6acSYEIUUft28+KlSQ6Ir3xoD7jtmddhlQ
          bt78Bv2vs0z/DyjKDUOjWzlA/wIbrKWvgZmX/DWk65y2xwdYfHadJoeGzbfTTFEY
          wwIDAQAB
          -----END PUBLIC KEY-----
          PUBKEY
          CIPHERTEXT="$(printf '%s' "$JARVIS_PUBLIC_BROKER_URL" | openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/owner-broker-transit.pem" -pkeyopt rsa_padding_mode:oaep | base64 | tr -d '\n')"
          rm -f "$RUNNER_TEMP/owner-broker-transit.pem"
          echo "BROKER_URL_CIPHERTEXT=$CIPHERTEXT"
