name: GAI Research Evidence Ledger

on:
  workflow_run:
    workflows: ["GAI Multi-Worker Research", "GAI R1 Evidence Rerun", "GAI R6 Benchmark v1.1", "GAI R4 Endurance", "GAI R7 Repeatability", "GAI R8 Memory Transfer", "GAI R9 Calibration", "GAI R10 Router Governance", "GAI R11 Recovery", "GAI R13 Cross Device", "GAI R14 Continual Learning"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: gai-research-evidence-ledger
  cancel-in-progress: false

jobs:
  persist-zbook-evidence:
    name: Persist verified research evidence
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download completed baseline evidence
        uses: actions/download-artifact@v4
        with:
          name: gai-baseline-zbook
          path: .gai-results
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Merge evidence into persistent ledger
        shell: powershell
        run: node scripts/research-evidence-sync.ts --source=.gai-results/research-evidence.json
      - name: Upload ledger status snapshot
        uses: actions/upload-artifact@v4
        with:
          name: gai-research-ledger-status
          path: .gai-results/research-ledger-status.json
          retention-days: 90
