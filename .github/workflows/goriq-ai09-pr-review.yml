name: GORIQ AI-09 Advisory PR Review

# Deploy only from reviewed default-branch source. Do not execute PR code.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions: {}

concurrency:
  group: goriq-ai09-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  preflight:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      eligible: ${{ steps.scope.outputs.eligible }}
      repository: ${{ steps.scope.outputs.repository }}
      pr_number: ${{ steps.scope.outputs.pr_number }}
      base_sha: ${{ steps.scope.outputs.base_sha }}
      head_sha: ${{ steps.scope.outputs.head_sha }}
      trusted_sha: ${{ steps.scope.outputs.trusted_sha }}
      ci_run_id: ${{ steps.scope.outputs.ci_run_id }}
      ci_conclusion: ${{ steps.scope.outputs.ci_conclusion }}
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Validate exact CI and PR provenance
        id: scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/goriq-ai09-preflight.mjs

  review:
    needs: [preflight]
    if: needs.preflight.outputs.eligible == 'true'
    # MacBook/ZBook are intentionally out of scope: only ephemeral GitHub-hosted CPU.
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: read
      pull-requests: read
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 5m
    steps:
      - name: Checkout pinned trusted main code, never PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.trusted_sha }}
          persist-credentials: false
          clean: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Verify trusted source and GitHub-hosted Linux
        shell: bash
        env:
          TRUSTED_SHA: ${{ needs.preflight.outputs.trusted_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRUSTED_SHA"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
      - name: Install SHA256-pinned Ollama Linux binary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 --max-time 300 \
            https://github.com/ollama/ollama/releases/download/v0.34.0/ollama-linux-amd64.tar.zst \
            -o "$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          echo "cf95886728959aa09910bb34de5cca1cc5a8f68003b5597197d3f2c2d57c0804  $RUNNER_TEMP/ollama-linux-amd64.tar.zst" | sha256sum -c -
          sudo tar --zstd -xf "$RUNNER_TEMP/ollama-linux-amd64.tar.zst" -C /usr
          ollama --version
      - name: Start loopback Ollama with bounded one-model quota
        shell: bash
        run: |
          set -euo pipefail
          OLLAMA_HOST=127.0.0.1:11434 ollama serve >"$RUNNER_TEMP/ai09-ollama.log" 2>&1 &
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = "1"
          timeout 480s ollama pull qwen2.5-coder:3b
      - name: Read GitHub diff and review with isolated local AI-09
        shell: bash
        env:
          GORIQ_AI09_REPOSITORY: ${{ needs.preflight.outputs.repository }}
          GORIQ_AI09_PR_NUMBER: ${{ needs.preflight.outputs.pr_number }}
          GORIQ_AI09_HEAD: ${{ needs.preflight.outputs.head_sha }}
          GORIQ_AI09_BASE: ${{ needs.preflight.outputs.base_sha }}
          GORIQ_AI09_TRUSTED_SHA: ${{ needs.preflight.outputs.trusted_sha }}
          GORIQ_AI09_CI_RUN_ID: ${{ needs.preflight.outputs.ci_run_id }}
          GORIQ_AI09_CI_CONCLUSION: ${{ needs.preflight.outputs.ci_conclusion }}
          GORIQ_AI09_REPORT_FILE: ${{ runner.temp }}/goriq-ai09-report.json
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/goriq-ai09-ci-review.mjs
      - name: Upload bounded advisory JSON, not code or credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goriq-ai09-advisory
          path: ${{ runner.temp }}/goriq-ai09-report.json
          if-no-files-found: warn
          retention-days: 3

  comment:
    needs: [preflight, review]
    if: needs.preflight.outputs.eligible == 'true' && needs.review.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    # Only this GitHub-hosted job can WRITE, and only to Issue/PR comments.
    permissions:
      contents: read
      pull-requests: read
      actions: read
      issues: write
    steps:
      - name: Checkout pinned trusted reviewer code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.trusted_sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Download bounded advisory receipt only
        uses: actions/download-artifact@v4
        with:
          name: goriq-ai09-advisory
          path: ${{ runner.temp }}/goriq-ai09
      - name: Revalidate current PR, patch and SHA then post advisory comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORIQ_AI09_REPOSITORY: ${{ needs.preflight.outputs.repository }}
          GORIQ_AI09_PR_NUMBER: ${{ needs.preflight.outputs.pr_number }}
          GORIQ_AI09_HEAD: ${{ needs.preflight.outputs.head_sha }}
          GORIQ_AI09_BASE: ${{ needs.preflight.outputs.base_sha }}
          GORIQ_AI09_TRUSTED_SHA: ${{ needs.preflight.outputs.trusted_sha }}
          GORIQ_AI09_CI_RUN_ID: ${{ needs.preflight.outputs.ci_run_id }}
          GORIQ_AI09_RECEIPT_PATH: ${{ runner.temp }}/goriq-ai09/goriq-ai09-report.json
        run: node scripts/goriq-ai09-post-review.mjs
