name: JARVIS Direct Commander

on:
  push:
    branches: [main]
    paths:
      - 'scripts/jarvis-direct-commander.ts'
      - 'scripts/jarvis-direct-commander-service.sh'
      - 'scripts/jarvis-direct-commander-tunnel-service.sh'
      - '.github/workflows/jarvis-direct-commander.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - name: Sync resident JARVIS repository
        id: resident
        shell: bash
        run: |
          set -euo pipefail
          SERVICE="gui/$(id -u)/com.aicompany.jarvis-broker"
          PID="$(launchctl print "$SERVICE" 2>/dev/null | awk '$1=="pid" && $2=="=" {print $3; exit}')"
          test -n "$PID"
          REPO_ROOT="$(lsof -a -p "$PID" -d cwd -Fn 2>/dev/null | sed -n 's/^n//p' | head -n 1)"
          test -d "$REPO_ROOT/.git"
          chmod -x "$REPO_ROOT/scripts/jarvis-direct-commander-service.sh" "$REPO_ROOT/scripts/jarvis-direct-commander-tunnel-service.sh" 2>/dev/null || true
          DIRTY="$(git -C "$REPO_ROOT" status --porcelain)"
          BLOCKING="$(printf '%s\n' "$DIRTY" | grep -vE '^\?\? \.jarvis/$' || true)"
          if [[ -n "$BLOCKING" ]]; then
            echo 'Resident repo has local source changes; refusing overwrite.' >&2
            printf '%s\n' "$BLOCKING" >&2
            exit 1
          fi
          git -C "$REPO_ROOT" fetch origin main
          git -C "$REPO_ROOT" merge --ff-only origin/main
          echo "repo_root=$REPO_ROOT" >> "$GITHUB_OUTPUT"

      - name: Install persistent LAN Commander
        id: install
        shell: bash
        env:
          REPO_ROOT: ${{ steps.resident.outputs.repo_root }}
        run: |
          set -euo pipefail
          STATE_ROOT="$HOME/Library/Application Support/JARVIS"
          ENV_FILE="$STATE_ROOT/jarvis.env"
          AGENTS="$HOME/Library/LaunchAgents"
          mkdir -p "$STATE_ROOT" "$AGENTS"
          test -s "$ENV_FILE"

          if ! grep -q '^JARVIS_COMMANDER_KEY=' "$ENV_FILE"; then
            KEY="$(openssl rand -hex 24)"
            printf '\nJARVIS_COMMANDER_KEY=%q\n' "$KEY" >> "$ENV_FILE"
            chmod 600 "$ENV_FILE"
          fi

          cat >"$AGENTS/com.aicompany.jarvis-commander.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>Label</key><string>com.aicompany.jarvis-commander</string>
          <key>ProgramArguments</key><array><string>/bin/bash</string><string>$REPO_ROOT/scripts/jarvis-direct-commander-service.sh</string></array>
          <key>WorkingDirectory</key><string>$REPO_ROOT</string>
          <key>RunAtLoad</key><true/>
          <key>KeepAlive</key><true/>
          <key>StandardOutPath</key><string>$STATE_ROOT/commander.out.log</string>
          <key>StandardErrorPath</key><string>$STATE_ROOT/commander.err.log</string>
          </dict></plist>
          PLIST

          LABEL=com.aicompany.jarvis-commander
          PLIST="$AGENTS/$LABEL.plist"
          launchctl bootout "gui/$(id -u)" "$PLIST" >/dev/null 2>&1 || true
          launchctl bootstrap "gui/$(id -u)" "$PLIST"
          launchctl kickstart -k "gui/$(id -u)/$LABEL"

          for _ in $(seq 1 30); do
            curl -fsS --max-time 2 http://127.0.0.1:8790/health >/dev/null 2>&1 && break
            sleep 1
          done
          HEALTH="$(curl -fsS --max-time 2 http://127.0.0.1:8790/health)"
          printf '%s' "$HEALTH" | grep -Fq 'jarvis-direct-commander'
          printf '%s' "$HEALTH" | grep -Fq '"host":"0.0.0.0"'
          LISTENER="$(lsof -nP -iTCP:8790 -sTCP:LISTEN)"
          printf '%s\n' "$LISTENER" | grep -Eq '(\*:8790|0\.0\.0\.0:8790)'

          DEFAULT_IF="$(route get default 2>/dev/null | awk '/interface:/{print $2; exit}')"
          LAN_IP=""
          if [[ -n "$DEFAULT_IF" ]]; then LAN_IP="$(ipconfig getifaddr "$DEFAULT_IF" 2>/dev/null || true)"; fi
          if [[ -z "$LAN_IP" ]]; then LAN_IP="$(ipconfig getifaddr en0 2>/dev/null || true)"; fi
          if [[ -z "$LAN_IP" ]]; then LAN_IP="$(ipconfig getifaddr en1 2>/dev/null || true)"; fi
          [[ -n "$LAN_IP" ]] || { echo 'Could not determine MacBook LAN IPv4 address.' >&2; exit 5; }

          set -a; source "$ENV_FILE"; set +a
          : "${JARVIS_COMMANDER_KEY:?missing commander key}"
          LAN_URL="http://$LAN_IP:8790/c/$JARVIS_COMMANDER_KEY"
          LOCAL_URL="http://127.0.0.1:8790/c/$JARVIS_COMMANDER_KEY"
          echo "::add-mask::$JARVIS_COMMANDER_KEY"
          echo "::add-mask::$LAN_URL"
          echo "::add-mask::$LOCAL_URL"
          printf '%s\n' "$LAN_URL" > "$STATE_ROOT/commander-lan-url.txt"
          chmod 600 "$STATE_ROOT/commander-lan-url.txt"
          curl -fsS --max-time 5 "$LOCAL_URL" | grep -Fq 'JARVIS Commander'
          printf '%s' "$LAN_URL" | pbcopy || true
          open "$LOCAL_URL" || true
          echo "lan_ip=$LAN_IP" >> "$GITHUB_OUTPUT"
          echo 'LAN Commander is bound on all interfaces. Secure LAN URL copied to MacBook clipboard.'

      - name: Start optional Internet tunnel
        shell: bash
        continue-on-error: true
        env:
          REPO_ROOT: ${{ steps.resident.outputs.repo_root }}
        run: |
          set -euo pipefail
          STATE_ROOT="$HOME/Library/Application Support/JARVIS"
          ENV_FILE="$STATE_ROOT/jarvis.env"
          AGENTS="$HOME/Library/LaunchAgents"
          LABEL=com.aicompany.jarvis-commander-tunnel
          PLIST="$AGENTS/$LABEL.plist"
          cat >"$PLIST" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>Label</key><string>$LABEL</string>
          <key>ProgramArguments</key><array><string>/bin/bash</string><string>$REPO_ROOT/scripts/jarvis-direct-commander-tunnel-service.sh</string></array>
          <key>WorkingDirectory</key><string>$REPO_ROOT</string>
          <key>RunAtLoad</key><true/>
          <key>KeepAlive</key><true/>
          <key>StandardOutPath</key><string>$STATE_ROOT/commander-tunnel-launch.out.log</string>
          <key>StandardErrorPath</key><string>$STATE_ROOT/commander-tunnel-launch.err.log</string>
          </dict></plist>
          PLIST
          launchctl bootout "gui/$(id -u)" "$PLIST" >/dev/null 2>&1 || true
          launchctl bootstrap "gui/$(id -u)" "$PLIST"
          launchctl kickstart -k "gui/$(id -u)/$LABEL"

          TUNNEL_LOG="$STATE_ROOT/commander-tunnel.log"
          PUBLIC=""
          for _ in $(seq 1 30); do
            PUBLIC="$(grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' "$TUNNEL_LOG" 2>/dev/null | tail -n 1 || true)"
            [[ -n "$PUBLIC" ]] && break
            sleep 1
          done
          [[ -n "$PUBLIC" ]] || exit 0
          set -a; source "$ENV_FILE"; set +a
          REMOTE="$PUBLIC/c/$JARVIS_COMMANDER_KEY"
          echo "::add-mask::$JARVIS_COMMANDER_KEY"
          echo "::add-mask::$REMOTE"
          printf '%s\n' "$REMOTE" > "$STATE_ROOT/commander-url.txt"
          chmod 600 "$STATE_ROOT/commander-url.txt"
          for _ in $(seq 1 15); do
            curl -fsS --max-time 8 "$REMOTE" 2>/dev/null | grep -Fq 'JARVIS Commander' && exit 0
            sleep 2
          done
          exit 0

      - name: Verify registered Android fleet is visible
        shell: bash
        run: |
          set -euo pipefail
          STATE_ROOT="$HOME/Library/Application Support/JARVIS"
          ENV_FILE="$STATE_ROOT/jarvis.env"
          set -a; source "$ENV_FILE"; set +a
          STATE="$(curl -fsS --max-time 10 -H "Authorization: Bearer $JARVIS_OWNER_TOKEN" http://127.0.0.1:8787/api/jarvis/admin/state)"
          python3 - "$STATE" <<'PY'
          import json, sys
          state=json.loads(sys.argv[1])
          fleet=state.get('fleet', [])
          if not fleet:
              raise SystemExit('No registered Android fleet visible to Commander')
          print(f'Registered Android devices visible: {len(fleet)}')
          for node in fleet[:5]:
              print(f"- {node.get('label', node.get('id'))}: {node.get('status')}")
          PY
