name: Issue 725 Fleet Ledger Reconcile

on:
  push:
    branches:
      - feature/725-fleet-ledger-reconcile

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile FLEET-010 and FLEET-011
        run: node scripts/reconcile-issue-725-fleet.mjs
      - name: Validate canonical ledgers
        run: node scripts/validate-jarvis-requirements.mjs
      - name: Inspect diff
        run: |
          git diff --check
          git diff -- docs/jarvis-requirements.json docs/JARVIS_PRODUCT_SPEC.md docs/evidence/725-fleet-capacity.md
      - name: Commit generated reconciliation and remove temporary automation
        run: |
          rm scripts/reconcile-issue-725-fleet.mjs .github/workflows/issue-725-reconcile.yml
          git add docs/jarvis-requirements.json docs/JARVIS_PRODUCT_SPEC.md docs/evidence/725-fleet-capacity.md scripts/reconcile-issue-725-fleet.mjs .github/workflows/issue-725-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(jarvis): reconcile FLEET-010-011 evidence'
          git push
