name: JARVIS Mac Bootstrap

on:
  push:
    branches: [main]
    paths:
      - 'scripts/jarvis-mac-zero-touch.sh'
      - 'scripts/jarvis-mac-zero-touch-install.sh'
      - '.github/workflows/jarvis-mac-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-mac-bootstrap
  cancel-in-progress: false

jobs:
  install:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Install or refresh resident JARVIS runtime
        shell: bash
        run: bash scripts/jarvis-mac-zero-touch-install.sh
      - name: Wait for and report JARVIS local status
        shell: bash
        run: |
          STATUS="$HOME/Library/Application Support/JARVIS/status.json"
          for _ in $(seq 1 45); do
            if [[ -s "$STATUS" ]]; then
              cat "$STATUS"
              exit 0
            fi
            sleep 2
          done
          echo 'JARVIS resident runtime did not produce status.json within 90 seconds.' >&2
          echo '--- LaunchAgent stderr ---' >&2
          tail -100 "$HOME/Library/Application Support/JARVIS/zero-touch-launch.err.log" 2>/dev/null || true
          echo '--- LaunchAgent stdout ---' >&2
          tail -100 "$HOME/Library/Application Support/JARVIS/zero-touch-launch.out.log" 2>/dev/null || true
          exit 1
