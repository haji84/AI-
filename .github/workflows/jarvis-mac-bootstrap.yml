name: JARVIS Mac Bootstrap

on:
  push:
    branches: [main]
    paths:
      - 'scripts/jarvis-mac-zero-touch.sh'
      - 'scripts/jarvis-mac-zero-touch-install.sh'
      - '.github/workflows/jarvis-mac-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-mac-bootstrap
  cancel-in-progress: false

jobs:
  install:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Install or refresh resident JARVIS runtime
        shell: bash
        run: bash scripts/jarvis-mac-zero-touch-install.sh
      - name: Wait for and report JARVIS local status
        shell: bash
        run: |
          STATUS="$HOME/Library/Application Support/JARVIS/status.json"
          for _ in $(seq 1 45); do
            if [[ -s "$STATUS" ]]; then
              cat "$STATUS"
              break
            fi
            sleep 2
          done
          if [[ ! -s "$STATUS" ]]; then
            echo 'JARVIS resident runtime did not produce status.json within 90 seconds.' >&2
          fi
          echo '--- Versions / processes ---'
          echo "node=$(command -v node || true)"; node --version || true
          echo "pnpm=$(command -v pnpm || true)"; pnpm --version || true
          echo "cloudflared=$(command -v cloudflared || true)"; cloudflared --version || true
          pgrep -alf 'jarvis-broker|jarvis-remote-gateway|cloudflared' || true
          echo '--- Broker stderr ---'
          tail -120 "$HOME/Library/Application Support/JARVIS/broker.err.log" 2>/dev/null || true
          echo '--- Broker stdout ---'
          tail -120 "$HOME/Library/Application Support/JARVIS/broker.out.log" 2>/dev/null || true
          echo '--- Broker tunnel ---'
          tail -120 "$HOME/Library/Application Support/JARVIS/broker-tunnel.log" 2>/dev/null || true
          echo '--- Remote stderr ---'
          tail -120 "$HOME/Library/Application Support/JARVIS/remote-gateway.err.log" 2>/dev/null || true
          echo '--- LaunchAgent stderr ---'
          tail -120 "$HOME/Library/Application Support/JARVIS/zero-touch-launch.err.log" 2>/dev/null || true
          echo '--- LaunchAgent stdout ---'
          tail -120 "$HOME/Library/Application Support/JARVIS/zero-touch-launch.out.log" 2>/dev/null || true
          [[ -s "$STATUS" ]]
