name: GAI R18 Adaptation Preflight

on:
  workflow_run:
    workflows: ["GAI R17 Governed Self Modification"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/gai-r18-adaptation-preflight.yml"
  schedule:
    - cron: "29 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gai-r18-adaptation-preflight
  cancel-in-progress: true

jobs:
  route:
    name: Hosted R18 capability router
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      zbook_online: ${{ steps.route.outputs.zbook_online }}
      state: ${{ steps.route.outputs.state }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Check R17 provenance and ZBook availability
        id: route
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .gai-results
          r17_success="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/gai-r17-self-modification.yml/runs?status=success&per_page=1" --jq '.total_count // 0' 2>/dev/null || echo 0)"
          prior=0
          while IFS= read -r run_id; do
            [ -z "$run_id" ] && continue
            count="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --jq '[.artifacts[] | select(.expired == false and .name == "gai-r18-adaptation-preflight")] | length' 2>/dev/null || echo 0)"
            if [ "${count:-0}" -gt 0 ]; then prior=1; break; fi
          done < <(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/gai-r18-adaptation-preflight.yml/runs?status=success&per_page=20" --jq '.workflow_runs[].id' 2>/dev/null || true)

          online=false
          state=WAITING_FOR_PREREQUISITE
          if [ "$prior" -eq 1 ]; then
            state=ALREADY_EXECUTED
          elif [ "${r17_success:-0}" -gt 0 ]; then
            runners="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100" 2>/dev/null || printf '{"runners":[]}')"
            n="$(printf '%s' "$runners" | jq -r '[.runners[] | select((.name|ascii_downcase)=="zbook" and .status=="online" and (.busy|not))] | length')"
            if [ "$n" -gt 0 ]; then online=true; state=RUNNABLE; else state=WAITING_FOR_CAPABILITY; fi
          fi
          printf 'zbook_online=%s\nstate=%s\n' "$online" "$state" >> "$GITHUB_OUTPUT"
          printf '{"schemaVersion":1,"stage":"R18","zbookOnline":%s,"state":"%s","checkedAt":"%s"}\n' "$online" "$state" "$(date -u +%FT%TZ)" > .gai-results/r18-route.json
          cat .gai-results/r18-route.json
      - name: Upload R18 routing state
        uses: actions/upload-artifact@v4
        with:
          name: gai-r18-route-status
          path: .gai-results/r18-route.json
          retention-days: 30

  r18-preflight:
    name: R18 zero-cost local adaptation readiness
    needs: route
    if: needs.route.outputs.zbook_online == 'true'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Inspect GPU, CUDA, RAM and disk readiness
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path .gai-results | Out-Null
          $gpuName = $null
          $vramMb = 0
          $cuda = $null
          $nvidiaSmi = Get-Command nvidia-smi -ErrorAction SilentlyContinue
          if ($nvidiaSmi) {
            try {
              $row = nvidia-smi --query-gpu=name,memory.total --format=csv,noheader,nounits | Select-Object -First 1
              if ($LASTEXITCODE -eq 0 -and $row) {
                $parts = $row -split ','
                $gpuName = $parts[0].Trim()
                $vramMb = [int]$parts[1].Trim()
              }
              $cuda = (nvidia-smi | Select-String 'CUDA Version:' | Select-Object -First 1).ToString()
            } catch {}
          }
          $os = Get-CimInstance Win32_OperatingSystem
          $ramGb = [math]::Round($os.TotalVisibleMemorySize / 1MB, 2)
          $drive = Get-PSDrive -Name C
          $freeGb = [math]::Round($drive.Free / 1GB, 2)
          $python = $null
          try { $python = (python --version 2>&1 | Select-Object -First 1).ToString() } catch {}
          $ollamaReady = $false
          try { Invoke-RestMethod -Uri 'http://127.0.0.1:11434/api/tags' -TimeoutSec 5 | Out-Null; $ollamaReady = $true } catch {}
          $methods = [ordered]@{
            specialistModelEvaluation = $ollamaReady
            distillationSmallLocal = ($ollamaReady -and $freeGb -ge 20)
            loraCandidate = ($vramMb -ge 8000 -and $freeGb -ge 30)
            qloraCandidate = ($vramMb -ge 6000 -and $freeGb -ge 30)
          }
          $report = [ordered]@{
            schemaVersion = 1
            runner = $env:RUNNER_NAME
            gpuName = $gpuName
            vramMb = $vramMb
            cudaSummary = $cuda
            ramGb = $ramGb
            freeSystemDriveGb = $freeGb
            python = $python
            ollamaReady = $ollamaReady
            methods = $methods
            policy = 'Preflight only. No adaptation is trained or accepted by this run.'
            additionalApiCost = 0
            collectedAt = (Get-Date).ToUniversalTime().ToString('o')
          }
          $report | ConvertTo-Json -Depth 6 | Set-Content -Encoding UTF8 .gai-results/r18-adaptation-preflight.json
          $report | ConvertTo-Json -Depth 6 | Write-Host
      - name: Upload R18 preflight
        uses: actions/upload-artifact@v4
        with:
          name: gai-r18-adaptation-preflight
          path: .gai-results/r18-adaptation-preflight.json
          retention-days: 30
