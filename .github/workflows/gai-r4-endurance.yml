name: GAI R4 Endurance

on:
  workflow_run:
    workflows: ["GAI R6 Benchmark v1.1"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gai-r4-endurance
  cancel-in-progress: false

jobs:
  r4-zbook:
    name: R4 checkpointed endurance on ZBook
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    env:
      GAI_LOCAL_MODEL_ENDPOINT: http://127.0.0.1:11434
      GAI_LOCAL_MODEL_NAME: qwen3:4b
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Ensure Ollama runtime is reachable
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Test-Ollama {
            try { Invoke-RestMethod -Uri "$($env:GAI_LOCAL_MODEL_ENDPOINT)/api/tags" -TimeoutSec 5 | Out-Null; return $true } catch { return $false }
          }
          if (-not (Test-Ollama)) {
            $ollama = Get-Command ollama -ErrorAction SilentlyContinue
            if ($ollama) { $exe = $ollama.Source } else { $exe = Join-Path $env:LOCALAPPDATA 'Programs\Ollama\ollama.exe' }
            if (-not (Test-Path $exe)) { throw 'Ollama executable not found' }
            Start-Process -FilePath $exe -ArgumentList 'serve' -WindowStyle Hidden
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) { Start-Sleep -Seconds 2; if (Test-Ollama) { $ready = $true; break } }
            if (-not $ready) { throw 'Ollama API did not become reachable' }
          }

      - name: Run endurance phase 1 and checkpoint
        shell: powershell
        run: node scripts/gai-r4-endurance.mjs --phase=1

      - name: Resume endurance phase 2 from checkpoint
        shell: powershell
        run: node scripts/gai-r4-endurance.mjs --phase=2

      - name: Verify safety and bounded-recovery regressions
        shell: powershell
        run: |
          node --test tests/bounded-runner.test.ts tests/recovery-policy.test.ts tests/recovery-loop-integration.test.ts tests/risk-policy.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path .gai-results | Out-Null
          Set-Content -Encoding UTF8 .gai-results/r4-safety-passed.txt 'verified'

      - name: Derive verified R4 evidence
        shell: powershell
        run: node scripts/gai-r4-evidence.ts

      - name: Upload complete R4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gai-baseline-zbook
          path: .gai-results/
          include-hidden-files: true
          retention-days: 90
