name: GORIQ JARVIS Production Sync

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-code:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    concurrency:
      group: jarvis-vercel-code-deploy
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_YGrZkBR7MyYxkq3K9XkTBhqu
      VERCEL_PROJECT_NAME: jarvis
      JARVIS_PRODUCTION_URL: https://jarvis-fawn-iota.vercel.app
      SYNC_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SYNC_COMMIT_SHA }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Bind exact JARVIS Vercel project
        shell: bash
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?missing VERCEL_TOKEN}"
          node <<'NODE'
          const fs = await import("node:fs/promises");
          const token = process.env.VERCEL_TOKEN;
          const teamId = process.env.VERCEL_TEAM_ID;
          const projectName = process.env.VERCEL_PROJECT_NAME;
          const response = await fetch(
            `https://api.vercel.com/v9/projects/${encodeURIComponent(projectName)}?teamId=${encodeURIComponent(teamId)}`,
            { headers: { Authorization: `Bearer ${token}` } },
          );
          const body = await response.json().catch(() => null);
          if (!response.ok || !body?.id || !body?.accountId) {
            throw new Error(`Unable to resolve JARVIS Vercel project (HTTP ${response.status})`);
          }
          await fs.mkdir(".vercel", { recursive: true });
          await fs.writeFile(
            ".vercel/project.json",
            JSON.stringify({ projectId: body.id, orgId: body.accountId }) + "\n",
            { mode: 0o600 },
          );
          console.log("Bound hosted deploy to JARVIS Vercel project.");
          NODE

      - name: Deploy exact verified main commit to JARVIS Production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/jarvis-hosted-deploy.txt"
          set +e
          pnpm dlx vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN" >"$output" 2>&1
          status=$?
          set -e
          cat "$output"
          if (( status != 0 )); then
            if grep -q 'api-deployments-free-per-day' "$output"; then
              echo "Vercel deployment quota blocked hosted JARVIS code deploy." >&2
            fi
            exit "$status"
          fi
          url="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' "$output" | tail -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify JARVIS Production code endpoint responds
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 "$JARVIS_PRODUCTION_URL" >/dev/null
          echo "JARVIS Production code deploy responded successfully."

  sync:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    concurrency:
      group: jarvis-vercel-runtime-sync
      cancel-in-progress: true
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_YGrZkBR7MyYxkq3K9XkTBhqu
      VERCEL_PROJECT_NAME: jarvis
      JARVIS_PRODUCTION_URL: https://jarvis-fawn-iota.vercel.app
      SYNC_COMMIT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SYNC_COMMIT_SHA }}

      - name: Update local JARVIS Broker to exact verified main
        if: github.event_name == 'push' || github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          test "$SYNC_COMMIT_SHA" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$SYNC_COMMIT_SHA" origin/main
          STATE_ROOT="$HOME/Library/Application Support/JARVIS"
          mkdir -p "$STATE_ROOT"
          printf '%s\n' "$SYNC_COMMIT_SHA" > "$STATE_ROOT/runtime-target-main-sha"
          ENV_FILE="$STATE_ROOT/jarvis.env"
          test -s "$ENV_FILE"
          if grep -q '^GORIQ_RUNTIME_REVISION=' "$ENV_FILE"; then
            sed -i '' "s/^GORIQ_RUNTIME_REVISION=.*/GORIQ_RUNTIME_REVISION=$SYNC_COMMIT_SHA/" "$ENV_FILE"
          else
            printf '\nGORIQ_RUNTIME_REVISION=%s\n' "$SYNC_COMMIT_SHA" >> "$ENV_FILE"
          fi
          chmod 600 "$ENV_FILE"
          runtime_label() {
            if launchctl print "gui/$(id -u)/com.aicompany.jarvis-runtime" >/dev/null 2>&1; then
              printf '%s' "com.aicompany.jarvis-runtime"
            elif launchctl print "gui/$(id -u)/com.aicompany.jarvis-broker" >/dev/null 2>&1; then
              printf '%s' "com.aicompany.jarvis-broker"
            fi
          }
          ensure_runtime() {
            local label
            label="$(runtime_label)"
            if [[ -z "$label" ]]; then
              echo "RUNTIME_RECOVERY stage=bootstrap reason=no-loaded-runtime"
              if ! JARVIS_REPO_ROOT="$GITHUB_WORKSPACE" bash scripts/jarvis-mac-install-launchagent.sh; then
                echo "RUNTIME_RECOVERY bootstrap_failed"
              fi
              label="$(runtime_label || true)"
            fi
            [[ -n "$label" ]] || return 1
            if ! launchctl kickstart -k "gui/$(id -u)/$label"; then\n              echo "RUNTIME_RECOVERY kickstart_failed label=$label"\n              return 1\n            fi
          }
          runtime_healthy() {
            local body
            body="$(curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:${JARVIS_PORT:-8787}/health" 2>/dev/null || true)"
            node -e 'const x=JSON.parse(process.argv[1]);process.exit(x.ok===true&&x.runtimeRevision===process.argv[2]?0:1)' "$body" "$SYNC_COMMIT_SHA" 2>/dev/null
          }
          wait_runtime() {
            for _ in $(seq 1 15); do
              sleep 2
              runtime_healthy && return 0
            done
            return 1
          }

          ensure_runtime || true
          if ! wait_runtime; then
            echo "Primary runtime restart did not converge; running bounded self-recovery."
            launchctl kickstart -k "gui/$(id -u)/com.aicompany.jarvis-zero-touch" >/dev/null 2>&1 || true
            if ! JARVIS_REPO_ROOT="$GITHUB_WORKSPACE" bash scripts/jarvis-mac-install-launchagent.sh; then
              echo "RUNTIME_RECOVERY canonical_reinstall_failed"
            fi
            ensure_runtime || echo "RUNTIME_RECOVERY second_kickstart_failed"
            wait_runtime || {
              echo "Runtime self-recovery failed." >&2
              tail -n 80 "$STATE_ROOT/launchagent.err.log" 2>/dev/null || true
              tail -n 80 "$STATE_ROOT/broker-service.err.log" 2>/dev/null || true
              exit 1
            }
          fi
          printf '%s\n' "$SYNC_COMMIT_SHA" > "$STATE_ROOT/runtime-active-main-sha"
          echo "GORIQ_RUNTIME_UPDATED sha=$SYNC_COMMIT_SHA"

      - name: Sync live JARVIS endpoints into Vercel
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          STATE_ROOT="$HOME/Library/Application Support/JARVIS"
          ENV_FILE="$STATE_ROOT/jarvis.env"
          SYNC_FILE="$STATE_ROOT/vercel-api-sync.sha256"
          RETRY_FILE="$STATE_ROOT/vercel-deploy-retry-after.epoch"
          test -s "$ENV_FILE"

          load_runtime() {
            set -a
            source "$ENV_FILE"
            set +a
          }
          broker_is_live() {
            [[ -n "${JARVIS_PUBLIC_BROKER_URL:-}" ]] && curl --fail --silent --show-error --max-time 8 "$JARVIS_PUBLIC_BROKER_URL/health" >/dev/null 2>&1
          }

          load_runtime
          : "${JARVIS_OWNER_TOKEN:?missing JARVIS_OWNER_TOKEN}"
          : "${VERCEL_TOKEN:?missing VERCEL_TOKEN}"

          if ! broker_is_live; then
            echo "Stored Quick Tunnel is stale. Rotating the Broker tunnel automatically."
            launchctl kickstart -k "gui/$(id -u)/com.aicompany.jarvis-broker" >/dev/null 2>&1 || true
            launchctl kickstart -k "gui/$(id -u)/com.aicompany.jarvis-broker-tunnel" >/dev/null 2>&1 || true
            sleep 5
            launchctl kickstart -k "gui/$(id -u)/com.aicompany.jarvis-zero-touch" >/dev/null 2>&1 || true

            refreshed=false
            for _ in $(seq 1 30); do
              sleep 2
              load_runtime
              if broker_is_live; then
                refreshed=true
                break
              fi
            done
            [[ "$refreshed" == true ]] || { echo "Unable to obtain a healthy replacement Quick Tunnel URL." >&2; exit 2; }
          fi

          load_runtime
          : "${JARVIS_PUBLIC_BROKER_URL:?missing JARVIS_PUBLIC_BROKER_URL after tunnel reconciliation}"
          broker_is_live || { echo "JARVIS public Broker is not reachable after reconciliation." >&2; exit 3; }

          desired_hash="$(printf '%s\n%s\n%s\n%s\n%s' \
            "$JARVIS_PUBLIC_BROKER_URL" \
            "$JARVIS_OWNER_TOKEN" \
            "${JARVIS_REMOTE_PUBLIC_URL:-}" \
            "${JARVIS_REMOTE_GATEWAY_TOKEN:-}" \
            "$SYNC_COMMIT_SHA" | shasum -a 256 | awk '{print $1}')"
          previous_hash="$(cat "$SYNC_FILE" 2>/dev/null || true)"
          echo "desired_hash=$desired_hash" >> "$GITHUB_OUTPUT"

          if [[ "$desired_hash" == "$previous_hash" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "JARVIS Vercel environment and deployed commit already match the current runtime."
            exit 0
          fi

          now="$(date +%s)"
          retry_after="$(cat "$RETRY_FILE" 2>/dev/null || true)"
          if [[ "$retry_after" =~ ^[0-9]+$ ]] && (( now < retry_after )); then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "JARVIS Production deploy is deferred by Vercel quota until epoch $retry_after."
            exit 0
          fi
          rm -f "$RETRY_FILE"

          node <<'NODE'
          const token = process.env.VERCEL_TOKEN;
          const teamId = process.env.VERCEL_TEAM_ID;
          const projectName = process.env.VERCEL_PROJECT_NAME;
          const brokerUrl = process.env.JARVIS_PUBLIC_BROKER_URL;
          const ownerToken = process.env.JARVIS_OWNER_TOKEN;
          const remoteUrl = process.env.JARVIS_REMOTE_PUBLIC_URL || "";
          const remoteToken = process.env.JARVIS_REMOTE_GATEWAY_TOKEN || "";
          if (!token || !teamId || !projectName || !brokerUrl || !ownerToken) throw new Error("JARVIS/Vercel sync context is incomplete");

          const headers = { Authorization: `Bearer ${token}`, "Content-Type": "application/json" };
          async function request(url, init = {}) {
            const response = await fetch(url, { ...init, headers: { ...headers, ...(init.headers || {}) } });
            const text = await response.text();
            let body = null;
            if (text) { try { body = JSON.parse(text); } catch { body = { message: text }; } }
            if (!response.ok) throw new Error(`Vercel API ${response.status}: ${body?.error?.message || body?.message || "request failed"}`);
            return body;
          }

          const project = await request(`https://api.vercel.com/v9/projects/${encodeURIComponent(projectName)}?teamId=${encodeURIComponent(teamId)}`);
          if (!project?.id || !project?.accountId) throw new Error("Unable to resolve JARVIS Vercel project");

          const envs = [
            { key: "JARVIS_BROKER_URL", value: brokerUrl, type: "plain", target: ["production"] },
            { key: "JARVIS_OWNER_TOKEN", value: ownerToken, type: "sensitive", target: ["production"] },
          ];
          if (remoteUrl && remoteToken) {
            envs.push(
              { key: "JARVIS_REMOTE_GATEWAY_URL", value: remoteUrl, type: "plain", target: ["production"] },
              { key: "JARVIS_REMOTE_GATEWAY_TOKEN", value: remoteToken, type: "sensitive", target: ["production"] },
            );
          }

          await request(`https://api.vercel.com/v10/projects/${encodeURIComponent(project.id)}/env?upsert=true&teamId=${encodeURIComponent(teamId)}`, {
            method: "POST",
            body: JSON.stringify(envs),
          });

          const fs = await import("node:fs/promises");
          await fs.mkdir(".vercel", { recursive: true });
          await fs.writeFile(".vercel/project.json", JSON.stringify({ projectId: project.id, orgId: project.accountId }) + "\n", { mode: 0o600 });
          console.log(`Synced JARVIS runtime endpoints to Vercel project ${projectName}.`);
          NODE

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: steps.sync.outputs.changed == 'true'
        with:
          version: 11.19.0
          run_install: false

      - uses: actions/setup-node@v4
        if: steps.sync.outputs.changed == 'true'
        with:
          node-version: 24.19.0

      - name: Redeploy Production with synchronized environment
        id: deploy
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -uo pipefail
          STATE_ROOT="$HOME/Library/Application Support/JARVIS"
          RETRY_FILE="$STATE_ROOT/vercel-deploy-retry-after.epoch"
          OUTPUT_FILE="$RUNNER_TEMP/jarvis-vercel-deploy-output.txt"

          set +e
          pnpm dlx vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN" >"$OUTPUT_FILE" 2>&1
          status=$?
          set -e
          cat "$OUTPUT_FILE"

          if (( status == 0 )); then
            rm -f "$RETRY_FILE"
            echo "deployed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -q 'api-deployments-free-per-day' "$OUTPUT_FILE"; then
            retry_after="$(( $(date +%s) + 86400 ))"
            printf '%s\n' "$retry_after" > "$RETRY_FILE"
            chmod 600 "$RETRY_FILE"
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "Vercel free deployment quota reached; JARVIS will retry automatically after the quota window."
            exit 0
          fi

          exit "$status"

      - name: Verify Vercel can reach the live Broker
        if: steps.sync.outputs.changed == 'true' && steps.deploy.outputs.deployed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          STATE_ROOT="$HOME/Library/Application Support/JARVIS"
          SYNC_FILE="$STATE_ROOT/vercel-api-sync.sha256"
          RETRY_FILE="$STATE_ROOT/vercel-deploy-retry-after.epoch"
          for _ in $(seq 1 30); do
            body="$(curl --silent --show-error --location --max-time 10 "$JARVIS_PRODUCTION_URL/api/jarvis/connectivity" || true)"
            if node -e 'const x=JSON.parse(process.argv[1]); process.exit(x.ok===true && x.brokerConfigured===true && x.ownerTokenConfigured===true && x.brokerReachable===true ? 0 : 1)' "$body" 2>/dev/null; then
              printf '%s\n' '${{ steps.sync.outputs.desired_hash }}' > "$SYNC_FILE"
              chmod 600 "$SYNC_FILE"
              rm -f "$RETRY_FILE"
              echo "JARVIS Production connectivity verified and deployed commit recorded."
              exit 0
            fi
            sleep 4
          done
          echo "JARVIS Production connectivity verification timed out." >&2
          exit 1
