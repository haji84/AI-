name: GORIQ PR CI Recovery

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  actions: read
  pull-requests: read
  issues: write

concurrency:
  group: goriq-pr-ci-recovery-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.pr.outputs.eligible }}
      number: ${{ steps.pr.outputs.number }}
      branch: ${{ steps.pr.outputs.branch }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      reason: ${{ steps.pr.outputs.reason }}
    steps:
      # workflow_run's github.sha is the protected default-branch snapshot, never PR code.
      - name: Checkout trusted preflight control
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Resolve eligible same-repository pull request
        id: pr
        uses: actions/github-script@v7
        env:
          GORIQ_RECOVERY_CONTROL_WORKSPACE: ${{ github.workspace }}/control
        with:
          script: |
            const helper = require('node:path').join(process.env.GORIQ_RECOVERY_CONTROL_WORKSPACE, 'scripts/goriq-pr-ci-recovery-preflight.mjs');
            const { runRecoveryPreflight } = await import(require('node:url').pathToFileURL(helper).href);
            await runRecoveryPreflight({ github, context, core });

  recover:
    needs: [preflight]
    if: needs.preflight.outputs.eligible == 'true'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 75

    steps:
      - name: Checkout trusted recovery control
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Recheck queued recovery before target setup
        id: fresh
        uses: actions/github-script@v7
        env:
          GORIQ_RECOVERY_CONTROL_WORKSPACE: ${{ github.workspace }}/control
          GORIQ_RECOVERY_PR_NUMBER: ${{ needs.preflight.outputs.number }}
          GORIQ_RECOVERY_HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          GORIQ_RECOVERY_BRANCH: ${{ needs.preflight.outputs.branch }}
        with:
          script: |
            const helper = require('node:path').join(process.env.GORIQ_RECOVERY_CONTROL_WORKSPACE, 'scripts/goriq-pr-ci-recovery-preflight.mjs');
            const { runRecoveryPreflight } = await import(require('node:url').pathToFileURL(helper).href);
            await runRecoveryPreflight({ github, context, core, receipt: {
              number: Number(process.env.GORIQ_RECOVERY_PR_NUMBER),
              headSha: process.env.GORIQ_RECOVERY_HEAD_SHA,
              branch: process.env.GORIQ_RECOVERY_BRANCH,
            } });

      - name: Checkout exact failed PR head
        if: steps.fresh.outputs.eligible == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        if: steps.fresh.outputs.eligible == 'true'
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        if: steps.fresh.outputs.eligible == 'true'
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: target/pnpm-lock.yaml

      - name: Install target dependencies
        if: steps.fresh.outputs.eligible == 'true'
        working-directory: target
        run: pnpm install --frozen-lockfile

      - name: Run bounded autonomous CI recovery
        if: steps.fresh.outputs.eligible == 'true'
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORIQ_RECOVERY_PR_NUMBER: ${{ needs.preflight.outputs.number }}
          GORIQ_RECOVERY_RUN_ID: ${{ github.event.workflow_run.id }}
          GORIQ_RECOVERY_HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          GORIQ_RECOVERY_WORKSPACE: ${{ github.workspace }}\target
          GORIQ_RECOVERY_CONTROL_WORKSPACE: ${{ github.workspace }}\control
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\control\scripts\invoke-node-with-groq-secret-windows.ps1 -NodeScript .\control\scripts\goriq-pr-ci-recovery.ts
