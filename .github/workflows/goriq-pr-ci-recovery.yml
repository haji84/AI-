name: GORIQ PR CI Recovery

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: goriq-pr-ci-recovery-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35

    steps:
      - name: Resolve same-repository pull request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.payload.workflow_run.pull_requests?.[0]?.number;
            if (!number) {
              core.setFailed('No pull request is bound to the failed CI run');
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            });
            const expected = `${context.repo.owner}/${context.repo.repo}`;
            if (pr.state !== 'open' || pr.head.repo?.full_name !== expected || pr.base.repo?.full_name !== expected || pr.head.ref === 'main' || pr.head.ref === pr.base.ref) {
              core.setFailed('PR is not eligible for autonomous recovery');
              return;
            }
            core.setOutput('number', String(number));
            core.setOutput('branch', pr.head.ref);
            core.setOutput('head_sha', pr.head.sha);

      - name: Checkout trusted recovery control
        uses: actions/checkout@v4
        with:
          ref: main
          path: control
          persist-credentials: false

      - name: Checkout target PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.branch }}
          path: target
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: target/pnpm-lock.yaml

      - name: Install target dependencies
        working-directory: target
        run: pnpm install --frozen-lockfile

      - name: Run bounded autonomous CI recovery
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORIQ_RECOVERY_PR_NUMBER: ${{ steps.pr.outputs.number }}
          GORIQ_RECOVERY_RUN_ID: ${{ github.event.workflow_run.id }}
          GORIQ_RECOVERY_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          GORIQ_RECOVERY_WORKSPACE: ${{ github.workspace }}\target
          GORIQ_RECOVERY_CONTROL_WORKSPACE: ${{ github.workspace }}\control
        run: |
          node .\control\scripts\goriq-pr-ci-recovery.ts
