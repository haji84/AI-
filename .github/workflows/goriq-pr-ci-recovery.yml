name: GORIQ PR CI Recovery

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  actions: read
  pull-requests: read
  issues: write

concurrency:
  group: goriq-pr-ci-recovery-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.pr.outputs.eligible }}
      number: ${{ steps.pr.outputs.number }}
      branch: ${{ steps.pr.outputs.branch }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - name: Resolve eligible same-repository pull request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.payload.workflow_run.pull_requests?.[0]?.number;
            if (!number) {
              core.setOutput('eligible', 'false');
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            });
            const expected = `${context.repo.owner}/${context.repo.repo}`;
            const eligible =
              pr.state === 'open' &&
              pr.head.repo?.full_name === expected &&
              pr.base.repo?.full_name === expected &&
              pr.head.ref !== 'main' &&
              pr.head.ref !== pr.base.ref &&
              pr.head.sha === context.payload.workflow_run.head_sha;
            core.setOutput('eligible', eligible ? 'true' : 'false');
            if (!eligible) {
              core.notice(`Skipping stale or ineligible PR #${number}; no ZBook runner will be allocated.`);
              return;
            }
            core.setOutput('number', String(number));
            core.setOutput('branch', pr.head.ref);
            core.setOutput('head_sha', pr.head.sha);

  recover:
    needs: [preflight]
    if: needs.preflight.outputs.eligible == 'true'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 75

    steps:
      - name: Checkout trusted recovery control
        uses: actions/checkout@v4
        with:
          ref: main
          path: control
          persist-credentials: false

      - name: Checkout target PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.branch }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: target/pnpm-lock.yaml

      - name: Install target dependencies
        working-directory: target
        run: pnpm install --frozen-lockfile

      - name: Run bounded autonomous CI recovery
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GORIQ_RECOVERY_PR_NUMBER: ${{ needs.preflight.outputs.number }}
          GORIQ_RECOVERY_RUN_ID: ${{ github.event.workflow_run.id }}
          GORIQ_RECOVERY_HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          GORIQ_RECOVERY_WORKSPACE: ${{ github.workspace }}\target
          GORIQ_RECOVERY_CONTROL_WORKSPACE: ${{ github.workspace }}\control
        run: |
          node .\control\scripts\goriq-pr-ci-recovery.ts
