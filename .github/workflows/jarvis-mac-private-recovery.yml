name: JARVIS bounded Mac private login handoff
on:
  push:
    branches: [codex/867-private-recovery]
    paths: [.github/workflows/jarvis-mac-private-recovery.yml]
permissions:
  contents: read
concurrency:
  group: jarvis-mac-private-recovery
  cancel-in-progress: false
jobs:
  login-handoff:
    if: github.repository == 'haji84/AI-' && github.ref == 'refs/heads/codex/867-private-recovery'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 2
    steps:
      - name: Request a bounded login handoff without exposing its URL
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JARVIS_AUTH_TRANSPORT_PUBLIC_KEY: 
        run: |
          set -euo pipefail
          # Owner authorized #867 restoration excluding billing. One-session expiry.
          node -e 'if(Date.now()>Date.parse("2026-09-17T14:30:00Z"))process.exit(1)'
          script="$RUNNER_TEMP/jarvis-mac-auth-request-867.mjs"
          curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://raw.githubusercontent.com/haji84/AI-/3d3de352cb25a5eb09ca5cd5f13776a19559d0e1/scripts/jarvis-mac-auth-request.mjs" \
            -o "$script"
          node "$script" --request
