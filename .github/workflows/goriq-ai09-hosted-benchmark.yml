name: GORIQ AI-09 GitHub-hosted CPU Benchmark

# First-stage pilot only. No automatic review or writes to PRs.
on:
  pull_request:
    paths:
      - scripts/goriq-ai09-hosted-benchmark.mjs
      - scripts/goriq-ai09-race-review.mjs
      - tests/ai09-hosted-benchmark.test.mjs
      - .github/workflows/goriq-ai09-hosted-benchmark.yml

permissions:
  contents: read

concurrency:
  group: ai09-hosted-benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  synthetic-local-model-probe:
    if: >-
      github.event.pull_request.number == 1799 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 5m
    steps:
      - name: Checkout exact same-repository PR head without persistent credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run bounded static and mocked-inference checks
        run: node --test tests/ai09-hosted-benchmark.test.mjs
      - name: Record baseline compute capacity
        run: |
          echo "Runner: $RUNNER_OS / $RUNNER_ARCH"
          echo "CPU count: $(nproc)"
          free -m
          df -h / | tail -n 1
      - name: Install public Ollama Linux binary on ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 --max-time 240 \
            https://github.com/ollama/ollama/releases/download/v0.34.0/ollama-linux-amd64.tar.zst \
            -o "$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          # Same SHA256-pinned binary as the production-candidate AI-09 workflow.
          echo "cf95886728959aa09910bb34de5cca1cc5a8f68003b5597197d3f2c2d57c0804  $RUNNER_TEMP/ollama-linux-amd64.tar.zst" | sha256sum -c -
          sudo tar --zstd -xf "$RUNNER_TEMP/ollama-linux-amd64.tar.zst" -C /usr
          ollama --version
      - name: Start loopback-only Ollama and pull one verified-free model
        shell: bash
        run: |
          set -euo pipefail
          OLLAMA_HOST=127.0.0.1:11434 ollama serve >"$RUNNER_TEMP/ai09-ollama.log" 2>&1 &
          echo "OLLAMA_SERVER_PID=$!" >> "$GITHUB_ENV"
          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then echo "LOCAL_OLLAMA_START_FAILED"; exit 1; fi
          start=$(date +%s)
          timeout 480s ollama pull qwen2.5-coder:3b
          echo "AI09_MODEL_PULL_SECONDS=$(($(date +%s) - start))"
          ollama list
      - name: Exercise actual AI-09 parser with real local inference and capture timing and RAM
        shell: bash
        run: |
          set -euo pipefail
          node scripts/goriq-ai09-hosted-benchmark.mjs
      - name: Resolve actual RACE AI PR 65 revision from public GitHub
        id: race
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            const r=await fetch("https://api.github.com/repos/haji84/RACE-AI/pulls/65",
              {headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+process.env.GITHUB_TOKEN},signal:AbortSignal.timeout(15000)});
            if(!r.ok)throw Error("RACE_PR_LOOKUP_FAILED_"+r.status);
            const p=await r.json();
            if(p.state!=="open"||p.number!==65||
              p.head?.repo?.full_name!=="haji84/RACE-AI"||
              p.base?.repo?.full_name!=="haji84/RACE-AI"||
              !/^[a-f0-9]{40}$/.test(p.head.sha)||
              !/^[a-f0-9]{40}$/.test(p.base.sha))throw Error("RACE_PR_NOT_TRUSTED");
            appendFileSync(process.env.GITHUB_OUTPUT,
              "head="+p.head.sha+"\nbase="+p.base.sha+"\n");
          '
      - name: Actual RACE AI PR review with isolated AI-09 model, no GitHub posting
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RACE_PR_HEAD: ${{ steps.race.outputs.head }}
          RACE_PR_BASE: ${{ steps.race.outputs.base }}
        run: |
          set -euo pipefail
          set +e
          node scripts/goriq-ai09-race-review.mjs \
            --pr 65 --head "$RACE_PR_HEAD" --base "$RACE_PR_BASE" \
            > "$RUNNER_TEMP/race-ai09-advisory.json"
          reviewer_code=$?
          set -e
          if [ ! -s "$RUNNER_TEMP/race-ai09-advisory.json" ]; then
            echo "AI09_RACE_PR_REVIEW_NO_RECEIPT"; exit 2
          fi
          REVIEWER_CODE="$reviewer_code" node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const r=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/race-ai09-advisory.json","utf8"));
            const valid=r.repository==="haji84/RACE-AI" &&
              r.prNumber===65 && r.headSha===process.env.RACE_PR_HEAD &&
              r.baseSha===process.env.RACE_PR_BASE && r.reviewer==="AI-09" &&
              r.githubApprovalSatisfied===false && r.mergeAuthorized===false &&
              r.physicalEvidenceVerified===false && r.evidenceClass==="AI_ASSERTED" &&
              ["NO_ACTIONABLE_FINDINGS","CHANGES_REQUESTED","INCONCLUSIVE","BLOCKED"].includes(r.status);
            if(!valid)throw Error("AI09_RACE_RECEIPT_REJECTED");
            console.log("AI09_RACE_PR_REVIEW_HEAD="+r.headSha);
            console.log("AI09_RACE_PR_REVIEW_STATUS="+r.status);
            console.log("AI09_RACE_PR_REVIEW_FINDINGS="+r.findings.length);
            console.log("AI09_RACE_PR_REVIEW_CHUNKS="+JSON.stringify(r.chunkOutcomes));
            console.log("AI09_RACE_PR_REVIEW_BLOCKERS="+r.blockers.filter(b=>/^[a-z_]+$/.test(b)).join(","));
            if(r.status==="BLOCKED"||r.status==="INCONCLUSIVE")process.exitCode=2;
            if((r.status==="CHANGES_REQUESTED" && process.env.REVIEWER_CODE!=="2") ||
               (r.status==="NO_ACTIONABLE_FINDINGS" && process.env.REVIEWER_CODE!=="0"))
              process.exitCode=2;
          '
      - name: Produce scoped AI-09 findings for independent verification
        # Preserve triage evidence even when a real model result correctly returns INCONCLUSIVE.
        # The failed review step still fails this workflow; it is never promoted to a PASS.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/race-ai09-advisory.json" ]; then
            echo "AI09_SAFE_FINDINGS_SKIPPED_MISSING_REVIEW_RECEIPT"
            exit 0
          fi
          node --input-type=module -e '
            import {readFileSync, writeFileSync} from "node:fs";
            import {safeRaceFindingSummaries} from "./scripts/goriq-ai09-race-review.mjs";
            const r=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/race-ai09-advisory.json","utf8"));
            const findings=safeRaceFindingSummaries(r);
            const record={
              repository:r.repository,prNumber:r.prNumber,
              headSha:r.headSha,baseSha:r.baseSha,patchSha256:r.patchSha256,
              totalChunks:r.chunkCount,completedChunks:r.chunkOutcomes.length,
              status:r.status,findings,
              evidenceClass:"AI_ASSERTED",githubApprovalSatisfied:false,
              mergeAuthorized:false,independentSecurityReviewSatisfied:false
            };
            writeFileSync(process.env.RUNNER_TEMP+"/race-ai09-safe-findings.json",
              JSON.stringify(record,null,2)+"\n",{mode:0o600,flag:"wx"});
            console.log("AI09_SAFE_FINDINGS_COUNT="+findings.length);
            console.log("AI09_SAFE_FINDINGS="+JSON.stringify(findings));
          '
      - name: Upload sanitized advisory only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai09-race-safe-findings
          path: ${{ runner.temp }}/race-ai09-safe-findings.json
          if-no-files-found: warn
          retention-days: 3
      - name: Emit scope and security guarantees
        if: always()
        shell: bash
        run: |
          echo '### AI-09 GitHub-hosted experimental benchmark' >> "$GITHUB_STEP_SUMMARY"
          echo 'Synthetic benchmark plus public RACE PR diff, local model only; repo-scoped read-only API token is never sent to the model.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No review approval, deployment, merge, automatic Builder handoff, user-secret access, or PC fallback is authorized by this run.' >> "$GITHUB_STEP_SUMMARY"
