name: iPhone Owner 1218 Mac preflight

on:
  workflow_dispatch:
    inputs:
      install:
        description: 'Install and launch on the one connected iPhone using an existing local signing identity'
        required: true
        default: false
        type: boolean
  pull_request:
    paths:
      - 'apps/ios-owner/**'
      - '.github/workflows/iphone-owner-build-1218.yml'

permissions:
  contents: read

jobs:
  compile:
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'haji84/AI-' && github.event.pull_request.head.ref == 'goriq/1218-iphone-owner') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/goriq/1218-iphone-owner')
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Read-only Mac and connected-device preflight
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --version
          command -v xcodegen || { echo 'XCODEGEN_UNAVAILABLE'; exit 2; }
          if xcrun devicectl list devices --json-output /tmp/goriq-1218-devices.json >/dev/null 2>&1; then
            python3 - <<'PY'
          import json
          with open('/tmp/goriq-1218-devices.json') as handle:
              devices=json.load(handle).get('result',{}).get('devices',[])
          print('DEVICE_RECORD_COUNT='+str(len(devices)))
          print('CONNECTED_IPHONE_COUNT='+str(sum('iphone' in str(item.get('deviceProperties',{}).get('name','')).lower() and item.get('connectionProperties',{}).get('transportType') in ('wired','localNetwork') for item in devices)))
          PY
            rm -f /tmp/goriq-1218-devices.json
          else
            echo 'DEVICE_LIST_UNAVAILABLE'
          fi
      - name: Compile iPhone Owner without signing or installation
        shell: bash
        run: |
          set -euo pipefail
          cd apps/ios-owner
          xcodegen generate
          xcodebuild -project JarvisIOSOwner.xcodeproj -scheme JarvisIOSOwner -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
      - name: Signed install and launch on the one connected iPhone
        if: (github.event_name == 'workflow_dispatch' && inputs.install == true) || (github.event_name == 'pull_request' && github.event.action == 'synchronize')
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            test "$(git rev-parse HEAD^)" = '244566ea0fcc04193d6451973e1edf331ea84307' || { echo 'ONE_TIME_INSTALL_SCOPE_NOT_MATCHED'; exit 0; }
          fi
          PROFILE_SELECTION="$(python3 - <<'PY'
          import hashlib, pathlib, plistlib, re, subprocess, time
          bundle = 'com.haji84.jarvis.iosowner'
          roots = [
              pathlib.Path.home() / 'Library/Developer/Xcode/UserData/Provisioning Profiles',
              pathlib.Path.home() / 'Library/MobileDevice/Provisioning Profiles',
          ]
          identity_output = subprocess.run(
              ['security', 'find-identity', '-v', '-p', 'codesigning'],
              capture_output=True,
              text=True,
          ).stdout
          identity_hashes = set(re.findall(r'\b[0-9A-F]{40}\b', identity_output, re.I))
          matches = []
          for root in roots:
              if not root.is_dir():
                  continue
              for path in root.iterdir():
                  if not path.is_file():
                      continue
                  decoded = subprocess.run(
                      ['security', 'cms', '-D', '-i', str(path)],
                      capture_output=True,
                  )
                  if decoded.returncode:
                      continue
                  try:
                      profile = plistlib.loads(decoded.stdout)
                  except Exception:
                      continue
                  entitlements = profile.get('Entitlements', {})
                  app_identifier = str(entitlements.get('application-identifier', ''))
                  teams = profile.get('TeamIdentifier', [])
                  team = teams[0] if len(teams) == 1 else ''
                  if entitlements.get('com.apple.developer.team-identifier') != team:
                      continue
                  if not app_identifier.endswith('.' + bundle):
                      continue
                  expires = profile.get('ExpirationDate')
                  if not expires or expires.timestamp() <= time.time():
                      continue
                  uuid = str(profile.get('UUID', ''))
                  certificate_hashes = {
                      hashlib.sha1(bytes(certificate)).hexdigest().upper()
                      for certificate in profile.get('DeveloperCertificates', [])
                  }
                  matching_hashes = certificate_hashes & identity_hashes
                  if re.fullmatch(r'[A-Z0-9]{10}', team) and re.fullmatch(r'[A-F0-9-]{36}', uuid, re.I) and len(matching_hashes) == 1:
                      matches.append((expires.timestamp(), team, uuid, next(iter(matching_hashes))))
          matching_teams = {team for _, team, _, _ in matches}
          if len(matching_teams) != 1:
              raise SystemExit(3)
          _, team, uuid, identity_hash = max(matches)
          print(f'{team}\t{uuid}\t{identity_hash}')
          PY
          )" || { echo 'APP_PROVISIONING_PROFILE_UNAVAILABLE'; exit 3; }
          IFS=$'\t' read -r TEAM PROFILE_UUID IDENTITY_HASH <<< "$PROFILE_SELECTION"
          test -n "$TEAM" && test -n "$PROFILE_UUID" && test -n "$IDENTITY_HASH" || { echo 'APP_PROVISIONING_PROFILE_UNAVAILABLE'; exit 3; }
          xcrun devicectl list devices --json-output "$RUNNER_TEMP/goriq-1218-devices.json" >/dev/null
          DEVICE_ID="$(python3 - "$RUNNER_TEMP/goriq-1218-devices.json" <<'PY'
          import json,sys
          with open(sys.argv[1]) as handle:
              records=json.load(handle).get('result',{}).get('devices',[])
          phones=[d for d in records if 'iphone' in str(d.get('deviceProperties',{}).get('name','')).lower() and d.get('connectionProperties',{}).get('transportType') in ('wired','localNetwork')]
          print(phones[0].get('identifier','') if len(phones)==1 else '')
          PY
          )"
          rm -f "$RUNNER_TEMP/goriq-1218-devices.json"
          test -n "$DEVICE_ID" || { echo 'EXACTLY_ONE_CONNECTED_IPHONE_REQUIRED'; exit 4; }
          cd apps/ios-owner
          xcodebuild -quiet -project JarvisIOSOwner.xcodeproj -scheme JarvisIOSOwner -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/goriq-1218-derived" DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY="$IDENTITY_HASH" CODE_SIGNING_ALLOWED=YES build
          APP="$RUNNER_TEMP/goriq-1218-derived/Build/Products/Debug-iphoneos/JarvisIOSOwner.app"
          test -d "$APP"
          xcrun devicectl device install app --device "$DEVICE_ID" "$APP" >"$RUNNER_TEMP/goriq-1218-install.log" 2>&1 || { echo 'DEVICE_INSTALL_FAILED'; exit 5; }
          rm -f "$RUNNER_TEMP/goriq-1218-install.log"
          xcrun devicectl device process launch --device "$DEVICE_ID" com.haji84.jarvis.iosowner >/dev/null 2>&1 || { echo 'DEVICE_LAUNCH_FAILED'; exit 6; }
          echo 'IPHONE_OWNER_APP_LAUNCHED_NO_SECRET_TRANSFER'
