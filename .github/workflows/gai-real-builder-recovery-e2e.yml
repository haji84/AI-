name: GAI Real Builder Recovery E2E

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Existing Windows path or owner-only tracked-source recovery
        type: choice
        options: [legacy, A, B]
        default: legacy
      bootstrap_b64:
        description: Phase A nonsecret gzip checkpoint, Base64
        type: string
      bootstrap_sha256:
        description: SHA256 of decoded gzip bytes
        type: string
      cache_key:
        description: Phase B exact immutable phase-A cache key
        type: string
      receipt_b64:
        description: Phase B public signed receipt JSON, Base64
        type: string
      receipt_sha256:
        description: SHA256 of decoded receipt JSON bytes
        type: string
  issues:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  real-builder-recovery:
    if: (github.event_name != 'issues' || startsWith(github.event.issue.title, '[JARVIS REAL BUILDER E2E]')) && inputs.phase != 'A' && inputs.phase != 'B'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Builder and run real Codex recovery E2E in one runner step
        id: run
        continue-on-error: true
        shell: powershell
        run: |
          $e2eWorkspace = Join-Path $env:LOCALAPPDATA 'GAIWorker\real-builder-e2e-workspace'
          Remove-Item $e2eWorkspace -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Join-Path $e2eWorkspace 'tests\fixtures') | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\tests\fixtures\autonomous-builder-e2e.txt" (Join-Path $e2eWorkspace 'tests\fixtures\autonomous-builder-e2e.txt') -Force
          & git -C $e2eWorkspace init
          & git -C $e2eWorkspace config user.name 'JARVIS E2E'
          & git -C $e2eWorkspace config user.email 'jarvis-e2e@local.invalid'
          & git -C $e2eWorkspace add tests/fixtures/autonomous-builder-e2e.txt
          & git -C $e2eWorkspace commit -m 'baseline'
          .\scripts\install-code-builder-windows.ps1 -WorkerId 'zbook' -Workspace $e2eWorkspace -ExecTimeoutMs 120000
          $codexVersion = (& cmd.exe /d /c "codex --version 2>&1" | Out-String).Trim()
          $codexVersionExit = $LASTEXITCODE
          Write-Host "Codex version: $codexVersion"
          if ($codexVersionExit -ne 0) { throw "Codex version probe failed" }
          $codexLogin = (& cmd.exe /d /c "codex login status 2>&1" | Out-String).Trim()
          $codexLoginExit = $LASTEXITCODE
          Write-Host "Codex login status: $codexLogin"
          if ($codexLoginExit -ne 0) { throw "Codex is not logged in for headless execution" }
          $tokenPath = Join-Path $env:LOCALAPPDATA 'GAIWorker\code-builder\token.txt'
          $token = (Get-Content $tokenPath -Raw).Trim()
          $headers = @{ Authorization = "Bearer $token" }
          $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8796/health' -Headers $headers -Method Get -TimeoutSec 5
          $health | ConvertTo-Json -Depth 5
          if (-not (@($health.capabilities) -contains 'code-builder')) { throw 'PowerShell health probe did not expose code-builder' }
          $env:CODE_BUILDER_URL = 'http://127.0.0.1:8796'
          $env:CODE_BUILDER_TOKEN = $token
          $env:CODE_BUILDER_TEST_WORKSPACE = $e2eWorkspace
          & node .\scripts\real-builder-recovery-e2e.ts
          $exit = $LASTEXITCODE
          Remove-Item Env:CODE_BUILDER_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:CODE_BUILDER_URL -ErrorAction SilentlyContinue
          Remove-Item Env:CODE_BUILDER_TEST_WORKSPACE -ErrorAction SilentlyContinue
          if ($exit -ne 0) { exit $exit }
      - name: Capture real Builder evidence
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .gai-results | Out-Null
          Copy-Item "$env:LOCALAPPDATA\GAIWorker\code-builder\install-status.json" .gai-results\ -Force -ErrorAction SilentlyContinue
          Copy-Item "$env:LOCALAPPDATA\GAIWorker\code-builder\worker.stdout.log" .gai-results\ -Force -ErrorAction SilentlyContinue
          Copy-Item "$env:LOCALAPPDATA\GAIWorker\code-builder\worker.stderr.log" .gai-results\ -Force -ErrorAction SilentlyContinue
          if (Test-Path .gai-results\real-builder-e2e.json) { Get-Content .gai-results\real-builder-e2e.json }
      - name: Upload real Builder evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gai-real-builder-recovery-e2e
          path: .gai-results/
          include-hidden-files: true
          retention-days: 30
      - name: Enforce real Builder result
        if: always()
        shell: powershell
        run: |
          if ('${{ steps.run.outcome }}' -ne 'success') { throw 'Real Builder recovery E2E failed' }

  tracked-source-recovery:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'haji84' && (inputs.phase == 'A' || inputs.phase == 'B')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Restore exact phase-A checkpoint
        if: inputs.phase == 'B'
        uses: actions/cache/restore@v4
        with:
          path: .goriq-tracked-actions-cache/checkpoint.json
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - name: Continue existing accepted Job
        id: recover
        env:
          INPUT_PHASE: ${{ inputs.phase }}
          INPUT_BOOTSTRAP_B64: ${{ inputs.bootstrap_b64 }}
          INPUT_BOOTSTRAP_SHA256: ${{ inputs.bootstrap_sha256 }}
          INPUT_CACHE_KEY: ${{ inputs.cache_key }}
          INPUT_RECEIPT_B64: ${{ inputs.receipt_b64 }}
          INPUT_RECEIPT_SHA256: ${{ inputs.receipt_sha256 }}
        run: node scripts/jarvis-tracked-repair-actions.mjs run
      - name: Save immutable phase-A checkpoint
        if: inputs.phase == 'A'
        uses: actions/cache/save@v4
        with:
          path: .goriq-tracked-actions-cache/checkpoint.json
          key: ${{ steps.recover.outputs.cache_key }}
      - name: Retain nonsecret recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracked-source-recovery-${{ inputs.phase }}-${{ github.run_id }}
          path: .goriq-tracked-actions/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
