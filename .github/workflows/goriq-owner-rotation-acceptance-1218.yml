name: GORIQ Owner Rotation 1218 Source Acceptance

on:
  workflow_dispatch:

# This route tests public temporary fixtures only. It deliberately has no live
# input, Owner scope, self-hosted runner, secret binding or production operation.
permissions:
  contents: read

jobs:
  rotation-and-preservation:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Confirm default plan accesses no production state
        shell: powershell
        run: |
          node scripts/owner-code-rotation-acceptance.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -NonInteractive -File scripts/owner-code-rotation-worker.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/owner-code-warning-1218.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -NonInteractive -File scripts/owner-code-warning-1218.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/owner-code-rotation-native-1218.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -NonInteractive -File scripts/owner-code-rotation-native-1218.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real temporary atomic replacement, recovery and 38-device SQLite/WAL fixtures
        shell: powershell
        run: |
          node --test --test-concurrency=2 scripts/owner-code-rotation.test.mjs scripts/owner-code-rotation-authority.test.mjs scripts/owner-code-rotation-redirect.test.mjs scripts/owner-code-fleet-preservation.test.mjs scripts/owner-code-rotation-acceptance.test.mjs scripts/owner-code-rotation-transaction.test.mjs scripts/owner-code-pc-preservation.test.mjs scripts/owner-code-rotation-readiness.test.mjs scripts/owner-code-warning-1218.test.mjs scripts/owner-code-rotation-native-1218.test.mjs scripts/owner-code-rotation-native-stage.test.mjs scripts/owner-code-fresh-checkout.test.mjs scripts/owner-code-protection-diagnostics.test.mjs scripts/owner-code-protection-failure-details.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
