name: Mobile Autonomy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run, pause, resume, or status
        required: true
        default: run
        type: choice
        options:
          - run
          - pause
          - resume
          - status
      max_cycles:
        description: Maximum bounded cycles
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "5"
      command_json:
        description: Unified Chat/Work/Codex command envelope for run or resume
        required: false
        type: string
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  issues: read
  pull-requests: write

env:
  AUTONOMY_STATE_DIR: .autonomy-state
  AUTONOMY_SUMMARY_PATH: .autonomy-state/run-summary.json

jobs:
  autonomy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: mobile-autonomy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Restore persistent autonomy state
        uses: actions/cache/restore@v4
        with:
          path: .autonomy-state
          key: autonomy-state-${{ github.run_id }}
          restore-keys: |
            autonomy-state-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run bounded autonomy cycle
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'status' }}
          MAX_CYCLES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.max_cycles || '3' }}
          AUTONOMY_COMMAND_JSON: ${{ github.event_name == 'workflow_dispatch' && inputs.command_json || '' }}
        run: pnpm autonomy:cloud -- --mode="$RUN_MODE" --max-cycles="$MAX_CYCLES"
      - name: Publish mobile-readable summary
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = process.env.GITHUB_STEP_SUMMARY;
          const readJson = (file) => {
            try { return JSON.parse(fs.readFileSync(file, 'utf8')); } catch { return null; }
          };
          const run = readJson('.autonomy-state/run-summary.json');
          const feedback = readJson('.autonomy-state/reasoning-feedback.json');
          const route = feedback?.reasoningRoute ?? null;
          const surface = route?.surface === 'chat' ? 'Chat' : route?.surface === 'work' ? 'Work' : route?.surface === 'codex' ? 'Codex' : '未判定';
          const approval = feedback?.humanApprovalRequired === true ? '必要' : feedback ? '不要' : '未判定';
          const value = (v) => v === null || v === undefined || v === '' ? 'なし' : String(v);
          const remaining = route?.budgetRemaining === null || route?.budgetRemaining === undefined ? '対象外' : String(route.budgetRemaining);
          const lines = [
            '## 📱 AI会社 スマホ確認',
            '',
            `- **実行状態:** ${value(run?.status ?? feedback?.status)}`,
            `- **実行元:** ${value(run?.commandSource ?? feedback?.commandSource)}`,
            `- **次に必要な頭脳:** ${surface}`,
            `- **理由:** ${value(route?.reason)}`,
            `- **Work使用:** ${value(route?.usage?.work)} / 内部上限 ${value(route?.softBudgets?.work)}`,
            `- **Codex使用:** ${value(route?.usage?.codex)} / 内部上限 ${value(route?.softBudgets?.codex)}`,
            `- **今回の推奨枠の残り:** ${remaining}`,
            `- **Human Gate:** ${approval}`,
            `- **次のアクション:** ${value(feedback?.nextAction ?? run?.nextAction)}`,
            '',
          ];
          fs.appendFileSync(path, `${lines.join('\n')}\n`);
          NODE

          echo "## Mobile Autonomy" >> "$GITHUB_STEP_SUMMARY"
          echo "### Run summary" >> "$GITHUB_STEP_SUMMARY"
          if [ -f .autonomy-state/run-summary.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat .autonomy-state/run-summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No run summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "### Reasoning feedback" >> "$GITHUB_STEP_SUMMARY"
          if [ -f .autonomy-state/reasoning-feedback.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat .autonomy-state/reasoning-feedback.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No reasoning feedback was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save persistent autonomy state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .autonomy-state
          key: autonomy-state-${{ github.run_id }}
