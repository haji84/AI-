name: GORIQ Stage B Node Loss Rejoin

on:
  workflow_dispatch:
  issues:
    types: [opened, reopened]

permissions:
  contents: read

concurrency:
  group: goriq-stage-b-node-loss-rejoin
  cancel-in-progress: false

jobs:
  mac-loss:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[GORIQ STAGE B NODE LOSS]')
    name: MacBook loses runner listener
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Prepare MacBook-owned handoff tasks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .goriq-stage-b/node-loss/mac-to-zbook
          node scripts/goriq-two-node-failover-e2e.ts --phase prepare --dir .goriq-stage-b/node-loss/mac-to-zbook --origin macbook --target zbook --sha "$GITHUB_SHA" --lease-ms 5000
      - uses: actions/upload-artifact@v4
        with:
          name: goriq-stage-b-node-loss-mac-handoff
          path: .goriq-stage-b/node-loss/mac-to-zbook/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Drop MacBook listener and arm watchdog recovery
        shell: bash
        run: |
          set -euo pipefail
          STATE_ROOT="$HOME/Library/Application Support/GAIWorker"
          mkdir -p "$STATE_ROOT"
          RUN_ID="$GITHUB_RUN_ID"
          LOSS_FILE="$STATE_ROOT/stage-b-node-loss-${RUN_ID}-macbook-loss.json"
          WATCHDOG="$STATE_ROOT/gai-macbook-watchdog.sh"
          HEALTH_STATE="$STATE_ROOT/macbook-runner-health.json"
          test -f "$WATCHDOG"
          printf '{"consecutiveFailures":2,"updatedAt":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >"$HEALTH_STATE"
          current_pid="$PPID"
          worker_pid=""
          old_pid=""
          for _ in $(seq 1 12); do
            [[ -n "$current_pid" && "$current_pid" != "0" ]] || break
            current_comm="$(ps -o comm= -p "$current_pid" | tr -d ' ' || true)"
            echo "Mac runner ancestry: pid=$current_pid comm=$(basename "$current_comm")"
            if [[ "$current_comm" == *"Runner.Worker"* ]]; then
              worker_pid="$current_pid"
              old_pid="$(ps -o ppid= -p "$worker_pid" | tr -d ' ')"
              break
            fi
            current_pid="$(ps -o ppid= -p "$current_pid" | tr -d ' ')"
          done
          test -n "$worker_pid"
          test -n "$old_pid"
          listener_comm="$(ps -o comm= -p "$old_pid" | tr -d ' ' || true)"
          old_started_at="$(ps -o lstart= -p "$old_pid" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' || true)"
          echo "Mac runner process discovery: workerPid=$worker_pid listenerPid=$old_pid listenerStartedAt=$old_started_at listenerComm=$(basename "$listener_comm")"
          if [[ "$old_pid" == "1" || "$old_pid" == "$worker_pid" || "$listener_comm" != *"Runner.Listener"* || -z "$old_started_at" ]]; then
            echo "Refusing unsafe listener target: pid=$old_pid comm=$(basename "$listener_comm")" >&2
            exit 3
          fi

          kill -9 "$old_pid"
          sleep 2
          if kill -0 "$old_pid" 2>/dev/null; then
            echo "MacBook Runner.Listener pid=$old_pid did not stop" >&2
            exit 2
          fi
          printf '{"version":1,"runId":"%s","node":"macbook","oldPid":%s,"oldStartedAt":"%s","lossObservedAt":"%s"}\n' "$RUN_ID" "$old_pid" "$old_started_at" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >"$LOSS_FILE"
          echo "MacBook Runner.Listener loss observed."

  zbook-survives-mac:
    name: ZBook continues while MacBook listener is down
    needs: mac-loss
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: goriq-stage-b-node-loss-mac-handoff
          path: .goriq-stage-b/node-loss/mac-to-zbook
      - name: Reclaim MacBook work on ZBook
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .goriq-stage-b\node-loss\evidence | Out-Null
          node scripts/goriq-two-node-failover-e2e.ts --phase resume --dir .goriq-stage-b/node-loss/mac-to-zbook --node zbook --sha "$env:GITHUB_SHA" --evidence .goriq-stage-b/node-loss/evidence/mac-to-zbook-survivor.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: goriq-stage-b-node-loss-mac-survivor
          path: .goriq-stage-b/node-loss/evidence/mac-to-zbook-survivor.json
          retention-days: 30
          if-no-files-found: error

  mac-rejoin:
    name: MacBook watchdog recovers and rejoins
    needs: zbook-survives-mac
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: goriq-stage-b-node-loss-mac-survivor
          path: .goriq-stage-b/node-loss/survivor
      - name: Verify MacBook recovery ordering
        shell: bash
        run: |
          set -euo pipefail
          STATE_ROOT="$HOME/Library/Application Support/GAIWorker"
          RUN_ID="$GITHUB_RUN_ID"
          RECOVERY_FILE="$STATE_ROOT/stage-b-node-loss-${RUN_ID}-macbook-recovery.json"
          mkdir -p .goriq-stage-b/node-loss/evidence
          current_pid="$PPID"
          worker_pid=""
          new_pid=""
          for _ in $(seq 1 12); do
            [[ -n "$current_pid" && "$current_pid" != "0" ]] || break
            current_comm="$(ps -o comm= -p "$current_pid" | tr -d ' ' || true)"
            echo "Mac rejoin ancestry: pid=$current_pid comm=$(basename "$current_comm")"
            if [[ "$current_comm" == *"Runner.Worker"* ]]; then
              worker_pid="$current_pid"
              new_pid="$(ps -o ppid= -p "$worker_pid" | tr -d ' ')"
              break
            fi
            current_pid="$(ps -o ppid= -p "$current_pid" | tr -d ' ')"
          done
          test -n "$worker_pid"
          test -n "$new_pid"
          listener_comm="$(ps -o comm= -p "$new_pid" | tr -d ' ' || true)"
          new_started_at="$(ps -o lstart= -p "$new_pid" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' || true)"
          [[ "$listener_comm" == *"Runner.Listener"* ]]
          [[ -n "$new_started_at" ]]
          echo "Mac rejoin process identity: workerPid=$worker_pid listenerPid=$new_pid listenerStartedAt=$new_started_at"
          active_workers=1
          LIVE_STATUS="$STATE_ROOT/stage-b-node-loss-${RUN_ID}-macbook-live-status.json"
          printf '{"workerId":"macbook","runnerHealthy":true,"runnerConnectionHealthy":false,"runnerProtectedByActiveJob":true,"activeRunnerWorkers":%s,"checkedAt":"%s"}\n' "$active_workers" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >"$LIVE_STATUS"
          printf '{"version":1,"runId":"%s","node":"macbook","newPid":%s,"newStartedAt":"%s","recoveredAt":"%s"}\n' "$RUN_ID" "$new_pid" "$new_started_at" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >"$RECOVERY_FILE"
          node scripts/goriq-node-loss-rejoin-e2e.mjs --phase rejoin --node macbook --platform darwin --sha "$GITHUB_SHA" --loss "$STATE_ROOT/stage-b-node-loss-${RUN_ID}-macbook-loss.json" --recovery "$RECOVERY_FILE" --status "$LIVE_STATUS" --survivor .goriq-stage-b/node-loss/survivor/mac-to-zbook-survivor.json --output .goriq-stage-b/node-loss/evidence/macbook-rejoin.json
          rm -f "$STATE_ROOT/stage-b-node-loss-${RUN_ID}-macbook-loss.json" "$RECOVERY_FILE" "$LIVE_STATUS"
      - uses: actions/upload-artifact@v4
        with:
          name: goriq-stage-b-node-loss-mac-rejoin
          path: .goriq-stage-b/node-loss/evidence/macbook-rejoin.json
          retention-days: 30
          if-no-files-found: error

  zbook-loss:
    name: ZBook loses runner listener
    needs: mac-rejoin
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Prepare ZBook-owned handoff tasks
        shell: powershell
        run: |
          Remove-Item -Recurse -Force .goriq-stage-b\node-loss\zbook-to-macbook -ErrorAction SilentlyContinue
          node scripts/goriq-two-node-failover-e2e.ts --phase prepare --dir .goriq-stage-b/node-loss/zbook-to-macbook --origin zbook --target macbook --sha "$env:GITHUB_SHA" --lease-ms 5000
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: goriq-stage-b-node-loss-zbook-handoff
          path: .goriq-stage-b/node-loss/zbook-to-macbook/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Drop ZBook listener and arm watchdog recovery
        shell: powershell
        run: |
          $stateRoot = Join-Path $env:LOCALAPPDATA 'GAIWorker'
          $runId = $env:GITHUB_RUN_ID
          $lossFile = Join-Path $stateRoot "stage-b-node-loss-$runId-zbook-loss.json"
          $watchdog = Join-Path $stateRoot 'gai-zbook-watchdog.ps1'
          $healthState = Join-Path $stateRoot 'zbook-runner-health.json'
          $old = Get-Process -Name 'Runner.Listener' -ErrorAction Stop | Select-Object -First 1
          $oldStartedAt = $old.StartTime.ToUniversalTime().ToString('o')
          if (-not (Test-Path $watchdog)) { throw "Missing watchdog: $watchdog" }
          [ordered]@{
            consecutiveFailures = 2
            updatedAt = (Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json | Set-Content -Encoding UTF8 $healthState

          Get-Process -Name 'Runner.Listener' -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          if (Get-Process -Name 'Runner.Listener' -ErrorAction SilentlyContinue) { throw 'ZBook Runner.Listener did not stop' }
          [ordered]@{ version = 1; runId = $runId; node = 'zbook'; oldPid = $old.Id; oldStartedAt = $oldStartedAt; lossObservedAt = (Get-Date).ToUniversalTime().ToString('o') } | ConvertTo-Json | Set-Content -Encoding UTF8 $lossFile
          Write-Host 'ZBook Runner.Listener loss observed.'

  mac-survives-zbook:
    name: MacBook continues while ZBook listener is down
    needs: zbook-loss
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: goriq-stage-b-node-loss-zbook-handoff
          path: .goriq-stage-b/node-loss/zbook-to-macbook
      - name: Reclaim ZBook work on MacBook
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .goriq-stage-b/node-loss/evidence
          node scripts/goriq-two-node-failover-e2e.ts --phase resume --dir .goriq-stage-b/node-loss/zbook-to-macbook --node macbook --sha "$GITHUB_SHA" --evidence .goriq-stage-b/node-loss/evidence/zbook-to-macbook-survivor.json
      - uses: actions/upload-artifact@v4
        with:
          name: goriq-stage-b-node-loss-zbook-survivor
          path: .goriq-stage-b/node-loss/evidence/zbook-to-macbook-survivor.json
          retention-days: 30
          if-no-files-found: error

  zbook-rejoin:
    name: ZBook watchdog recovers and rejoins
    needs: mac-survives-zbook
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: goriq-stage-b-node-loss-zbook-survivor
          path: .goriq-stage-b/node-loss/survivor
      - name: Verify ZBook recovery ordering
        shell: powershell
        run: |
          $stateRoot = Join-Path $env:LOCALAPPDATA 'GAIWorker'
          $runId = $env:GITHUB_RUN_ID
          $recoveryFile = Join-Path $stateRoot "stage-b-node-loss-$runId-zbook-recovery.json"
          New-Item -ItemType Directory -Force -Path .goriq-stage-b\node-loss\evidence | Out-Null
          $currentPid = $PID
          $workerProcess = $null
          for ($i = 0; $i -lt 12; $i++) {
            if ($currentPid -le 0) { break }
            $currentProcess = Get-CimInstance Win32_Process -Filter "ProcessId=$currentPid" -ErrorAction SilentlyContinue
            if (-not $currentProcess) { break }
            Write-Host "ZBook rejoin ancestry: pid=$currentPid name=$($currentProcess.Name)"
            if ($currentProcess.Name -eq 'Runner.Worker.exe') {
              $workerProcess = $currentProcess
              break
            }
            $currentPid = [int]$currentProcess.ParentProcessId
          }
          if (-not $workerProcess) { throw 'Current ZBook job ancestry does not contain Runner.Worker.exe' }
          $listenerProcess = Get-CimInstance Win32_Process -Filter "ProcessId=$($workerProcess.ParentProcessId)" -ErrorAction Stop
          if ($listenerProcess.Name -ne 'Runner.Listener.exe') { throw "Runner.Worker parent is not Runner.Listener.exe: $($listenerProcess.Name)" }
          $listener = Get-Process -Id $listenerProcess.ProcessId -ErrorAction Stop
          $liveStatus = Join-Path $stateRoot "stage-b-node-loss-$runId-zbook-live-status.json"
          [ordered]@{
            workerId = 'zbook'
            runnerHealthy = $true
            runnerConnectionHealthy = $false
            runnerProtectedByActiveJob = $true
            activeRunnerWorkers = 1
            checkedAt = (Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json | Set-Content -Encoding UTF8 $liveStatus
          $newStartedAt = $listener.StartTime.ToUniversalTime().ToString('o')
          Write-Host "ZBook rejoin process identity: listenerPid=$($listener.Id) listenerStartedAt=$newStartedAt"
          [ordered]@{ version = 1; runId = $runId; node = 'zbook'; newPid = $listener.Id; newStartedAt = $newStartedAt; recoveredAt = (Get-Date).ToUniversalTime().ToString('o') } | ConvertTo-Json | Set-Content -Encoding UTF8 $recoveryFile
          node scripts/goriq-node-loss-rejoin-e2e.mjs --phase rejoin --node zbook --platform win32 --sha "$env:GITHUB_SHA" --loss (Join-Path $stateRoot "stage-b-node-loss-$runId-zbook-loss.json") --recovery $recoveryFile --status $liveStatus --survivor .goriq-stage-b/node-loss/survivor/zbook-to-macbook-survivor.json --output .goriq-stage-b/node-loss/evidence/zbook-rejoin.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -Force (Join-Path $stateRoot "stage-b-node-loss-$runId-zbook-loss.json") -ErrorAction SilentlyContinue
          Remove-Item -Force $recoveryFile,$liveStatus -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: goriq-stage-b-node-loss-zbook-rejoin
          path: .goriq-stage-b/node-loss/evidence/zbook-rejoin.json
          retention-days: 30
          if-no-files-found: error

  verify:
    name: Verify physical node loss and rejoin evidence
    needs: zbook-rejoin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: goriq-stage-b-node-loss-mac-rejoin
          path: .goriq-stage-b/node-loss/mac-rejoin
      - uses: actions/download-artifact@v4
        with:
          name: goriq-stage-b-node-loss-zbook-rejoin
          path: .goriq-stage-b/node-loss/zbook-rejoin
      - name: Verify bidirectional physical runner loss and recovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .goriq-stage-b/node-loss/final
          node scripts/goriq-node-loss-rejoin-e2e.mjs --phase verify --mac .goriq-stage-b/node-loss/mac-rejoin/macbook-rejoin.json --zbook .goriq-stage-b/node-loss/zbook-rejoin/zbook-rejoin.json --sha "$GITHUB_SHA" --output .goriq-stage-b/node-loss/final/node-loss-rejoin-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: goriq-stage-b-node-loss-rejoin-evidence
          path: .goriq-stage-b/node-loss/final/node-loss-rejoin-evidence.json
          retention-days: 30
          if-no-files-found: error
