name: ZBook E2E Dispatcher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zbook-e2e-dispatcher.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  reserve-mac-and-dispatch:
    name: Reserve MacBook and dispatch ZBook target
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    steps:
      - name: Dispatch forced ZBook E2E
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/zbook-e2e-target.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Forced ZBook E2E dispatched while MacBook is reserved."
      - name: Hold MacBook so generic self-hosted dispatch lands on ZBook
        shell: bash
        run: sleep 180
