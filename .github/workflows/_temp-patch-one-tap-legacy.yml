name: TEMP patch JARVIS one-tap legacy compatibility

on:
  push:
    branches: [fix/jarvis-one-tap-legacy-worker]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jarvis-one-tap-legacy-worker
      - name: Patch broker compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          broker = Path('scripts/jarvis-broker.ts')
          text = broker.read_text()
          old = 'const deepLink = `jarvis://enroll?broker=${encodeURIComponent(publicBrokerUrl)}&grant=${encodeURIComponent(grant)}`;'
          new = 'const deepLink = `jarvis://enroll?broker=${encodeURIComponent(publicBrokerUrl)}&grant=${encodeURIComponent(grant)}&token=${encodeURIComponent(grant)}`;'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('deepLink target not found')

          old2 = '''    let tokenValue = typeof payload.token === "string" ? payload.token : "";\n    if (!tokenValue && typeof payload.grant === "string") {\n      const grant = resolveEnrollmentGrant(payload.grant);\n      if (!grant) return json(response, 410, { message: "expired or invalid enrollment link" });\n      tokenValue = grant.token;\n    }'''
          new2 = '''    let tokenValue = "";\n    if (typeof payload.grant === "string" && payload.grant) {\n      const grant = resolveEnrollmentGrant(payload.grant);\n      if (!grant) return json(response, 410, { message: "expired or invalid enrollment link" });\n      tokenValue = grant.token;\n    } else if (typeof payload.token === "string" && payload.token) {\n      const legacyGrant = resolveEnrollmentGrant(payload.token);\n      tokenValue = legacyGrant?.token ?? payload.token;\n    }'''
          if old2 in text:
              text = text.replace(old2, new2, 1)
          elif new2 not in text:
              raise SystemExit('enroll credential target not found')
          broker.write_text(text)
          PY
      - name: Commit broker patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Already patched'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/jarvis-broker.ts
          git commit -m 'fix: support one-tap enrollment from legacy Worker'
          git push origin HEAD:fix/jarvis-one-tap-legacy-worker
