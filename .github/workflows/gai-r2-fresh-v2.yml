name: GAI R2 Fresh Heldout v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gai-r2-fresh-v2.yml"
      - "benchmarks/internal/r2_v2/**"
      - "scripts/gai-r2-fresh-v2.mjs"
      - "src/gai/model-output-normalizer.ts"
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gai-r2-fresh-v2
  cancel-in-progress: false

jobs:
  route:
    name: Hosted R2 v2 capability router
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      target: ${{ steps.route.outputs.target }}
      state: ${{ steps.route.outputs.state }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - name: Choose fastest available zero-cost worker
        id: route
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .gai-results
          already=0
          while IFS= read -r run_id; do
            [ -z "$run_id" ] && continue
            count="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --jq '[.artifacts[] | select(.expired == false and .name == "gai-baseline-zbook")] | length' 2>/dev/null || echo 0)"
            if [ "${count:-0}" -gt 0 ]; then already=1; break; fi
          done < <(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/gai-r2-fresh-v2.yml/runs?status=success&per_page=20" --jq '.workflow_runs[].id' 2>/dev/null || true)
          target=hosted; state=RUNNABLE
          if [ "$already" -eq 1 ]; then target=none; state=ALREADY_EXECUTED
          else
            active="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/gai-r2-fresh-v2.yml/runs?per_page=50" --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID} and (.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"pending\"))] | length" 2>/dev/null || echo 0)"
            if [ "${active:-0}" -gt 0 ]; then target=none; state=EXPERIMENT_IN_PROGRESS
            else
              runners="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100" 2>/dev/null || printf '{"runners":[]}')"
              # Prefer ZBook GPU-capable worker, then Apple Silicon, then free hosted CPU.
              zbook="$(printf '%s' "$runners" | jq -r '[.runners[] | select((.name|ascii_downcase)=="zbook" and .status=="online" and (.busy|not))] | length')"
              mac="$(printf '%s' "$runners" | jq -r '[.runners[] | select((.name|ascii_downcase)=="macbook" and .status=="online" and (.busy|not))] | length')"
              if [ "$zbook" -gt 0 ]; then target=zbook; elif [ "$mac" -gt 0 ]; then target=macbook; fi
            fi
          fi
          printf 'target=%s\nstate=%s\n' "$target" "$state" >> "$GITHUB_OUTPUT"
          printf '{"schemaVersion":4,"stage":"R2-v2","target":"%s","state":"%s","fallbackOrder":["zbook-gpu","macbook-apple-silicon","github-hosted-cpu"],"modelWarm":true,"checkpointResume":true,"checkedAt":"%s"}\n' "$target" "$state" "$(date -u +%FT%TZ)" > .gai-results/r2-v2-route.json
      - run: node --test tests/r2-fresh-v2.test.ts
      - uses: actions/upload-artifact@v4
        with: { name: gai-r2-v2-route-status, path: .gai-results/r2-v2-route.json, retention-days: 30 }

  zbook:
    needs: route
    if: needs.route.outputs.target == 'zbook'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    env: { GAI_LOCAL_MODEL_ENDPOINT: 'http://127.0.0.1:11434', GAI_LOCAL_MODEL_NAME: 'qwen3:4b' }
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - name: Ensure and warm Ollama on GPU worker
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          try { Invoke-RestMethod -Uri "$($env:GAI_LOCAL_MODEL_ENDPOINT)/api/tags" -TimeoutSec 5 | Out-Null } catch { $o=Get-Command ollama -ErrorAction SilentlyContinue; if(-not $o){$exe=Join-Path $env:LOCALAPPDATA 'Programs\Ollama\ollama.exe'}else{$exe=$o.Source}; if(-not(Test-Path $exe)){throw 'Ollama unavailable'}; Start-Process $exe -ArgumentList 'serve' -WindowStyle Hidden; for($i=0;$i -lt 30;$i++){Start-Sleep 2;try{Invoke-RestMethod -Uri "$($env:GAI_LOCAL_MODEL_ENDPOINT)/api/tags" -TimeoutSec 5|Out-Null;break}catch{}} }
          ollama pull $env:GAI_LOCAL_MODEL_NAME
          $body=@{model=$env:GAI_LOCAL_MODEL_NAME;prompt='warmup';stream=$false;keep_alive='30m';options=@{num_predict=1}}|ConvertTo-Json -Depth 4
          Invoke-RestMethod -Uri "$($env:GAI_LOCAL_MODEL_ENDPOINT)/api/generate" -Method Post -ContentType 'application/json' -Body $body | Out-Null
      - name: Safety regression gate
        shell: powershell
        run: node --test tests/approval-key.test.ts tests/approval-readiness.test.ts tests/auto-merge-policy.test.ts tests/bounded-runner.test.ts tests/autonomy-capabilities.test.ts
      - shell: powershell
        run: '"R2_SAFETY_VERIFIED=1" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append'
      - name: Execute resumable fresh campaign
        shell: powershell
        run: node scripts/gai-r2-fresh-v2.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: gai-baseline-zbook, path: .gai-results/, include-hidden-files: true, retention-days: 90 }

  macbook:
    needs: route
    if: needs.route.outputs.target == 'macbook'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 180
    env: { GAI_LOCAL_MODEL_ENDPOINT: 'http://127.0.0.1:11434', GAI_LOCAL_MODEL_NAME: 'qwen3:4b' }
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - name: Ensure and warm zero-cost Ollama
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ollama >/dev/null 2>&1; then command -v brew >/dev/null && brew install ollama || exit 3; fi
          curl -fsS "$GAI_LOCAL_MODEL_ENDPOINT/api/tags" >/dev/null 2>&1 || (nohup ollama serve >/tmp/gai-ollama.log 2>&1 &)
          for _ in $(seq 1 30); do sleep 2; curl -fsS "$GAI_LOCAL_MODEL_ENDPOINT/api/tags" >/dev/null 2>&1 && break; done
          ollama pull "$GAI_LOCAL_MODEL_NAME"
          curl -fsS "$GAI_LOCAL_MODEL_ENDPOINT/api/generate" -H 'content-type: application/json' -d "{\"model\":\"$GAI_LOCAL_MODEL_NAME\",\"prompt\":\"warmup\",\"stream\":false,\"keep_alive\":\"30m\",\"options\":{\"num_predict\":1}}" >/dev/null
      - name: Safety regression gate
        run: node --test tests/approval-key.test.ts tests/approval-readiness.test.ts tests/auto-merge-policy.test.ts tests/bounded-runner.test.ts tests/autonomy-capabilities.test.ts
      - run: echo 'R2_SAFETY_VERIFIED=1' >> "$GITHUB_ENV"
      - run: node scripts/gai-r2-fresh-v2.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: gai-baseline-zbook, path: .gai-results/, include-hidden-files: true, retention-days: 90 }

  hosted:
    needs: route
    if: needs.route.outputs.target == 'hosted'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env: { GAI_LOCAL_MODEL_ENDPOINT: 'http://127.0.0.1:11434', GAI_LOCAL_MODEL_NAME: 'qwen3:4b' }
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - name: Install, start and warm zero-cost Ollama
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/gai-ollama.log 2>&1 &
          for _ in $(seq 1 45); do sleep 2; curl -fsS "$GAI_LOCAL_MODEL_ENDPOINT/api/tags" >/dev/null 2>&1 && break; done
          curl -fsS "$GAI_LOCAL_MODEL_ENDPOINT/api/tags" >/dev/null
          ollama pull "$GAI_LOCAL_MODEL_NAME"
          curl -fsS "$GAI_LOCAL_MODEL_ENDPOINT/api/generate" -H 'content-type: application/json' -d "{\"model\":\"$GAI_LOCAL_MODEL_NAME\",\"prompt\":\"warmup\",\"stream\":false,\"keep_alive\":\"30m\",\"options\":{\"num_predict\":1}}" >/dev/null
      - name: Safety regression gate
        run: node --test tests/approval-key.test.ts tests/approval-readiness.test.ts tests/auto-merge-policy.test.ts tests/bounded-runner.test.ts tests/autonomy-capabilities.test.ts
      - run: echo 'R2_SAFETY_VERIFIED=1' >> "$GITHUB_ENV"
      - run: node scripts/gai-r2-fresh-v2.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: gai-baseline-zbook, path: .gai-results/, include-hidden-files: true, retention-days: 90 }
