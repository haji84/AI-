name: GAI Worker Persistence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gai-worker-persistence.yml'
      - 'scripts/gai-zbook-watchdog.ps1'
      - 'scripts/gai-zbook-launcher-file.ps1'
      - 'scripts/install-zbook-persistence.ps1'
      - 'scripts/gai-macbook-watchdog.sh'
      - 'scripts/install-macbook-persistence.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gai-worker-persistence
  cancel-in-progress: true

jobs:
  zbook-persistence:
    name: Install ZBook persistent worker
    env:
      SYNC_COMMIT_SHA: ${{ github.sha }}
      PERSISTENCE_TARGET: zbook
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Authorize exact production mutation
        id: authorization
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { appendFile } = await import('node:fs/promises');
          const env = process.env;
          const repository = env.GITHUB_REPOSITORY;
          const sha = env.SYNC_COMMIT_SHA;
          const output = env.GITHUB_OUTPUT;
          async function deny(reason) {
            if (output) {
              await appendFile(output, 'authorized=false\n');
            }
            if (env.GITHUB_STEP_SUMMARY) {
              await appendFile(env.GITHUB_STEP_SUMMARY, `Production authorization denied: ${reason}. No production mutation authorized.\n`);
            }
            throw new Error(`PRODUCTION_AUTHORIZATION_${reason}`);
          }
          if (repository !== 'haji84/AI-' || env.GITHUB_REPOSITORY_OWNER !== 'haji84' ||
              env.GITHUB_REF !== 'refs/heads/main' || !/^[a-f0-9]{40}$/.test(sha ?? '') || !output || !['zbook','macbook'].includes(env.PERSISTENCE_TARGET) ||
              !['push', 'schedule', 'workflow_dispatch', 'workflow_run'].includes(env.GITHUB_EVENT_NAME)) {
            await deny('CONTEXT');
          }
          async function get(path) {
            try {
              // Existing public metadata capability; no token or permission expansion.
              const response = await fetch(`https://api.github.com/repos/${repository}/${path}`, {
                headers: { Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
                signal: AbortSignal.timeout(15000), redirect: 'error',
              });
              if (!response.ok) throw new Error('unavailable');
              return await response.json();
            } catch { return deny('METADATA_UNAVAILABLE'); }
          }
          if ((await get('git/ref/heads/main'))?.object?.sha !== sha) await deny('STALE_MAIN');
          const runs = await get(`actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=${sha}&per_page=100`);
          const ci = Array.isArray(runs?.workflow_runs) ? runs.workflow_runs[0] : null;
          if (!ci || ci.name !== 'CI' || ci.path !== '.github/workflows/ci.yml' || ci.event !== 'push' ||
              ci.head_branch !== 'main' || ci.head_sha !== sha || ci.status !== 'completed' || ci.conclusion !== 'success') {
            await deny('EXACT_MAIN_CI_REQUIRED');
          }
          const pulls = await get(`commits/${sha}/pulls`);
          const pr = Array.isArray(pulls) ? pulls.find(candidate => candidate?.merged_at &&
            candidate?.base?.ref === 'main' && candidate?.base?.repo?.full_name === repository && candidate?.merge_commit_sha === sha) : null;
          if (!pr) await deny('MERGED_PR_REQUIRED');
          const body = typeof pr.body === 'string' ? pr.body : '';
          const scopeMatch = body.match(/<!--\s*ai-company-task-scope:\s*issue:(\d+)\s*-->/i);
          const approved = /<!--\s*ai-company-production-deploy:\s*approved\s*-->/i.test(body);
          const expiryMatch = body.match(/<!--\s*ai-company-task-authorization-expires-at:\s*([^>]+?)\s*-->/i);
          if (!scopeMatch || !approved || !expiryMatch) await deny('TASK_SCOPE_REQUIRED');
          const issueNumber = Number(scopeMatch[1]);
          const expiresAt = Date.parse(expiryMatch[1].trim());
          if (!Number.isSafeInteger(issueNumber) || issueNumber < 1 || !Number.isFinite(expiresAt) || expiresAt <= Date.now()) await deny('EXPIRED_OR_INVALID');
          const issue = await get(`issues/${issueNumber}`);
          const issueBody = typeof issue?.body === 'string' ? issue.body : '';
          const ownerCommandMatch = issueBody.match(/## Owner command\s*\n([\s\S]*?)(?:\n\n##|\n## Execution contract|$)/i);
          const ownerCommand = ownerCommandMatch?.[1]?.trim() || '';
          // Keep the existing Scoped Production Deploy completion contract unchanged.
          const completionInstruction = /(最後まで.{0,12}(進め|やって|任せ)|完了まで.{0,12}(進め|やって|任せ)|完成.{0,12}(させ|まで|して|させて)|全部.{0,12}(進め|やって|任せ)|任せる|finish\s+(it|this|the\s+task)|take\s+it\s+to\s+completion|handle.{0,20}(through|to)\s+(the\s+)?end)/iu.test(ownerCommand);
          const persistedApproval = /production-deploy-authorized:\s*true/i.test(issueBody);
          if (issue?.number !== issueNumber || issue?.pull_request || issue?.user?.login !== env.GITHUB_REPOSITORY_OWNER || !persistedApproval || !completionInstruction) await deny('OWNER_COMPLETION_REQUIRED');
          // A task completion grant for one PC cannot authorize the other PC.
          if (!body.includes('<!-- ai-company-worker-persistence-target: '+env.PERSISTENCE_TARGET+' -->') ||
              !new RegExp('worker-persistence-'+env.PERSISTENCE_TARGET+'-authorized:\\s*true','i').test(issueBody)) {
            await deny('PERSISTENCE_TARGET_REQUIRED');
          }
          // Recheck after metadata lookup; never grant an expired or superseded source.
          if ((await get('git/ref/heads/main'))?.object?.sha !== sha) await deny('STALE_MAIN');
          if (expiresAt <= Date.now()) await deny('EXPIRED_OR_INVALID');
          // Reserve more than the entire 15-minute job lifetime, including setup.
          if (expiresAt - Date.now() < 21 * 60 * 1000) await deny('INSUFFICIENT_AUTHORIZATION_WINDOW');
          await appendFile(output, `authorized=true\nissue_number=${issueNumber}\ndeploy_sha=${sha}\nexpires_at=${new Date(expiresAt).toISOString()}\n`);
          if (env.GITHUB_STEP_SUMMARY) {
            await appendFile(env.GITHUB_STEP_SUMMARY, `Production authorization PASS: issue #${issueNumber}, exact main ${sha}.\n`);
          }
          console.log('Exact main CI and task-scoped completion authorization verified.');
          NODE

      - uses: actions/checkout@v5
      - name: Install logon auto-start and watchdog
        env:
          WORKER_PERSISTENCE_EXPIRES_AT: ${{ steps.authorization.outputs.expires_at }}
        shell: powershell
        run: |
          if ([datetimeoffset]::UtcNow -ge [datetimeoffset]::Parse($env:WORKER_PERSISTENCE_EXPIRES_AT)) { throw 'PERSISTENCE_AUTHORIZATION_EXPIRED' }
          .\scripts\install-zbook-persistence.ps1 -RunnerRoot 'C:\actions-runner' -OllamaEndpoint 'http://127.0.0.1:11434'
      - name: Capture ZBook persistence evidence
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .gai-results | Out-Null
          Copy-Item "$env:LOCALAPPDATA\GAIWorker\zbook-persistence.json" .gai-results\ -Force
          Copy-Item "$env:LOCALAPPDATA\GAIWorker\zbook-watchdog-status.json" .gai-results\ -Force
      - name: Upload ZBook persistence evidence
        uses: actions/upload-artifact@v4
        with:
          name: gai-zbook-persistence
          path: .gai-results/
          include-hidden-files: true
          retention-days: 30

  macbook-persistence:
    name: Install MacBook persistent worker
    env:
      SYNC_COMMIT_SHA: ${{ github.sha }}
      PERSISTENCE_TARGET: macbook
    runs-on: [self-hosted, macbook]
    timeout-minutes: 15
    steps:
      - name: Authorize exact production mutation
        id: authorization
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { appendFile } = await import('node:fs/promises');
          const env = process.env;
          const repository = env.GITHUB_REPOSITORY;
          const sha = env.SYNC_COMMIT_SHA;
          const output = env.GITHUB_OUTPUT;
          async function deny(reason) {
            if (output) {
              await appendFile(output, 'authorized=false\n');
            }
            if (env.GITHUB_STEP_SUMMARY) {
              await appendFile(env.GITHUB_STEP_SUMMARY, `Production authorization denied: ${reason}. No production mutation authorized.\n`);
            }
            throw new Error(`PRODUCTION_AUTHORIZATION_${reason}`);
          }
          if (repository !== 'haji84/AI-' || env.GITHUB_REPOSITORY_OWNER !== 'haji84' ||
              env.GITHUB_REF !== 'refs/heads/main' || !/^[a-f0-9]{40}$/.test(sha ?? '') || !output || !['zbook','macbook'].includes(env.PERSISTENCE_TARGET) ||
              !['push', 'schedule', 'workflow_dispatch', 'workflow_run'].includes(env.GITHUB_EVENT_NAME)) {
            await deny('CONTEXT');
          }
          async function get(path) {
            try {
              // Existing public metadata capability; no token or permission expansion.
              const response = await fetch(`https://api.github.com/repos/${repository}/${path}`, {
                headers: { Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
                signal: AbortSignal.timeout(15000), redirect: 'error',
              });
              if (!response.ok) throw new Error('unavailable');
              return await response.json();
            } catch { return deny('METADATA_UNAVAILABLE'); }
          }
          if ((await get('git/ref/heads/main'))?.object?.sha !== sha) await deny('STALE_MAIN');
          const runs = await get(`actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=${sha}&per_page=100`);
          const ci = Array.isArray(runs?.workflow_runs) ? runs.workflow_runs[0] : null;
          if (!ci || ci.name !== 'CI' || ci.path !== '.github/workflows/ci.yml' || ci.event !== 'push' ||
              ci.head_branch !== 'main' || ci.head_sha !== sha || ci.status !== 'completed' || ci.conclusion !== 'success') {
            await deny('EXACT_MAIN_CI_REQUIRED');
          }
          const pulls = await get(`commits/${sha}/pulls`);
          const pr = Array.isArray(pulls) ? pulls.find(candidate => candidate?.merged_at &&
            candidate?.base?.ref === 'main' && candidate?.base?.repo?.full_name === repository && candidate?.merge_commit_sha === sha) : null;
          if (!pr) await deny('MERGED_PR_REQUIRED');
          const body = typeof pr.body === 'string' ? pr.body : '';
          const scopeMatch = body.match(/<!--\s*ai-company-task-scope:\s*issue:(\d+)\s*-->/i);
          const approved = /<!--\s*ai-company-production-deploy:\s*approved\s*-->/i.test(body);
          const expiryMatch = body.match(/<!--\s*ai-company-task-authorization-expires-at:\s*([^>]+?)\s*-->/i);
          if (!scopeMatch || !approved || !expiryMatch) await deny('TASK_SCOPE_REQUIRED');
          const issueNumber = Number(scopeMatch[1]);
          const expiresAt = Date.parse(expiryMatch[1].trim());
          if (!Number.isSafeInteger(issueNumber) || issueNumber < 1 || !Number.isFinite(expiresAt) || expiresAt <= Date.now()) await deny('EXPIRED_OR_INVALID');
          const issue = await get(`issues/${issueNumber}`);
          const issueBody = typeof issue?.body === 'string' ? issue.body : '';
          const ownerCommandMatch = issueBody.match(/## Owner command\s*\n([\s\S]*?)(?:\n\n##|\n## Execution contract|$)/i);
          const ownerCommand = ownerCommandMatch?.[1]?.trim() || '';
          // Keep the existing Scoped Production Deploy completion contract unchanged.
          const completionInstruction = /(最後まで.{0,12}(進め|やって|任せ)|完了まで.{0,12}(進め|やって|任せ)|完成.{0,12}(させ|まで|して|させて)|全部.{0,12}(進め|やって|任せ)|任せる|finish\s+(it|this|the\s+task)|take\s+it\s+to\s+completion|handle.{0,20}(through|to)\s+(the\s+)?end)/iu.test(ownerCommand);
          const persistedApproval = /production-deploy-authorized:\s*true/i.test(issueBody);
          if (issue?.number !== issueNumber || issue?.pull_request || issue?.user?.login !== env.GITHUB_REPOSITORY_OWNER || !persistedApproval || !completionInstruction) await deny('OWNER_COMPLETION_REQUIRED');
          // A task completion grant for one PC cannot authorize the other PC.
          if (!body.includes('<!-- ai-company-worker-persistence-target: '+env.PERSISTENCE_TARGET+' -->') ||
              !new RegExp('worker-persistence-'+env.PERSISTENCE_TARGET+'-authorized:\\s*true','i').test(issueBody)) {
