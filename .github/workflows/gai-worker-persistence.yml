          // Reserve more than the entire 15-minute job lifetime, including setup.
          if (expiresAt - Date.now() < 21 * 60 * 1000) await deny('INSUFFICIENT_AUTHORIZATION_WINDOW');
          await appendFile(output, `authorized=true\nissue_number=${issueNumber}\ndeploy_sha=${sha}\nexpires_at=${new Date(expiresAt).toISOString()}\n`);
          if (env.GITHUB_STEP_SUMMARY) {
            await appendFile(env.GITHUB_STEP_SUMMARY, `Production authorization PASS: issue #${issueNumber}, exact main ${sha}.\n`);
          }
          console.log('Exact main CI and task-scoped completion authorization verified.');
          NODE

      - uses: actions/checkout@v5
      - name: Install launchd watchdog
        env:
          WORKER_PERSISTENCE_EXPIRES_AT: ${{ steps.authorization.outputs.expires_at }}
        shell: bash
        run: |
          node -e 'const expiry=Date.parse(process.env.WORKER_PERSISTENCE_EXPIRES_AT); if(!Number.isFinite(expiry)||Date.now()>=expiry) throw Error("PERSISTENCE_AUTHORIZATION_EXPIRED")'
          chmod +x scripts/gai-macbook-watchdog.sh scripts/install-macbook-persistence.sh
          GAI_RUNNER_ROOT="$HOME/actions-runner" GAI_LOCAL_MODEL_ENDPOINT='http://127.0.0.1:11434' ./scripts/install-macbook-persistence.sh
      - name: Capture MacBook persistence evidence
        shell: bash
        run: |
          mkdir -p .gai-results
          cp "$HOME/Library/Application Support/GAIWorker/macbook-persistence.json" .gai-results/
          cp "$HOME/Library/Application Support/GAIWorker/macbook-watchdog-status.json" .gai-results/
      - name: Upload MacBook persistence evidence
        uses: actions/upload-artifact@v4
        with:
          name: gai-macbook-persistence
          path: .gai-results/
          include-hidden-files: true
          retention-days: 30
