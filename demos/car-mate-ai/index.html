-size:11px}.safe span{color:#7e8892;font-size:9px;margin-top:4px;line-height:1.5}.page{max-width:720px;margin:auto;padding:28px 18px 110px}.back{background:none;border:0;color:#9ca5af;padding:0 0 22px}.head{display:flex;gap:13px;align-items:center;margin-bottom:22px}.orb{width:48px;height:48px;border-radius:14px;background:#5cfe9c;color:#071009;display:grid;place-items:center;font-size:20px}.head small{color:#5cfe9c;letter-spacing:1.2px}.head h1{font-size:28px;margin:3px 0}.head p{font-size:10px;color:#77818b;margin:0}.bubble{background:#141a20;border:1px solid #242c35;padding:15px;border-radius:4px 17px 17px;color:#d7dde3;font-size:12px;line-height:1.7}.upload{height:95px;border:1px dashed #3b4a42;border-radius:13px;margin:14px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#5cfe9c}.upload b{font-size:11px;color:#cbd2d8}.upload span{font-size:8px;color:#68727d;margin-top:4px}.page textarea{width:100%;height:120px;background:#090c0f;border:1px solid #252c34;border-radius:12px;color:#fff;padding:12px;resize:none;margin-bottom:10px}.result,.reserve,.done,.vehicle{background:#101419;border:1px solid #212933;border-radius:20px;padding:20px}.rtop{display:flex;gap:10px;align-items:center;border-bottom:1px solid #20262d;padding-bottom:14px}.rtop .grow{flex:1}.rtop small{color:#77818b}.rtop h2{font-size:18px;margin:2px 0}.tag{font-size:8px;background:#332b12;color:#ffd166;border-radius:8px;padding:5px 7px}.result>p{color:#aab3bc;font-size:12px;line-height:1.8}.checks{background:#0b0f13;padding:13px;border-radius:12px;color:#8f99a3;font-size:11px;line-height:1.8}.checks b{display:block;color:#e1e5e9}.price{margin:12px 0;background:#102119;padding:13px;border-radius:12px;color:#98a79e;font-size:10px;line-height:1.6}.price b{display:block;color:#dce3de}.warn{color:#d4aa57;font-size:8px;line-height:1.5;margin:11px 0}.miniVisual{display:grid;grid-template-columns:1fr 28px 1fr;align-items:center;gap:7px;margin:12px 0}.mv{height:110px;border:1px solid #2a333c;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center}.mv .miniCar{font-size:42px;filter:grayscale(1)}.mv.after .miniCar{transform:translateY(8px)}.mv small{color:#6f7982}.mv b{font-size:8px;color:#5cfe9c}.shop{display:flex;gap:11px;align-items:center;padding-bottom:16px;border-bottom:1px solid #252c33}.shopIcon{width:45px;height:45px;background:#17231c;border-radius:13px;display:grid;place-items:center}.shop b,.shop span{display:block}.shop span{font-size:8px;color:#75808a;margin-top:4px}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.slots button{padding:11px;background:#0b0f13;color:#ddd;border:1px solid #2b333b;border-radius:9px}.slots button.sel{border-color:#5cfe9c;color:#5cfe9c}.sendInfo{background:#0b0f13;border-radius:11px;padding:12px;margin:14px 0;font-size:9px;color:#78828c}.done{text-align:center;padding:40px 20px}.done .big{font-size:50px}.done p{color:#8c959f;font-size:11px}.vehicle{display:grid;grid-template-columns:160px 1fr;gap:18px;align-items:center}.vArt{height:120px;background:radial-gradient(circle,#214632,#0b0f13 70%);border-radius:14px;display:grid;place-items:center;font-size:55px;filter:grayscale(1)}.chips{display:flex;gap:5px;flex-wrap:wrap}.chips span{font-size:8px;color:#5cfe9c;background:#142219;border-radius:7px;padding:5px 6px}.list>div{background:#0f1318;border:1px solid #1e252c;border-radius:12px;padding:13px;margin-top:8px}.list b,.list span{display:block}.list b{font-size:10px}.list span{font-size:8px;color:#75808a;margin-top:4px}.nav{display:none}@media(max-width:700px){.app{padding-bottom:78px}header{height:62px}.brand span{display:none}.garage{font-size:0}.garage:after{content:"🚗";font-size:16px}.hero{display:block;min-height:0;padding:22px 18px}.carArt{height:170px}.carEmoji{font-size:72px}.hero h1{font-size:34px}.grid{grid-template-columns:1fr}.show{margin:8px 13px 18px;padding:24px 18px;display:block}.compare{margin-top:22px}.scene{height:135px}.damage{margin:13px;padding:23px 18px}.steps{grid-template-columns:1fr 1fr}.safe{margin:13px}.nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:68px;background:#0b0e12ee;border-top:1px solid #20262d;z-index:30;justify-content:space-around;padding-bottom:max(5px,env(safe-area-inset-bottom))}.nav button{width:25%;background:none;border:0;color:#68717c;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:8px;gap:3px}.nav button.active,.nav button.ai{color:#5cfe9c}.vehicle{grid-template-columns:1fr}.slots{grid-template-columns:1fr}.head h1{font-size:24px}}</style></head><body><div id="root"></div><script>const state={view:'home',type:null,sent:false,slot:null,done:false};const data={chat:{name:'AIカー相談',q:'低速で右前からコツコツ音がして、ブレーキを踏むと消れる',title:'右前の異音について',level:'早めの点検を推奨',body:'「速度に合わせてコツコツ」「ブレーキを踏むと消える」という条件から、ブレーキ周辺や回転部を優先して確認したい症状です。現時点では原因の断定はできません。',checks:['ホイール・タイヤ周辺の接触跡','ブレーキパッド・シム・キャリパー周辺','ハブや回転部のガタ・異音'],price:'参考価格帯：点検 0〜5,000円 / 部品交換が必要な場合は内容により変動'},custom:{name:'カスタム相談',q:'ローダウンしてタイヤがフェンダーに当たる。どうしたらいい？',title:'ローダウン時の干渉相談',level:'条件確認が必要',body:'ローダウンでフェンダー干渉が出る場合、車高だけでなくタイヤ外径、リム幅、インセット、キャンバー、フェンダー形状の組み合わせで原因が変わります。',checks:['現在のタイヤサイズとホイールサイズ','どの場面で当たるか（直進/旋回/段差）','フェンダー内側か外側かの接触位置'],price:'対策候補：車高調整 / タイヤサイズ見直し / ホイール条件見直し / アライメント確認'},parts:{name:'パーツ適合チェック',q:'この車高調を入れたらどう変わる？',title:'パーツ適合チェック',level:'型式・品番確認が必要',body:'車両型式とパーツ品番を照合して、メーカー適合情報を確認します。装着できても、車高・乗り心地・保安基準・他部品との干渉は別確認が必要です。',checks:['車両型式・年式・グレード','商品メーカーと正確な品番','現在の足回り・ホイール仕様'],price:'適合確認後に、取付費込みの相談へ進めます'},body:{name:'鈑金・塗装相談',q:'左リアドアを擦った。修理方法とだいたいの金額を知りたい',title:'キズ・へこみの事前チェック',level:'写真見積向き',body:'外観写真から見える範囲では、擦り傷・塗膜損傷・パネル変形の有無を整理できます。内部損傷やセンサー類は現車確認が必要です。',checks:['損傷全体が分かる引き写真','キズの深さが分かる近接写真','別角度からの写真'],price:'参考価格帯：磨き数千円〜 / 部分補修1〜5万円前後 / 鈑金塗装は損傷範囲で変動'}};function go(v){state.view=v;state.type=null;state.sent=false;state.done=false;render();scrollTo(0,0)}function consult(t){state.type=t;state.sent=false;state.view='consult';render();scrollTo(0,0)}function reserve(){state.view='reserve';state.slot=null;render();scrollTo(0,0)}function nav(){return `<div class="nav"><button class="${state.view==='home'?'active':''}" onclick="go('home')">⌂<span>ホーム</span></button><button class="ai" onclick="consult('chat')">✦<span>AI相談</span></button><button class="${state.view==='history'?'active':''}" onclick="go('history')">↻<span>履歴</span></button><button class="${state.view==='car'?'active':''}" onclick="go('car')">♙<span>マイカー</span></button></div>`}function home(){return `<header><div class="brand"><div class="logo">🚘</div><div><b>CAR MATE <i>AI</i></b><span>あなた専用 AIカーコンシェルジュ</span></div></div><button class="garage" onclick="go('car')">🚗 マイカー</button></header><section class="hero"><div class="carArt"><div class="carEmoji">🚙</div><small>MY CAR</small></div><div><span class="status">● 登録済み</span><h1>愛車のこと、<br><em>なんでもAIに。</em></h1><p>故障も、カスタムも、パーツも。<br>相談からお店の予約までスマホひとつ。</p><div class="spec"><b>NISSAN ROOX</b><span>2021 / 58,240 km</span></div></div></section><section class="section"><h3>今日はどうしましたか？</h3><div class="grid"><button class="card" onclick="consult('chat')"><div class="ico">💬</div><div><b>AIに車のことを相談</b><span>異音・警告灯・メンテナンスなど</span><small>24時間相談OK</small></div></button><button class="card" onclick="consult('custom')"><div class="ico">🔧</div><div><b>カスタム相談</b><span>車高・ホイール・エアロ・足回り</span><small>変更後イメージ</small></div></button><button class="card" onclick="consult('parts')"><div class="ico">🔍</div><div><b>パーツ適合チェック</b><span>写真・URL・型番から確認</span><small>取付相談まで</small></div></button><button class="card" onclick="consult('body')"><div class="ico">🎨</div><div><b>キズ・へこみ・塗装</b><span>写真から損傷を整理して概算</span><small>修理後イメージ</small></div></button></div></section><section class="show"><div><span class="eyebrow">✦ AI CUSTOM VISUAL</span><h2>変える前に、<br>未来の愛車を見る。</h2><p>車高・ホイール・ボディカラーなど、変更後のイメージを比較。見た目のシミュレーションと実際の適合判定は分けて確認します。</p><button class="primary" onclick="consult('custom')">カスタムを試す →</button></div><div class="compare"><div class="scene"><span>BEFORE</span><div class="miniCar">🚙</div><small>純正仕様</small></div><b>↻</b><div class="scene after"><span>AFTER</span><div class="miniCar">🚙</div><small>−30mm / 18inch</small></div></div></section><section class="damage"><span class="eyebrow">📷 AI DAMAGE CHECK</span><h2>ぶつけた。擦った。<br>まず写真を撮る。</h2><p>見える損傷をAIが整理。修理方法の候補と参考価格帯を確認し、そのまま対応店舗へ写真付きで相談できます。</p><div class="steps"><div class="step">📷<b>01 撮影</b><span>キズ・へこみを撮る</span></div><div class="step">🔍<b>02 AI整理</b><span>損傷・修理候補</span></div><div class="step">¥<b>03 概算</b><span>参考価格帯</span></div><div class="step">📅<b>04 予約</b><span>店舗へ送信</span></div></div><button class="primary" onclick="consult('body')">キズ・へこみを相談する</button></section><div class="safe">🛡️<div><b>AIは「断定」より「次にどうするか」を案内</b><span>危険な兆候は安全側へ。正式な故障診断・修理費・部品適合は専門店やメーカー情報で最終確認します。</span></div></div>${nav()}`}function consultation(){const d=data[state.type];if(!state.sent)return `<section class="page"><button class="back" onclick="go('home')">← 戻る</button><div class="head"><div class="orb">✦</div><div><small>CAR MATE AI</small><h1>${d.name}</h1><p>マイカー情報をもとに整理します</p></div></div><div class="bubble">どんなことが気になっていますか？写真や動画があれば一緒に送れます。</div><div class="upload">📷<b>写真・動画を追加</b><span>デモではアップロード動作を再現</span></div><textarea>${d.q}</textarea><button class="primary" style="width:100%" onclick="state.sent=true;render();scrollTo(0,0)">✦ AIに相談する</button></section>`;return `<section class="page"><button class="back" onclick="state.sent=false;render()">← 戻る</button><div class="head"><div class="orb">✓</div><div><small>AI ANALYSIS</small><h1>${d.name}</h1><p>相談内容を事前整理しました</p></div></div><div class="result"><div class="rtop"><div>✓</div><div class="grow"><small>AI整理結果</small><h2>${d.title}</h2></div><span class="tag">${d.level}</span></div><p>${d.body}</p><div class="checks"><b>確認したいポイント</b>${d.checks.map(x=>`<div>• ${x}</div>`).join('')}</div><div class="price"><b>費用・対策の目安</b>${d.price}</div>${state.type==='custom'?`<div class="miniVisual"><div class="mv"><small>現在</small><div class="miniCar">🚙</div></div><b>→</b><div class="mv after"><small>変更イメージ</small><div class="miniCar">🚙</div><b>-30mm</b></div></div>`:''}<div class="warn">⚠ AIの内容は事前整理です。正式な診断・適合・見積は専門店で確認します。</div><button class="primary" style="width:100%" onclick="reserve()">🏪 この内容で店舗に相談する</button></div></section>`}function reservePage(){if(state.done)return `<section class="page"><button class="back" onclick="go('home')">← ホーム</button><div class="done"><div class="big">✓</div><h2>予約相談を送信しました</h2><p>店舗が内容を確認後、予約確定または別時間を提案します。</p><div class="sendInfo">デモ：通常はここで店舗通知・顧客通知へ連携</div><button class="primary" onclick="go('home')">ホームへ戻る</button></div></section>`;return `<section class="page"><button class="back" onclick="state.view='consult';render()">← 戻る</button><div class="head"><div class="orb">📅</div><div><small>SHOP CONNECT</small><h1>店舗へ相談・予約</h1><p>症状とAI整理結果をそのまま送信</p></div></div><div class="reserve"><div class="shop"><div class="shopIcon">🏪</div><div><b>デモモータース</b><span>📍 近隣店舗・デモ表示</span></div></div><h3>希望日時</h3><div class="slots">${['9/16 10:00','9/16 14:00','9/17 09:00'].map((x,i)=>`<button class="${state.slot===i?'sel':''}" onclick="state.slot=${i};render()">${x}</button>`).join('')}</div><div class="sendInfo"><b>店舗に送る内容</b><br>車両情報 / 相談内容 / AI整理結果 / 写真・動画 / 希望日時</div><button class="primary" style="width:100%" onclick="state.done=true;render();scrollTo(0,0)">予約相談を送信する</button></div></section>`}function mycar(){return `<header><div class="brand"><div class="logo">🚘</div><b>CAR MATE <i>AI</i></b></div></header><section class="page"><span class="eyebrow">MY CAR</span><h1>マイカー</h1><div class="vehicle"><div class="vArt">🚙</div><div><h2>NISSAN ROOX</h2><p style="color:#78828c;font-size:10px">2021年式 / 58,240 km</p><div class="chips"><span>純正15inch</span><span>車高調</span><span>ドラレコ</span></div></div></div><div class="list"><div><b>次回オイル交換</b><span>60,000km目安</span></div><div><b>タイヤ</b><span>165/55R15</span></div><div><b>最終メンテナンス</b><span>2026/08/12</span></div></div></section>${nav()}`}function history(){return `<header><div class="brand"><div class="logo">🚘</div><b>CAR MATE <i>AI</i></b></div></header><section class="page"><span class="eyebrow">HISTORY</span><h1>相談・整備履歴</h1><div class="list"><div><b>9/14 ローダウン後のフェンダー干渉を相談</b><span>カスタム相談</span></div><div><b>9/02 右前の異音を相談</b><span>店舗点検を推奨</span></div><div><b>8/12 エンジンオイル交換</b><span>58,240km</span></div></div></section>${nav()}`}function render(){document.getElementById('root').innerHTML=`<div class="app">${state.view==='home'?home():state.view==='consult'?consultation():state.view==='reserve'?reservePage():state.view==='car'?mycar():history()}</div>`}render();</script></body></html>
